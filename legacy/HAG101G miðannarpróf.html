  const days = Math.floor(d / 864e5), h = Math.floor((d % 864e5) / 3600e3), m = Math.floor((d % 3600e3) / 60e3);
  return `Prófið hefst eftir <b>${days ? days + ' d. ' : ''}${h} klst.${days ? '' : ' ' + m + ' mín.'}</b> · fim. 5. nóv. kl. 16:00`;
}

// ======================= SKRIFLEG DÆMI =======================
const PR = {filtOpen: window.innerWidth > 720, topics: new Set(ORDER), kind:'all', review:false, cur:null, recent:[], n:0, p:0, m:0};
function wPool(){ if (PR.review) return W_ENTRIES.filter(e => e.key in S.wrong); return W_ENTRIES.filter(e => PR.topics.has(e.t) && (PR.kind === 'all' || e.kind === PR.kind)); }
function nextW(){
  const pool = wPool(); if (!pool.length) { PR.cur = null; return; }
  const e = weightedPick(pool, PR.recent, S.st); const it = instW(e.key);
  PR.cur = {...it, st: it.steps.map(() => 0), mk: it.steps.map(() => null), done:false};
  PR.recent.push(e.key); if (PR.recent.length > Math.min(12, Math.floor(pool.length / 2))) PR.recent.shift();
}
function stepsHTML(it, opts = {}){
  return it.steps.map((s, i) => { const state = opts.all ? 2 : it.st[i]; const mk = it.mk[i];
    const cls = state === 2 ? (mk === true ? 'ok' : mk === false ? 'miss' : '') : 'locked';
    const head = `<header><span class="no">${i + 1}</span><span class="ttl">${state >= 1 ? s.titill : '<span class="muted">Skref falið</span>'}</span><span class="pts">${s.stig} stig</span></header>`;
    const markBtns = opts.noMark ? '' : `<div class="mark">${mk === null ? '<span class="hint">Hafðir þú þetta skref rétt?</span>' : ''}<button class="btn small good" data-mk="${i}" data-v="1" aria-pressed="${mk === true}">${mk === true ? '✓ Rétt' : 'Rétt hjá mér'}</button><button class="btn small bad" data-mk="${i}" data-v="0" aria-pressed="${mk === false}">${mk === false ? '✗ Vantaði' : 'Vantaði eða rangt'}</button></div>`;
    return `<div class="sstep ${cls}" data-i="${i}">${head}${state === 2 ? `<div class="body">${s.lausn}${markBtns}</div>` : ''}</div>`; }).join('');
}
const tagOf = kind => kind === 'old' ? 'old' : kind === 'gen' ? 'gen' : kind === 'blad' ? 'old' : '';
function renderPractice(o){
  if (o.topics) { PR.topics = new Set(o.topics); PR.review = false; PR.cur = null; PR.kind = o.kind || 'all'; }
  else if (o.kind) { PR.kind = o.kind; PR.review = false; PR.cur = null; PR.topics = new Set(ORDER); }
  if (o.review) { PR.review = true; PR.cur = null; }
  if (!PR.cur) nextW(); drawPractice();
}
function drawPractice(){
  const chips = PR.review ? `<div class="row"><span class="tag" style="background:var(--bad-weak);color:var(--bad)">Villubanki · ${W_ENTRIES.filter(e => e.key in S.wrong).length} skrifleg eftir</span><button class="btn small" data-act="exitrev">Hætta í villubanka</button></div>`
    : `<details class="filt" ${PR.filtOpen ? 'open' : ''}><summary>Flokkar: ${PR.topics.size === ORDER.length ? 'allir' : [...PR.topics].map(t => TOPICS[t].n).join(', ')}</summary><div class="chips">${ORDER.map(t => `<button class="chip" data-t="${t}" aria-pressed="${PR.topics.has(t)}">${TOPICS[t].n}</button>`).join('')}</div></details>
      <div class="row" style="justify-content:space-between"><div class="seg">${Object.keys(KIND_LABEL).map(k => `<button data-k="${k}" aria-pressed="${PR.kind === k}">${KIND_LABEL[k]}</button>`).join('')}</div>
      <div class="row hint"><button class="chip" data-act="allt">Allir flokkar</button><span class="mono">${wPool().length} í pottinum</span></div></div>`;
  let body;
  if (!PR.cur) body = `<div class="qcard empty">${PR.review ? 'Engin skrifleg dæmi í villubankanum.' : 'Ekkert dæmi passar við valið.'}</div>`;
  else { const c = PR.cur; const tot = totStig(c.steps); const shown = c.st.filter(x => x === 2).length; const allMarked = c.mk.every(x => x !== null); const got = c.steps.reduce((s, x, i) => s + (c.mk[i] ? x.stig : 0), 0);
    const ctrl = allMarked ? `<div class="result"><span class="verdict ${got === tot ? 'ok' : 'no'}">${got}/${tot} stig</span><span class="hint">${got === tot ? 'Fullt hús.' : 'Dæmið fer í villubankann og kemur aftur' + (c.kind === 'gen' ? ' með nýjum tölum.' : '.')}</span><button class="btn primary" data-act="next" style="margin-left:auto">Næsta dæmi <kbd style="margin-left:6px">Enter</kbd></button></div>`
      : `<div class="row"><button class="btn small" data-act="hint" ${c.st.every(x => x >= 1) ? 'disabled' : ''}>Vísbending <kbd>H</kbd></button><button class="btn small" data-act="step" ${shown === c.steps.length ? 'disabled' : ''}>Næsta skref <kbd>N</kbd></button><button class="btn small" data-act="all" ${shown === c.steps.length ? 'disabled' : ''}>Sýna alla lausnina <kbd>A</kbd></button>${shown === c.steps.length ? '<button class="btn small good" data-act="allok">Allt rétt hjá mér</button>' : ''}<button class="btn small" data-act="skip" style="margin-left:auto">Sleppa</button></div>`;
    body = `<div class="qcard" id="qc"><div class="qmeta"><span class="eyebrow">${TOPICS[c.t].n}</span><span class="tag ${tagOf(c.kind)}">${esc(c.src)}</span></div>
      <div class="qtext">${c.q}</div>
      <div class="solhead"><span class="hint">Leystu á blað fyrst. Lausnin er í ${c.steps.length} skrefum, ${tot} stig.</span><span class="hint mono">Lota: ${fmt1(PR.p)}/${PR.m} stig</span></div>
      ${ctrl}<div class="steps">${stepsHTML(c)}</div></div>`; }
  render(`<div class="stack"><div class="row" style="justify-content:space-between"><h2>${PR.review ? 'Villurnar þínar: skrifleg' : 'Skrifleg dæmi'}</h2></div>${chips}${body}</div>`);
  const fd = document.querySelector('details.filt'); if (fd) fd.addEventListener('toggle', () => { PR.filtOpen = fd.open; });
  $('#app').onclick = e => {
    const mk = e.target.closest('[data-mk]'); if (mk) return markStep(+mk.dataset.mk, mk.dataset.v === '1');
    const chip = e.target.closest('.chip[data-t]'); if (chip) { const t = chip.dataset.t; if (PR.topics.has(t) && PR.topics.size > 1) PR.topics.delete(t); else PR.topics.add(t); PR.cur = null; nextW(); return drawPractice(); }
    const seg = e.target.closest('.seg button'); if (seg) { PR.kind = seg.dataset.k; PR.cur = null; nextW(); return drawPractice(); }
    const a = e.target.closest('[data-act]'); if (!a || a.disabled) return; practiceAct(a.dataset.act);
  };
}
function practiceAct(act){
  const c = PR.cur;
  if (act === 'next' || act === 'skip') { nextW(); drawPractice(); window.scrollTo(0, 0); return; }
  if (act === 'allt') { PR.topics = new Set(ORDER); PR.cur = null; nextW(); return drawPractice(); }
  if (act === 'exitrev') { PR.review = false; PR.cur = null; nextW(); return drawPractice(); }
  if (!c) return;
  if (act === 'hint') { const i = c.st.findIndex(x => x === 0); if (i >= 0) c.st[i] = 1; }
  if (act === 'step') { const i = c.st.findIndex(x => x < 2); if (i >= 0) c.st[i] = 2; }
  if (act === 'all') c.st = c.st.map(() => 2);
  if (act === 'allok') { c.mk = c.mk.map(() => true); return finishPractice(); }
  drawPractice();
  const i = act === 'step' ? c.st.lastIndexOf(2) : -1; if (i >= 0) { const el = document.querySelector(`.sstep[data-i="${i}"]`); if (el && el.getBoundingClientRect().bottom > innerHeight) el.scrollIntoView({block:'nearest', behavior:'smooth'}); }
}
function markStep(i, ok){ const c = PR.cur; if (!c || c.done) { if (c) { c.mk[i] = ok; drawPractice(); } return; } c.mk[i] = ok; if (c.mk.every(x => x !== null)) return finishPractice(); drawPractice(); }

  if (!c.done) { c.done = true; PR.n++; PR.p += got; PR.m += tot; recordW(c, got, tot); } drawPractice(); }

// ======================= HRAÐÆFING =======================
const QZ = {topics: new Set(ORDER), review:false, cur:null, given:null, ok:null, recent:[], n:0, c:0, showSol:false};
function qPool(){ if (QZ.review) return Q_ENTRIES.filter(e => e.key in S.wrong); return Q_ENTRIES.filter(e => QZ.topics.has(e.t)); }
function nextQ(){ const pool = qPool(); if (!pool.length) { QZ.cur = null; return; } const e = weightedPick(pool, QZ.recent, S.qs); QZ.cur = instQ(e.key); QZ.given = null; QZ.ok = null; QZ.showSol = false; QZ.recent.push(e.key); if (QZ.recent.length > Math.min(20, Math.floor(pool.length / 2))) QZ.recent.shift(); }
function renderQuick(o){ if (o.topics) { QZ.topics = new Set(o.topics); QZ.review = false; QZ.cur = null; } if (o.review) { QZ.review = true; QZ.cur = null; } if (!QZ.cur) nextQ(); drawQuick(); }

  let body; const c = QZ.cur;
  if (!c) body = `<div class="qcard empty">${QZ.review ? 'Engar hraðspurningar í villubankanum.' : 'Engin spurning passar við valið.'}</div>`;
  else { const rev = QZ.ok !== null;
    const input = c.o ? `<div class="opts">${c.o.map((o, i) => { let cls = 'opt'; if (rev) { if (i === c.a) cls += ' right'; else if (i === QZ.given) cls += ' wrong'; } return `<button class="${cls}" data-i="${i}" ${rev ? 'disabled' : ''}><span class="k">${LET[i]}</span><span>${o}</span></button>`; }).join('')}</div>`
      : `<form class="ansrow" id="qf" autocomplete="off"><label class="hint" for="ans">Svar</label><input id="ans" class="ans-in ${rev ? (QZ.ok ? 'r' : 'w') : ''}" inputmode="text" placeholder="t.d. -3/2" value="${rev ? esc(QZ.given) : ''}" ${rev ? 'readonly' : ''}><button class="btn primary" type="submit" ${rev ? 'hidden' : ''}>Athuga <kbd style="margin-left:6px">Enter</kbd></button></form><p class="hint">Heiltala, brot (−3/2) eða tugabrot (0,25). Brot eru borin saman sem brot, svo 6/4 = 3/2.</p>`;

      ${c.steps ? (QZ.showSol ? `<div class="qtext">${c.full}</div><div class="steps">${c.steps.map(s => `<div class="sstep"><header><span class="ttl">${s.titill}</span></header><div class="body">${s.lausn}</div></div>`).join('')}</div>` : '<button class="btn small" data-act="sol" style="width:fit-content">Sýna allan útreikninginn</button>') : ''}

    const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
    if (act === 'next' || act === 'skip') { nextQ(); drawQuick(); }
    if (act === 'allt') { QZ.topics = new Set(ORDER); QZ.cur = null; nextQ(); drawQuick(); }

function answerQuick(v){

// ======================= PRÓF =======================
function pickFor(ts, onlyGen, used){
  const pool = W_ENTRIES.filter(e => ts.includes(e.t) && !used.includes(e.key) && (onlyGen ? e.kind === 'gen' : (e.kind === 'gen' || totStig(BYID[e.key].steps) >= 5)));
  return weightedPick(pool, [], S.st).key;
}
function buildExam(kind){
  let items = [], label;
  if (kind === 'old') { label = 'Gömlu lokaprófsliðirnir'; items = OLD_EXAM.map(k => ({...instW(k), w: BYID[k].exam})); }
  else { label = kind === 'gen' ? 'Rafalapróf' : 'Blandað próf'; const used = [];
    for (const sec of BLUEPRINT) { const k = pickFor(sec.ts, kind === 'gen', used); used.push(k); items.push({...instW(k), w: sec.w}); } }
  S.exam = {kind, label, items, mk: items.map(it => it.steps.map(() => null)), start: Date.now(), dur: 90 * 60e3, phase:'write'};
  save();
}
function renderExam(o){ if (o.start && !S.exam) buildExam(o.start); if (!S.exam) return drawExamSetup(); if (S.exam.phase === 'write') drawExamWrite(); else drawExamGrade(); }

  const last = S.hist.slice(-8).reverse().map(h => `<tr><td>${h.label}</td><td class="mono">${fmt1(h.score)}/${h.tot}</td><td style="width:35%">${bar(h.score / h.tot)}</td><td class="hint">${new Date(h.at).toLocaleDateString('is-IS', {day:'numeric', month:'short'})}</td></tr>`).join('');
  render(`<div class="stack"><h2>Próf á tíma</h2>
    <p class="muted" style="max-width:62ch">Eins og á fimmtudaginn: dæmin birtast öll í einu, þú skrifar á blað og skilar þegar 90 mínútur eru liðnar eða þú ert búinn. Þá birtast lausnirnar og þú gefur þér stig skref fyrir skref.</p>
    <div class="actions">
      <button class="action main" data-k="mix"><h3>Blandað próf <span class="mono">6 · 90:00</span></h3><p>Fylki 15, ákveða/andhverfa 20, jöfnukerfi 20, diffrun 15, Hessian 15, mismunur 15. Ný samsetning í hvert sinn.</p></button>
      <button class="action" data-k="old"><h3>Lokaprófsliðirnir <span class="mono">7 · 90:00</span></h3><p>Allir liðir úr lokaprófum 2023 og 2025 sem falla undir efnið, með upprunalegu vægi (97 stig).</p></button>
      <button class="action" data-k="gen"><h3>Rafalapróf <span class="mono">6 · 90:00</span></h3><p>Sama vægi og blandaða prófið en eingöngu dæmi með nýjum tölum.</p></button>
    </div>
    ${last ? `<div class="panel"><h3 style="margin-bottom:8px">Fyrri próf</h3><div class="scroll"><table class="tt"><tbody>${last}</tbody></table></div></div>` : ''}</div>`);
  $('#app').onclick = e => { const b = e.target.closest('[data-k]'); if (b) { buildExam(b.dataset.k); drawExamWrite(); window.scrollTo(0, 0); } };
}
function drawExamWrite(){
  const X = S.exam; const tot = X.items.reduce((s, it) => s + it.w, 0);
  const list = X.items.map((it, i) => `<div class="qcard exam-q" id="eq${i}"><div class="qmeta"><span class="eyebrow">Dæmi ${i + 1} · ${TOPICS[it.t].n}</span><span class="wt">${it.w} stig</span></div><div class="qtext">${it.q}</div></div>`).join('');
  render(`<div class="stack">
    <div class="timer"><span class="clock" id="clk">--:--</span><div class="tbar"><i id="tb" style="width:100%"></i></div><button class="btn small primary" data-act="submit">Skila</button></div>
    <p class="notice">Skrifaðu allar lausnir á blað með millireikningum. Engin reiknivél. ${X.label}, ${X.items.length} dæmi, ${tot} stig.</p>
    ${list}
    <div class="row"><button class="btn primary" data-act="submit">Skila og fara yfir</button><button class="btn small" data-act="quit">Hætta við prófið</button></div></div>`);
  setTopH();
  $('#app').onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; const act = a.dataset.act;
    if (act === 'submit') { if (a.dataset.sure !== '1' && Date.now() - X.start < X.dur - 60e3) { document.querySelectorAll('[data-act="submit"]').forEach(b => { b.dataset.sure = '1'; b.textContent = `Skila núna? ${fmtDur(X.dur - (Date.now() - X.start))} eftir`; }); return; } toGrade(false); }
    if (act === 'quit') { if (a.dataset.sure !== '1') { a.dataset.sure = '1'; a.textContent = 'Smelltu aftur til að henda prófinu'; return; } S.exam = null; save(); drawExamSetup(); } };
  tick(); clearInterval(timerHandle); timerHandle = setInterval(tick, 1000);
}
function tick(){
  const X = S.exam; if (!X || X.phase !== 'write') return; const left = X.dur - (Date.now() - X.start);
  const c = $('#clk'), b = $('#tb'); if (!c) return;
  c.textContent = fmtDur(left); c.classList.toggle('low', left < 10 * 60e3); b.style.width = Math.max(0, left / X.dur * 100) + '%';
  if (left <= 0) toGrade(true);
}
function toGrade(timeout){ clearInterval(timerHandle); const X = S.exam; X.phase = 'grade'; X.used = Math.min(X.dur, Date.now() - X.start); X.timeout = !!timeout; save(); drawExamGrade(); window.scrollTo(0, 0); }
function examScore(X){ return X.items.map((it, i) => { const m = totStig(it.steps); const p = it.steps.reduce((s, x, j) => s + (X.mk[i][j] ? x.stig : 0), 0); return {p, m, pts: it.w * p / m}; }); }
function drawExamGrade(){
  const X = S.exam; const sc = examScore(X); const left = X.mk.flat().filter(v => v === null).length; const total = X.mk.flat().length;
  const list = X.items.map((it, i) => { const fake = {steps: it.steps, st: it.steps.map(() => 2), mk: X.mk[i]};
    return `<div class="qcard exam-q" id="eq${i}"><div class="qmeta"><span class="eyebrow">Dæmi ${i + 1} · ${TOPICS[it.t].n}</span><span class="wt">${fmt1(sc[i].pts)}/${it.w} stig</span></div><div class="qtext">${it.q}</div><div class="steps" data-ex="${i}">${stepsHTML(fake)}</div></div>`; }).join('');
  render(`<div class="stack">
    <span class="eyebrow">${X.label}${X.timeout ? ' · tíminn rann út' : ''} · ${fmtDur(X.used)} notaðar</span>
    <h2>Gefðu þér stig</h2>
    <p class="muted" style="max-width:62ch">Berðu blaðið þitt saman við hvert skref og hakaðu heiðarlega. Rétt aðferð með reikningsvillu í lokin fær stig fyrir fyrri skrefin, eins og á prófinu.</p>
    <div class="timer"><span class="hint mono">${total - left}/${total} skref metin</span><div class="tbar"><i style="width:${(total - left) / total * 100}%"></i></div><button class="btn small primary" data-act="finish">Ljúka yfirferð</button></div>
    ${list}
    <button class="btn primary" data-act="finish" style="width:fit-content">Ljúka yfirferð</button></div>`);
  setTopH();
  $('#app').onclick = e => {
    const mk = e.target.closest('[data-mk]'); if (mk) { const ex = +mk.closest('[data-ex]').dataset.ex; const y = window.scrollY; X.mk[ex][+mk.dataset.mk] = mk.dataset.v === '1'; save(); drawExamGrade(); window.scrollTo(0, y); return; }
    const a = e.target.closest('[data-act="finish"]'); if (!a) return;
    const left2 = X.mk.flat().filter(v => v === null).length;
    if (left2 && a.dataset.sure !== '1') { document.querySelectorAll('[data-act="finish"]').forEach(b => { b.dataset.sure = '1'; b.textContent = `${left2} skref ómetin teljast röng. Ljúka samt?`; }); return; }
    finishExam();
  };
}
function finishExam(){
  const X = S.exam; const sc = examScore(X); const tot = X.items.reduce((s, it) => s + it.w, 0); const score = sc.reduce((s, x) => s + x.pts, 0);
  X.items.forEach((it, i) => recordW(it, sc[i].p, sc[i].m));
  const res = {label: X.label, score, tot, at: Date.now(), used: X.used, timeout: X.timeout, items: X.items, mk: X.mk, sc};
  S.last = {label: X.label, score, tot}; S.hist.push({label: X.label, score, tot, at: res.at}); S.exam = null; save();
  drawResult(res); window.scrollTo(0, 0);
}
function drawResult(res){
  const grade = fmt1(res.score / res.tot * 10);
  const by = {}; res.items.forEach((it, i) => { const b = by[it.t] = by[it.t] || {p:0, w:0}; b.p += res.sc[i].pts; b.w += it.w; });
  const rows = Object.keys(by).sort((a, b) => by[a].p / by[a].w - by[b].p / by[b].w).map(t => `<tr><td>${TOPICS[t].n}</td><td class="mono">${fmt1(by[t].p)}/${by[t].w}</td><td style="width:40%">${bar(by[t].p / by[t].w)}</td></tr>`).join('');
  const list = res.items.map((it, i) => { const s = res.sc[i]; const full = s.p === s.m;
    return `<details class="rv" ${full ? '' : 'open'}><summary><span class="dot ${full ? 'g' : s.p ? 'n' : 'b'}"></span><span class="mono">${i + 1}.</span><span style="min-width:0">${esc(plain(it.q).slice(0, 80))}…</span><span class="tag" style="margin-left:auto">${fmt1(s.pts)}/${it.w}</span></summary>
      <div><div class="qtext">${it.q}</div><div class="steps">${stepsHTML({steps: it.steps, st: it.steps.map(() => 2), mk: res.mk[i]}, {noMark:true})}</div></div></details>`; }).join('');
  render(`<div class="stack">
    <span class="eyebrow">${res.label}${res.timeout ? ' · tíminn rann út' : ''} · ${fmtDur(res.used)} notaðar</span>
    <div class="score"><b class="mono">${fmt1(res.score)}/${res.tot}</b><span class="muted">≈ ${grade} í einkunn · ${res.items.filter((_, i) => res.sc[i].p < res.sc[i].m).length} dæmi í villubankann</span></div>
    <div class="panel"><h3 style="margin-bottom:6px">Eftir flokkum</h3><div class="scroll"><table class="tt"><tbody>${rows}</tbody></table></div></div>
    <div class="row"><button class="btn primary" data-act="wrong">Æfa villurnar núna</button><button class="btn" data-act="again">Nýtt próf</button></div>
    <h3>Yfirferð</h3><div class="stack" style="gap:8px">${list}</div></div>`);
  $('#app').onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; if (a.dataset.act === 'wrong') go('practice', {review:true}); if (a.dataset.act === 'again') go('exam'); };
  // MathJax inni í lokuðum details: endurkeyra þegar opnað
  document.querySelectorAll('details.rv').forEach(d => d.addEventListener('toggle', () => { if (d.open) mj(d); }));
}

// ======================= VILLUR =======================
function renderWrong(){
  const keys = Object.keys(S.wrong);
  if (!keys.length) { render(`<div class="stack"><h2>Villubankinn</h2><div class="panel empty">Engar villur skráðar enn. Skriflegt dæmi lendir hér ef eitthvert skref vantaði og fer út þegar þú færð fullt hús tvisvar í röð. Sama gildir um hraðspurningar.</div></div>`); $('#app').onclick = null; return; }
  const wk = keys.filter(k => !isQuickKey(k)), qk = keys.filter(isQuickKey);
  const label = k => { if (BYID[k]) return BYID[k].src + ': ' + plain(BYID[k].q); if (GENBY[k]) return 'Rafall: ' + GENBY[k].name; if (QBYID[k]) return plain(QBYID[k].q); if (k.startsWith('q:')) return 'Rafall: ' + GENBY[k.slice(2)].name; return k; };
  const tOf = k => (BYID[k] || GENBY[k] || QBYID[k] || GENBY[k.slice(2)] || {}).t;
  const block = (list, title) => { const by = {}; list.forEach(k => (by[tOf(k)] = by[tOf(k)] || []).push(k));
    return ORDER.filter(t => by[t]).map(t => `<div class="panel stack" style="gap:8px"><div class="row" style="justify-content:space-between"><h3>${TOPICS[t].n}</h3><span class="mono hint">${by[t].length} ${title}</span></div>
      <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${by[t].map(k => { const txt = label(k); return `<li class="hint"><span class="mono">${S.wrong[k] ? '1/2 ✓ ' : ''}</span>${esc(txt.slice(0, 120))}${txt.length > 120 ? '…' : ''}</li>`; }).join('')}</ul></div>`).join(''); };
  render(`<div class="stack"><div class="row" style="justify-content:space-between"><h2>Villubankinn <span class="mono muted">${keys.length}</span></h2>
    <div class="row">${wk.length ? `<button class="btn primary" data-act="w">Æfa skrifleg (${wk.length})</button>` : ''}${qk.length ? `<button class="btn" data-act="q">Æfa hraðspurningar (${qk.length})</button>` : ''}</div></div>
    <p class="muted">Rafalsdæmi koma aftur með nýjum tölum, svo þú æfir aðferðina en ekki svarið.</p>${block(wk, 'skrifleg')}${block(qk, 'hraðspurn.')}</div>`);
  $('#app').onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; if (a.dataset.act === 'w') go('practice', {review:true}); if (a.dataset.act === 'q') go('quick', {review:true}); };
}

// ======================= BLAÐIÐ =======================
function renderSheet(o){ render(`<div class="sheet">${SHEET}</div>`); $('#app').onclick = null; if (o && o.sec) { const el = document.getElementById(o.sec); if (el) setTimeout(() => el.scrollIntoView({block:'start'}), 50); } }

// ======================= ÁÆTLUN =======================
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function renderPlan(){
  const today = todayStr(); let done = 0, all = 0;
  const days = PLAN.map((day, di) => { const cls = day.d === today ? 'today' : day.d < today ? 'past' : '';
    const items = day.items.map((s, i) => { const id = day.d + ':' + i; const ok = !!S.plan[id]; if (!s.brk) { all++; if (ok) done++; }
      return `<li><div class="step ${s.brk ? 'brk' : ''} ${s.exam ? 'exam' : ''} ${ok ? 'done' : ''}"><div class="tm">${s.at}<small>${s.m} mín.</small></div>
        <div style="min-width:0"><h3>${s.h}</h3>${s.p ? `<p>${s.p}</p>` : ''}${s.go ? `<button class="btn small go" data-go="${di}:${i}">Opna</button>` : ''}</div>
        ${s.brk ? '<span></span>' : `<input type="checkbox" id="pl-${id}" data-id="${id}" ${ok ? 'checked' : ''} aria-label="Lokið: ${esc(s.h)}">`}</div></li>`; }).join('');
    return `<section class="day ${cls}" id="d-${day.d}"><header><h2>${day.h}</h2><span class="cal">${day.cal}</span></header>${day.note ? `<p class="dnote">${day.note}</p>` : ''}<ol>${items}</ol></section>`; }).join('');
  render(`<div class="stack plan">
    <div class="stack" style="gap:6px"><span class="eyebrow">27. okt. – 5. nóv.</span><h1>Áætlun fram að prófi</h1></div>
    <p class="muted" style="max-width:62ch">Byggð á Google Calendar og Ugla-stundatöflunni þinni og vöktunum á Laugó. Hver lærdómsblokk skiptist í tvennt með hléi á milli. Tvö heil próf á pappír, sunnudag og þriðjudag, og léttur prófdagur.</p>
    <div class="panel row" style="justify-content:space-between"><span><b class="mono">${done}/${all}</b> blokkir búnar</span><div class="bar" style="flex:1;max-width:320px"><i style="width:${all ? done / all * 100 : 0}%"></i></div></div>
    ${days}
    <button class="btn small" data-act="reset" style="width:fit-content">Hreinsa hök</button></div>`);
  $('#app').onclick = e => {
    const g = e.target.closest('[data-go]'); if (g) { const [di, i] = g.dataset.go.split(':').map(Number); const gs = PLAN[di].items[i].go; const {v, ...rest} = gs;
      if (v === 'exam' && rest.start && S.exam) return go('exam'); return go(v, rest); }
    if (e.target.closest('[data-act="reset"]')) { S.plan = {}; save(); renderPlan(); }
  };
  $('#app').onchange = e => { if (e.target.dataset.id) { S.plan[e.target.dataset.id] = e.target.checked; save(); const y = scrollY; renderPlan(); scrollTo(0, y); } };
  const t = document.getElementById('d-' + today); if (t) setTimeout(() => t.scrollIntoView({block:'start'}), 30);
}

// ---------- lyklaborð ----------
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (view === 'practice' && PR.cur) {
    const c = PR.cur; const firstOpen = c.st.findIndex((x, i) => x === 2 && c.mk[i] === null);
    if (k === 'h') practiceAct('hint'); else if (k === 'n') practiceAct('step'); else if (k === 'a') practiceAct('all');
    else if ((k === 'r' || k === 'v') && firstOpen >= 0) markStep(firstOpen, k === 'r');
    else if (e.key === 'Enter' && c.mk.every(x => x !== null)) { e.preventDefault(); practiceAct('next'); }
  } else if (view === 'quick' && QZ.cur) {
    const n = {'1':0, '2':1, '3':2, '4':3, '5':4, 'a':0, 'b':1, 'c':2, 'd':3, 'e':4}[k];
    if (QZ.cur.o && n !== undefined && QZ.ok === null && n < QZ.cur.o.length) answerQuick(n);
    else if (e.key === 'Enter' && QZ.ok !== null) { e.preventDefault(); nextQ(); drawQuick(); }
  }
});
document.addEventListener('keydown', e => { if (view === 'quick' && e.key === 'Enter' && e.target.id === 'ans' && QZ.ok !== null) { e.preventDefault(); nextQ(); drawQuick(); } });

updateWrongPill(); setTopH();
go(S.exam ? 'exam' : 'home');

})();
</script>

</body></html>
