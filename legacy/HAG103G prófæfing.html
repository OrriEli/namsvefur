<style>
/* Útlit: prófblað á steingráum grunni; ein dálkalína, efnisstikur efst, svörin stór og snertivæn. */
:root{
  --bg:#e9eeec; --paper:#fbfcfb; --ink:#14232a; --muted:#56676d; --line:#cdd7d4; --soft:#dfe7e4;
  --accent:#0d6a5a; --accent-ink:#ffffff; --accent-weak:#d5ebe5;
  --good:#1d7a3a; --good-weak:#dcefe1; --bad:#b0281f; --bad-weak:#f6e0dd; --warn:#a35f00; --warn-weak:#f6ead6;
  --f-display:"Zilla Slab", Rockwell, "Roboto Slab", Georgia, serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --paper:#152024; --ink:#e3ecea; --muted:#93a6a8; --line:#2a3b3f; --soft:#1c2a2e;
  --accent:#4cc3a6; --accent-ink:#06211b; --accent-weak:#163a33;
  --good:#5fd07f; --good-weak:#163423; --bad:#ff8a7d; --bad-weak:#3a1b18; --warn:#f2b552; --warn-weak:#3a2b12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --paper:#152024; --ink:#e3ecea; --muted:#93a6a8; --line:#2a3b3f; --soft:#1c2a2e;
  --accent:#4cc3a6; --accent-ink:#06211b; --accent-weak:#163a33;
  --good:#5fd07f; --good-weak:#163423; --bad:#ff8a7d; --bad-weak:#3a1b18; --warn:#f2b552; --warn-weak:#3a2b12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.2rem;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:.04em}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{font:inherit;font-size:.9rem;font-weight:500;border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:8px;cursor:pointer}

nav button:hover{color:var(--ink)}
nav .pill{font-family:var(--f-mono);font-size:.72rem;background:var(--bad-weak);color:var(--bad);border-radius:99px;padding:0 6px;margin-left:4px}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);font-weight:700}
h2{font-size:1.35rem;font-weight:600}

p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{font:inherit;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:var(--r);cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--muted)}

.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:6px 12px;min-height:34px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero{display:grid;gap:14px;padding-block:6px 4px}
.count{font-family:var(--f-mono);font-size:.95rem;display:inline-flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px 12px;width:fit-content}

.action{display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;min-width:0}
.action:hover{border-color:var(--accent)}
.action h3{display:flex;justify-content:space-between;gap:8px}
.action p{font-size:.9rem;color:var(--muted)}

.action.main p{color:var(--accent-ink);opacity:.85}
.tt{width:100%;border-collapse:collapse;font-size:.92rem}

.tt td{padding:9px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tt tr:last-child td{border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:60px}

.bar.lo i{background:var(--bad)} .bar.mid i{background:var(--warn)}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--paper);color:var(--muted);padding:5px 11px;border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-weak);border-color:var(--accent);color:var(--ink)}
.btn.primary kbd{background:transparent;color:inherit;border-color:currentColor;opacity:.75}
details.filt>summary{cursor:pointer;font-size:.88rem;color:var(--muted);padding:4px 0;width:fit-content}
details.filt[open]>summary{margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:.85rem;border:0;background:var(--paper);color:var(--muted);padding:7px 12px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-weak);color:var(--ink);font-weight:600}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.tag.old{background:var(--warn-weak);color:var(--warn)}
.tag.gen{background:var(--accent-weak);color:var(--accent)}
.qtext{font-size:1.06rem;line-height:1.6;min-width:0}
.qtext b{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-weak)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:.82rem;flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.opt span:last-child{min-width:0}
.opt.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.sel .k{background:var(--ink);color:var(--paper)}
.opt.right{border-color:var(--good);background:var(--good-weak)}
.opt.right .k{background:var(--good);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-weak)}
.opt.wrong .k{background:var(--bad);color:var(--paper)}
.opt:disabled{cursor:default}
.verdict{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}
.expl{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px;line-height:1.6}
.f{font-family:var(--f-mono);font-size:.9rem;background:var(--soft);border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;line-height:1.75;white-space:nowrap}
table.dt{border-collapse:collapse;font-family:var(--f-mono);font-size:.85rem;margin:10px 0;font-variant-numeric:tabular-nums;display:block;overflow-x:auto;max-width:100%}
table.dt th,table.dt td{border:1px solid var(--line);padding:4px 10px;text-align:right;white-space:nowrap}
table.dt th{background:var(--soft);font-weight:500;text-align:center}
table.dt td:first-child{text-align:left}
.hint{font-size:.82rem;color:var(--muted)}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--paper)}
.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.tbar{flex:1 1 160px;height:6px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:120px}
.tbar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.grid button{font-family:var(--f-mono);font-size:.82rem;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;height:36px;cursor:pointer;position:relative}
.grid button.ans{background:var(--soft);color:var(--ink)}
.grid button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.grid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.grid button.r{background:var(--good-weak);color:var(--good);border-color:transparent}
.grid button.w{background:var(--bad-weak);color:var(--bad);border-color:transparent}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1}
details.rv{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
details.rv>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rv>summary::-webkit-details-marker{display:none}
details.rv>div{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;align-self:center}
.dot.g{background:var(--good)} .dot.b{background:var(--bad)} .dot.n{background:var(--line)}
.sheet{display:flex;flex-direction:column;gap:22px}
.sheet section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet h2{display:flex;gap:10px;align-items:baseline}
.sheet h2 .n{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet .tt td,.sheet .tt th{font-size:.88rem}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols>div{min-width:0}
.plan li{list-style:none}
.plan ol{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.step.brk{background:transparent;border-style:dashed}
.step.done{opacity:.55}
.step .tm{font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.step .tm small{display:block;color:var(--muted);font-size:.75rem}
.step h3{font-size:1rem}
.step p{font-size:.9rem;color:var(--muted);margin-top:2px}
.step input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px}
.step .go{margin-top:8px}
input[type="time"]{font:inherit;font-family:var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);color:var(--ink)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted);margin-top:28px}
@media (max-width:720px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .actions{grid-template-columns:1fr}
  .cols{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
  nav{margin-left:0;width:100%}

@media (prefers-reduced-motion:no-preference){.opt,.btn,.action{transition:border-color .12s,background-color .12s}}

<script>
// Gamlar prófspurningar sem falla undir hlutaprófsefnið 2026 (MT 1, 2, 15–17, 20–25).
// Spurningum sem vantaði mynd eða tölur í, eða eru úr MT34, er sleppt. Tvítekningum sleppt.
const OLD = [
// ---------------- Hlutapróf 2025 ----------------
{id:"H25-1", t:"rei", src:"H25 #1",
 q:"Verg landsframleiðsla er 120 m.kr., einkaneysla er 50 m.kr., fjárfesting er 20 m.kr., innflutningur er 40 m.kr. og útflutningur er 60 m.kr. Finnið útgjöld hins opinbera.",
 o:["30 m.kr.","70 m.kr.","10 m.kr.","50 m.kr.","90 m.kr."], a:0,
 e:`<div class="f">G = Y − C − I − (X − M)<br>G = 120 − 50 − 20 − (60 − 40) = 30</div>Gildran er 70: að gleyma að NX = X − M og draga ekkert frá fyrir utanríkisviðskipti.`},
{id:"H25-2", t:"vox", src:"H25 #2",
 q:"Lykillinn að því að auka lífskjör til lengri tíma felst í því að:",
 o:["Vernda innlenda framleiðslu frá erlendri samkeppni með tollum","Hefta innflutning til að verja störf og laun íbúa","Auka framleiðni hagkerfisins, t.d. með tækniframförum og aukinni menntun","Hækka lágmarkslaun","Sterk verkalýðsfélög sem knýja fram hærri laun"], a:2,
 e:"Lífskjör til langs tíma ráðast af framleiðni: fjármagni, mannauði, náttúruauðlindum og tækniþekkingu. Tollar, lágmarkslaun og verkalýðsfélög breyta ekki framleiðslugetunni."},
{id:"H25-3", t:"vox", src:"H25 #3",
 q:"Thomas Robert Malthus fjallaði um tengsl lífskjara og mannfjölda. Hann taldi að",
 o:["Lönd ættu að hámarka útflutning og lágmarka innflutning til þess að auka landsframleiðslu","Mannfjöldi hefði engin áhrif á lífskjör til lengri tíma","Sjálfsþurftarbúskapur gæti skilað jafn góðri niðurstöðu og alþjóðaviðskipti","Meiri fólksfjölgun skilaði sér í fleiri hugmyndum sem leiddi til tækninýjunga, hagvaxtar og lífskjarabata","Ómögulegt væri að bæta lífskjör til lengri tíma. Aukin landsframleiðsla á mann myndi sjálfkrafa leiða til fólksfjölgunar sem drægi úr framleiðslu á mann á ný"], a:4,
 e:"Malthus: betri lífskjör → fólki fjölgar → minnkandi meðalframleiðni → lífskjör aftur niður í lágmarksframfærslu. Valkosturinn um fleiri hugmyndir er nútímasvarið við Malthus, ekki kenning hans."},
{id:"H25-6", t:"ojo", src:"H25 #6 = L24 #12",
 q:`Tekjur einstaklinga í hagkerfi: Bjarki 15.000, Elísa 5.000, Sara 80.000. Gini-stuðulinn má nálga með<div class="f">G = (n + 1)/n − 2·Σ(n + 1 − i)·xᵢ / (n·Σxᵢ)</div>þar sem tekjum er raðað frá lægstu (i = 1) til hæstu. Hver er Gini-stuðullinn?`,
 o:["0,4","0,8","0,5","0,7","0,6"], a:2,
 e:`Raða fyrst: 5.000, 15.000, 80.000 (samtals 100.000).<div class="f">Σ(n+1−i)xᵢ = 3·5.000 + 2·15.000 + 1·80.000 = 125.000<br>G = 4/3 − 2·125.000/(3·100.000) = 1,333 − 0,833 = 0,5</div>Ef þú raðar ekki færðu 0,43, sem er ekki valkostur. Þetta dæmi hefur komið tvisvar orðrétt.`},
{id:"H25-7", t:"ojo", src:"H25 #7",
 q:"Hvert af eftirfarandi er ekki dæmi um úrræði sem beitt er til að draga úr ójöfnuði?",
 o:["Lágmarkslaun","Millifærslur á vöru og þjónustu","Lorenz-kúrfan","Almannatryggingar","Neikvæður tekjuskattur"], a:2,
 e:"Lorenz-kúrfan er mælitæki á ójöfnuð, ekki úrræði. Hin fjögur eru öll úrræðin sem talin eru upp í MT16."},
{id:"H25-8", t:"vin", src:"H25 #8",
 q:"Vinnumarkaður er í jafnvægi. Stjórnvöld stytta skólagöngu um eitt ár svo hver einstaklingur er einu ári lengur á vinnumarkaði. Hvernig hefur það áhrif?",
 o:["Eftirspurn eftir vinnuafli eykst, laun hækka og fjöldi starfa eykst","Eftirspurn eftir vinnuafli dregst saman, laun lækka og fjöldi starfa dregst saman","Skólaganga hefur engin áhrif á framboð og eftirspurn á vinnumarkaði","Framboð vinnuafls dregst saman, laun hækka og fjöldi starfa dregst saman","Framboð vinnuafls eykst, laun lækka og fjöldi starfa eykst"], a:4,
 e:"Fleiri á vinnumarkaði → framboðsferill vinnuafls hliðrast til hægri → laun lækka og störfum fjölgar. Styttri skólaganga er nefnd sem dæmi um hliðrun framboðs í MT15."},
{id:"H25-9", t:"vin", src:"H25 #9 = L24 #16",
 q:"Atvinnuleysi má skipta í:",
 o:["Hagsveiflubundið atvinnuleysi og leitaratvinnuleysi","Náttúrulegt atvinnuleysi og leitaratvinnuleysi","Hagsveiflubundið atvinnuleysi og skipulagsatvinnuleysi","Náttúrulegt atvinnuleysi og skipulagsatvinnuleysi","Náttúrulegt atvinnuleysi og hagsveiflubundið atvinnuleysi"], a:4,
 e:`<div class="f">Atvinnuleysi = leitar + skipulags + hagsveiflubundið<br>Náttúrulegt = leitar + skipulags</div>Skiptingin í tvennt er því náttúrulegt + hagsveiflubundið. Hinir valkostirnir blanda saman hluta og heild.`},
{id:"H25-10", t:"vin", src:"H25 #10",
 q:"Mannfjöldi er 383 þúsund og þar af eru 96 þúsund ekki á vinnumarkaði. Atvinnulausir eru 21 þúsund. Hvert er atvinnuleysishlutfallið?",
 o:["8,9%","3,6%","9,7%","5,5%","7,3%"], a:4,
 e:`<div class="f">Vinnuafl = 383 − 96 = 287<br>u = 21 / 287 = 7,3%</div>5,5% fæst ef deilt er í allan mannfjöldann (21/383). Það er algengasta villan.`},
{id:"H25-12", t:"spa", src:"H25 #12 = L24 #18",
 q:"Hver eftirtalinna fullyrðinga á við um lokað hagkerfi?",
 o:["Ef sparnaður er minni en fjárfesting er viðskiptahalli","Ef sparnaður er meiri en fjárfesting þá hljóta a.m.k. annað hvort einkaaðilar eða hið opinbera að vera að spara","Hið opinbera getur ekki haft nein áhrif á þjóðhagslegan sparnað","Sparnaður og fjárfesting eru alltaf jöfn í lokuðu hagkerfi","Þjóðhagslegur sparnaður er jafn framleiðslu (Y) að frádreginni einkaneyslu"], a:3,
 e:`<div class="f">Y = C + I + G ⇒ Y − C − G = I ⇒ S = I</div>Viðskiptahalli er ekki til í lokuðu hagkerfi, S &gt; I getur ekki gerst, hið opinbera hefur áhrif með T − G, og S = Y − C − G, ekki Y − C.`},
{id:"H25-13", t:"rei", src:"H25 #13",
 q:"Guðrún vann í lottó. Hún getur fengið 5.000.000 kr. í dag (A) eða 1.250.000 kr. á ári fimm sinnum, fyrsta greiðsla í dag (B). Hún getur fengið 8% ávöxtun. PV = X/(1 + r)^N. Hvert er núvirði B og hvorn á hún að velja?",
 o:["Núvirði B er 5.390.159, Guðrún á að velja B","Núvirði B er 4.925.149, Guðrún á að velja A","Núvirði B er 5.787.037, Guðrún á að velja B","Núvirði B er 6.250.000, Guðrún á að velja B","Núvirði B er 4.593.937, Guðrún á að velja A"], a:0,
 e:`Greiðslur á árum 0, 1, 2, 3 og 4. Ár 0 er ekki afvaxtað.<div class="f">PV = 1,25m × (1 + 1/1,08 + 1/1,08² + 1/1,08³ + 1/1,08⁴)<br>PV = 1,25m × 4,312127 = 5.390.159 &gt; 5.000.000</div>6.250.000 er án nokkurrar afvöxtunar og 5.787.037 = 6.250.000/1,08, þ.e. allt afvaxtað um eitt ár.`},
{id:"H25-14", t:"pen", src:"H25 #14 = L24 #25",
 q:"Hver er munurinn á vörumyntum (e. commodity money) og pappírsmyntum (e. fiat money)?",
 o:["Peningur til kaupa á vörum er kallaður vörumynt en peningur til kaupa á þjónustu er kallaður pappírsmynt","Vörumynt á við um peninga sem notaðir voru áður en seðlar voru prentaðir. Pappírsmynt á við um alla peninga eftir að peningaprentun kom til","Vörumynt er tengd undirliggjandi vöru t.d. gulli og skipta má myntinni fyrir ákveðið magn af undirliggjandi vöru, en pappírsmynt hefur ekkert virði í sjálfu sér","Flestir gjaldmiðlar eru vörumynt, pappírsmynt á við um seðla frá Ítalíu og nafnið kemur frá Fiat","Vörumynt eru krónupeningar en pappírsmynt eru seðlar"], a:2,
 e:"Orðrétt skilgreining glæranna í MT24. Virði pappírsmyntar kemur frá trausti á að hægt verði að greiða með henni í framtíðinni."},
{id:"H25-15", t:"pen", src:"H25 #15",
 q:"Frá 1927 og þar til Seðlabanki Íslands var stofnaður 1961 hafði einn íslenskur viðskiptabanki seðlaprentunarvald. Hvaða banki?",
 o:["Útvegsbankinn","Arion banki","Landsbankinn","Íslandsbanki","Búnaðarbankinn"], a:2,
 e:"1927 var Landsbankanum afhent seðlaprentunarvaldið og Íslandsbanka skipað að draga inn sína seðla. 1957 var Landsbankanum skipt og 1961 varð Seðlabanki Íslands sjálfstæður."},
{id:"H25-16", t:"pen", src:"H25 #16",
 q:"Hver af eftirfarandi fullyrðingum á EKKI við um grunnfé/seðlabankafé?",
 o:["Innistæður fjármálastofnana hjá seðlabanka vegna bindiskyldu teljast til grunnfés","Seðlar og mynt eru hluti af grunnfé","Viðskiptabankar geta búið til grunnfé, t.d. í gegnum söguna af peningamargfaldaranum","Almennar innistæður fjármálastofnana hjá seðlabanka teljast til grunnfés","Einungis seðlabankinn getur búið til grunnfé"], a:2,
 e:"Viðskiptabankar búa til bankafé (innlán), ekki grunnfé. Grunnfé (M0) = seðlar og mynt + almennar innstæður + bindiskylduinnstæður hjá SÍ."},
{id:"H25-17", t:"pen", src:"H25 #17",
 q:"Hver er helsta orsök verðbólgu til lengri tíma samkvæmt peningamagnskenningunni?",
 o:["Þegar framleiðsla eykst hraðar en verðlag myndast verðbólga","Of lítið peningamagn neyðir fyrirtæki til að hækka verð","Verðtrygging gerir það að verkum að peningastefna virkar ekki sem skyldi","Verðbólga verður til þegar veltuhraði peninga minnkar","Aukning í peningamagni er helsta orsök verðbólgu til lengri tíma litið"], a:4,
 e:`<div class="f">MV = PY, V stöðugt, Y ræðst af raunþáttum ⇒ M ↑ ⇒ P ↑</div>Minni veltuhraði myndi lækka verðlag, ekki hækka það.`},
{id:"H25-18", t:"pen", src:"H25 #18",
 q:"Hvert er EKKI eitt dæmi um almennt hlutverk bindiskyldu í nútíma peningakerfi samkvæmt Seðlabanka Íslands?",
 o:["Peningamargfaldarinn er andhverfa bindiskyldunnar og því er bindiskylda ráðandi fyrir peningamargfaldara hagkerfisins","Bindiskylda gegnir varúðarhlutverki, hún gerir bankana öruggari fyrir bankaáhlaupi eða öðrum skyndilegum kröfum um grunnfé","Aukin bindiskylda getur stuðlað að skilvirkari miðlun peningastefnu með því að skapa stöðuga eftirspurn eftir grunnfé","Bindiskylda getur verið virkt stjórntæki peningastefnu með því að breyta eftirspurn eftir grunnfé og þannig leitt til breytinga á vöxtum"], a:0,
 e:"Minnisblað SÍ nefnir þrjú hlutverk: varúðarhlutverk, virkt stjórntæki og skilvirkari miðlun. Glæran segir beint: „ekkert fjallað um peningamargfaldara“."},
{id:"H25-19", t:"vid", src:"H25 #19 = L24 #32",
 q:"Hvert af eftirfarandi á EKKI við um alþjóðaviðskipti?",
 o:["Þegar opnað er fyrir alþjóðaviðskipti aðlagast verð innanlands heimsmarkaðsverði","Í alþjóðaviðskiptum borgar sig fyrir lönd að sérhæfa sig í vörum sem þau hafa hlutfallslega yfirburði í","Neytendaábati innlendra neytenda dregst aldrei saman við þátttöku í alþjóðaviðskiptum","Innflutningskvótar geta leitt til aukins framleiðendaábata fyrir innlenda framleiðendur","Samfélagslegur ábati eykst með alþjóðaviðskiptum"], a:2,
 e:"Í útflutningslandi hækkar verð innanlands upp í heimsmarkaðsverð og neytendaábati minnkar um B. Framleiðendur græða B + D, svo heildin eykst um D."},
{id:"H25-20", t:"opi", src:"H25 #20",
 q:"Hver af eftirfarandi jöfnum er rétt fyrir opið hagkerfi? (NCO = hreint útstreymi fjármagns, NX = hreinn útflutningur, I = innlend fjárfesting, Y = landsframleiðsla, S = sparnaður)",
 o:["NX + I = NCO","NCO + I = NX","S − I = NX","S + NX + NCO = I","Y = NCO − NX"], a:2,
 e:`<div class="f">Y = C + I + G + NX<br>Y − C − G = I + NX<br>S = I + NX ⇒ S − I = NX = NCO</div>`},
// ---------------- Lokapróf 2025 (spurningar innan hlutaprófsefnis) ----------------
{id:"L25-1", t:"rei", src:"L25 #1",
 q:"Verg landsframleiðsla er 250 m.kr., einkaneysla 140 m.kr., útgjöld hins opinbera 50 m.kr., innflutningur 60 m.kr. og útflutningur 80 m.kr. Hver er fjárfesting (I)?",
 o:["80 m.kr.","60 m.kr.","20 m.kr.","40 m.kr.","100 m.kr."], a:3,
 e:`<div class="f">I = 250 − 140 − 50 − (80 − 60) = 40</div>60 fæst ef NX er sleppt.`},
{id:"L25-2", t:"rei", src:"L25 #2",
 q:`Vísitala neysluverðs (1988 = 100). Hver var verðbólgan í ágúst 2025 mæld á ársgrundvelli?<table class="dt"><tr><th>Mánuður</th><th>VNV</th></tr><tr><td>2024M07</td><td>633,2</td></tr><tr><td>2024M08</td><td>633,8</td></tr><tr><td>2024M09</td><td>632,3</td></tr><tr><td>…</td><td>…</td></tr><tr><td>2025M07</td><td>658,6</td></tr><tr><td>2025M08</td><td>657,6</td></tr><tr><td>2025M09</td><td>658,3</td></tr></table>`,
 o:["2,4%","5,8%","0,8%","3,8%","4,2%"], a:3,
 e:`<div class="f">π = VNV(ágú 2025) / VNV(ágú 2024) − 1 = 657,6 / 633,8 − 1 = 3,8%</div>Berðu saman sama mánuð með 12 mánaða millibili, ekki við næsta mánuð á undan.`},
{id:"L25-3", t:"rei", src:"L25 #3",
 q:"Nafnvextir eru 75% á ári og verðbólga 25% á ári. Hverjir eru raunvextirnir, reiknaðir nákvæmlega?",
 o:["−40%","40%","−50%","25%","50%"], a:1,
 e:`<div class="f">r = (1 + i)/(1 + π) − 1 = 1,75 / 1,25 − 1 = 0,40 = 40%</div>50% er nálgunin i − π, sem er röng þegar verðbólga er mikil.`},
{id:"L25-4", t:"vox", src:"L25 #4",
 q:"Hver er EKKI ein af ástæðum þess að þjóðir styðjast við VLF á mann sem mælikvarða á lífskjör?",
 o:["VLF á mann er samanburðarhæfur mælikvarði yfir tíma og á milli þjóða","VLF á mann tekur tillit til tekjudreifingar innan hagkerfis og framlags ólaunaðra starfa","VLF á mann má mæla nokkuð auðveldlega","VLF á mann hentar vel til markmiðasetningar og stefnumótunar stjórnvalda","VLF á mann hefur sterka fylgni við mikilvæga mælikvarða lífsgæða s.s. heilsufar og menntunarstig"], a:1,
 e:"VLF segir ekkert um dreifingu tekna og mælir ekki heimilisframleiðslu eða ólaunuð störf (MT20)."},
{id:"L25-5", t:"vox", src:"L25 #5",
 q:"Aðföngin sem við notum til að framleiða vörur og þjónustu köllum við framleiðsluþætti. Hvert af eftirfarandi er EKKI framleiðsluþáttur?",
 o:["Tækniþekking","Hagvöxtur","Fjármagn","Náttúruauðlindir","Mannauður"], a:1,
 e:"Framleiðsluþættirnir fjórir í MT21: fjármagn, mannauður, náttúruauðlindir og tækniþekking. Hagvöxtur er afleiðing þeirra."},
{id:"L25-8", t:"vox", src:"L25 #8",
 q:"Hagkerfi er í jafnvægi samkvæmt Solow-líkaninu. Ný framleiðslutækni uppgötvast sem er skilvirkari en sú fyrri. Hvaða áhrif hefur það samkvæmt líkaninu?",
 o:["Engin áhrif á framleiðslu eða fjármagn, hvorki til skemmri né lengri tíma","Sparnaður íbúa eykst og þar með fjárfesting, sem skapar hagvöxt til skemmri tíma","Hægt er að framleiða meira fyrir sama fjármagn. Með óbreyttu sparnaðarhlutfalli eykst fjárfesting (I = sY). Bæði fjármagn á mann og framleiðsla á mann aukast","Eldri þekking tapast, A lækkar og hagkerfið verður varanlega með minni framleiðslu","Afskriftarhlutfallið eykst, fjármagn á mann dregst saman og langtímajafnvægi verður við lægri framleiðslu"], a:2,
 e:"A ↑ → framleiðsluferillinn og fjárfestingarferillinn sY hliðrast upp → nýtt jafnvægi með hærra k* og y*. Sparnaðarhlutfallið s breytist ekki."},
{id:"L25-9", t:"ojo", src:"L25 #9",
 q:"Hvað má lesa út úr lögun Lorenz-kúrfunnar?",
 o:["45 gráðu línan lýsir tekjudreifingu samfélagsins","Því fjær sem kúrfan er 45 gráðu línu, því meiri ójöfnuður er í samfélagi","Lögun Lorenz-kúrfunnar segir til um samband verðbólgu og atvinnuleysis","Því nær sem kúrfan er 45 gráðu línu, því meiri ójöfnuður","Því brattari sem Lorenz-kúrfan er, því meiri hagvöxtur"], a:1,
 e:"45° línan er fullkominn jöfnuður. Svæðið milli línunnar og kúrfunnar (A) er það sem Gini mælir."},
{id:"L25-10", t:"ojo", src:"L25 #10",
 q:"Algjör fátækt (e. absolute poverty) er þegar...?",
 o:["Einstaklingar eru undir miðgildi launa","Einstaklingar hafa ekki getu til að sjá sér fyrir grunnþörfum (skjól, föt, matur...)","Einstaklingar geta ekki farið oftar en tvisvar til útlanda á ári","Einstaklingar hafa ekki getu til að uppfylla samfélagslega skilgreind viðmið um lífsgæði","Einstaklingar komast ekki í gegnum greiðslumat fyrir fasteignalán"], a:1,
 e:"Valkosturinn um samfélagslega skilgreind viðmið er skilgreiningin á hlutfallslegri fátækt. Gildran er að rugla þeim saman."},
{id:"L25-12", t:"vin", src:"L25 #12",
 q:"Mannfjöldi (16–74 ára) er 285.700 og þar af eru 50.800 ekki á vinnumarkaði. Atvinnulausir eru 7.900. Hvert er atvinnuleysishlutfallið?",
 o:["3,4%","17,8%","2,8%","5,7%","15,6%"], a:0,
 e:`<div class="f">Vinnuafl = 285.700 − 50.800 = 234.900<br>u = 7.900 / 234.900 = 3,4%</div>2,8% fæst ef deilt er í allan mannfjöldann.`},
{id:"L25-14", t:"vin", src:"L25 #14",
 q:`Fyrirtæki með framleiðslufall þar sem L er eini framleiðsluþátturinn: L = 0,1,2,3,4,5,6 gefur Q = 0, 100, 195, 280, 340, 385, 415. Verð P = 5 og laun W = 400. Hagnaðarhámarkandi fyrirtæki ræður meðan P × MPL ≥ W. Hversu marga starfsmenn ræður það?`,
 o:["3","5","6","2","4"], a:0,
 e:`<table class="dt"><tr><th>L</th><th>MPL</th><th>VMPL = 5·MPL</th><th>≥ 400?</th></tr><tr><td>1</td><td>100</td><td>500</td><td>já</td></tr><tr><td>2</td><td>95</td><td>475</td><td>já</td></tr><tr><td>3</td><td>85</td><td>425</td><td>já</td></tr><tr><td>4</td><td>60</td><td>300</td><td>nei</td></tr></table>Fjórði starfsmaðurinn skilar 300 en kostar 400.`},
{id:"L25-15", t:"vin", src:"L25 #15",
 q:"Laun yfir markaðsjafnvægi eru talin helsta skýring á þrálátu atvinnuleysi. Hverjar eru þrjár ástæður þess að laun haldast yfir jafnvægi?",
 o:["Verðteygni eftirspurnar eftir vinnuafli, árstíðabundið atvinnuleysi og lögmál Okuns","Mismunun, markaðsáhrif launaveitenda og eiginleikar starfa","Hæfileikar, framlag og heppni","Lágmarkslaun, máttur verkalýðsfélaga og afkastalaun","Leitaratvinnuleysi, skipulagsatvinnuleysi og hagsveiflubundið atvinnuleysi"], a:3,
 e:"MT22: lágmarkslaun, verkalýðsfélög og afkastalaun. Mismunun og hæfileikar skýra launamun (MT15), ekki laun yfir jafnvægi."},
{id:"L25-16", t:"spa", src:"L25 #16",
 q:"Lánsfjármarkaður í lokuðu hagkerfi. Stjórnvöld auka ríkisútgjöld án þess að breyta skattheimtu. Hverjar eru afleiðingarnar?",
 o:["Eftirspurnarkúrfan hliðrast til hægri, vextir hækka og lánsfé eykst","Framboðskúrfan hliðrast til vinstri, vextir hækka og lánsfé dregst saman","Framboðskúrfan hliðrast til hægri, vextir lækka og lánsfé eykst","Aðgerðir hins opinbera hafa ekki áhrif á lánsfjármarkað í lokuðu hagkerfi","Eftirspurnarkúrfan hliðrast til vinstri, vextir lækka og lánsfé dregst saman"], a:1,
 e:"G ↑ með óbreyttu T → opinber sparnaður (T − G) ↓ → framboð lánsfjár ← → r ↑, magn ↓. Ríkishalli er á framboðshliðinni, ekki eftirspurnarhliðinni."},
{id:"L25-17", t:"pen", src:"L25 #17",
 q:"1. júlí 1886 opnaði fyrsti banki Íslands, aðeins opinn frá 12:00–14:00. Hann fékk stofnfé að láni frá ríkissjóði og leyfi til að gefa út íslenskar krónur. Hver var bankinn?",
 o:["Búnaðarbankinn","Landsbankinn","Arion banki","Alþýðubankinn","Íslandsbanki"], a:1,
 e:"Landsbanki Íslands, við Bakarabrekku (nú Bankastræti). Íslandsbanki var stofnaður 1904 af dönskum og norskum fjárfestum."},
{id:"L25-18", t:"pen", src:"L25 #18",
 q:"Hver eru þrjú hlutverk peninga?",
 o:["Mælikvarði á verðbólgu, gjaldmiðill, framleiðslueining","Gjaldmiðill, reiknieining, geymslueining","Geymslueining, reiknieining, grunnur verðtryggingar","Gjaldmiðill, mælikvarði á verðbólgu, mælikvarði á framleiðni","Reiknieining, greiðsluhæfi, fjárfestingartæki"], a:1,
 e:"Gjaldmiðill (e. medium of exchange), reiknieining (unit of account), geymslueining (store of value)."},
{id:"L25-19", t:"pen", src:"L25 #19",
 q:"Hver af eftirfarandi fullyrðingum á við um útlán, innlán og peningamyndun í nútíma bankakerfi?",
 o:["Seðlabankinn er sá eini sem getur búið til bankafé","Bankar þurfa að vera með jafn mikið af innistæðum hjá Seðlabanka og þeir lána út","Útlán banka eru takmörkuð af peningamargfaldaranum","Bankafé eykst einungis þegar viðskiptavinir leggja grunnfé inn í viðskiptabanka","Bankar þurfa ekki innlán til að veita útlán, þeir búa til ný innlán jafnóðum"], a:4,
 e:"Lán til Önnu: útlán +100 og innistæða +100 í einni bókhaldsfærslu. Takmörkin eru eftirspurn eftir lánum, eigið fé (Basel III), grunnfé til uppgjörs og stýrivextir."},
{id:"L25-20", t:"pen", src:"L25 #20 = L24 #22",
 q:"David Hume (1711–1776) leit svo á að raunstærðir breyttust ekki með breytingum peningamagns. Samkvæmt klassískri verðbólgufræði er ástæða verðbólgu til lengri tíma fyrst og fremst:",
 o:["Of háir stýrivextir","Skortur á leiguþaki á húsnæðismarkaði","Of mikill vöxtur peningamagns","Of mikil einkaneysla","Of hátt húsnæðisverð"], a:2,
 e:"Hlutleysi peninga + peningamagnskenningin: höfuðuppspretta verðbólgu er ofvöxtur peningamagns."},
{id:"L25-21", t:"pen", src:"L25 #21",
 q:"MV = PY. Seðlabankinn eykur peningamagn með því að kaupa ríkisskuldabréf. Hvernig breytist verðlag til lengri tíma samkvæmt peningamagnskenningunni?",
 o:["Meira peningamagn eykur framleiðslu til lengri tíma og því hækkar verðlag","Peningar eru hlutlausir til lengri tíma og því hefur peningamagn engin áhrif á verðlag","Veltuhraði eykst þegar peningamagn eykst svo verðlag helst óbreytt","Af því að seðlabankinn breytir ekki stýrivöxtum eru engin áhrif á verðlag","Veltuhraði er stöðugur til langs tíma. Peningamagn hefur engin áhrif á raunstærðir svo verðlag hlýtur að hækka"], a:4,
 e:`V fast, Y fast (raunstærð) ⇒ M ↑ ⇒ P ↑ í sama hlutfalli. Hlutleysi peninga þýðir engin áhrif á <b>raun</b>stærðir, ekki á verðlag.`},
{id:"L25-22", t:"pen", src:"L25 #22",
 q:"Hvert af eftirfarandi er EKKI einn af kostnaðarþáttum verðbólgu?",

{id:"L25-23", t:"rei", src:"L25 #23",

{id:"L25-24", t:"vid", src:"L25 #24",

 o:["Argentína í hvoru tveggja","Argentína í hrísgrjónum og Indland í baunum","Indland í hrísgrjónum og Argentína í baunum","Óljóst út frá forsendum","Indland í hvoru tveggja"], a:1,

{id:"L25-27", t:"opi", src:"L25 #27",
 q:"Opið hagkerfi: sparnaður er 20 mkr. og innlend fjárfesting 12 mkr. Hreinn útflutningur er þá?",

{id:"L25-28", t:"opi", src:"L25 #28",
 q:"Opið hagkerfi í jafnvægi. Smekkur fólks breytist svo það kýs að spara minna við sama vaxtastig. Hver eru áhrifin á raunvexti og raungengi?",
 o:["Eftirspurn á gjaldeyrismarkaði eykst sem hækkar raungengi. Hreinn útflutningur er óbreyttur","Framboð á lánsfjármarkaði eykst, raunvextir lækka. NCO eykst, framboð á gjaldeyrismarkaði eykst og raungengi lækkar","Eftirspurn eftir lánsfé eykst, raunvextir hækka. NCO dregst saman, framboð á gjaldeyrismarkaði minnkar og raungengi hækkar","Framboð á lánsfjármarkaði dregst saman, raunvextir hækka. NCO dregst saman, framboð á gjaldeyrismarkaði minnkar og raungengi hækkar","Eftirspurn eftir lánsfé dregst saman, raunvextir lækka. NCO eykst, framboð á gjaldeyrismarkaði eykst og raungengi lækkar"], a:3,
 e:"S ↓ → framboð lánsfjár ← → r ↑ → NCO ↓ → framboð króna ← → E ↑. Valkosturinn sem byrjar á „eftirspurn eftir lánsfé eykst“ hefur rétta lokaniðurstöðu en rangan fyrsta hlekk."},
{id:"L25-29", t:"opi", src:"L25 #29",
 q:"Opið hagkerfi í jafnvægi. Innstreymi fjármagns eykst skyndilega. Hver eru áhrifin á raunvexti og raungengi?",
 o:["Eftirspurn á gjaldeyrismarkaði eykst sem hækkar raungengi. NX og NCO óbreytt svo engin áhrif á vexti","NCO eykst, eftirspurn á lánsfjármarkaði dregst saman svo vextir lækka. NCO eykur framboð á gjaldeyrismarkaði og raungengi lækkar","NCO dregst saman, eftirspurn á lánsfjármarkaði dregst saman svo vextir lækka. Minna NCO dregur úr framboði á gjaldeyrismarkaði og raungengi hækkar","NCO dregst saman, eftirspurn á lánsfjármarkaði eykst svo vextir hækka. Raungengi hækkar","NCO eykst, eftirspurn á lánsfjármarkaði eykst svo vextir hækka. Raungengi lækkar"], a:2,
 e:"Innstreymi = útlendingar kaupa innlendar eignir → NCO ↓ → eftirspurn eftir lánsfé (I + NCO) ← → r ↓; framboð króna ← → E ↑. Spegilmynd fjármagnsflótta."},
{id:"L25-30", t:"opi", src:"L25 #30",
 q:"Þegar land stendur frammi fyrir fjármagnsflótta er líklegast að:",
 o:["Raunvextir hækki og raungengi lækki","Raunvextir hækki og raungengi hækki","Raunvextir lækki og raungengi lækki","Raunvextir lækki og raungengi hækki","Raunvextir lækki en raungengi sé óbreytt"], a:0,
 e:"NCO ↑ → eftirspurn eftir lánsfé → → r ↑; framboð króna → → E ↓. Mexíkó 1994, Asía 1997, Ísland 2008."},
{id:"L25-31", t:"opi", src:"L25 #31 = L24 #28",
 q:"e = nafngengi, P = innlent verðlag, P* = erlent verðlag. Hvaða jafna gildir um raungengið E þegar gengið er mælt með erlendu gjaldeyrisinnihaldi innlendrar myntar (t.d. fjölda evra í hverri krónu)?",
 o:["E = P/P*","E = e/P*","E = e","E = e/P","E = eP/P*"], a:4,
 e:`<div class="f">E = e × P / P*</div>Ein af þremur jöfnunum sem Haukur sagðist ætlast til að þið kunnið.`},
{id:"L25-32", t:"opi", src:"L25 #32",
 q:"Hvað segir kaupmáttarjafnvirðiskenningin (PPP)?",
 o:["Að þjóðartekjur aukist við aukinn innflutning","Að ein eining gjaldmiðils eigi að kaupa sömu vörukörfu í öllum ríkjum","Að innflutningur hafi meiri áhrif á gengi en útflutningur","Að nafngengi sé stöðugt yfir tíma","Að innlent verðlag hafi meiri áhrif á viðskiptajöfnuð en erlent verðlag"], a:1,
 e:"Lögmálið um eitt verð. Afleiðing: raungengið E er fasti (= 1) og nafngengið er e = P*/P. Það er raungengið sem er stöðugt, ekki nafngengið."},

{id:"L24-1", t:"rei", src:"L24 #1",

{id:"L24-2", t:"rei", src:"L24 #2",

{id:"L24-3", t:"rei", src:"L24 #3",

{id:"L24-4", t:"rei", src:"L24 #4",

 e:`<div class="f">r = 1,40 / 2,00 − 1 = −0,30 = −30%</div>−60% er nálgunin i − π.`},
{id:"L24-5", t:"vin", src:"L24 #5",

 o:["Einkaneyslu og raungengis","Verðbólgu og atvinnuleysis","Sparnaðar og landsframleiðslu","Atvinnuleysis og hagvaxtar","Vaxta og peningaeftirspurnar"], a:3,

{id:"L24-6", t:"vox", src:"L24 #6",

{id:"L24-7", t:"vox", src:"L24 #7",

 o:["Mikilvæg þekking tapast, A lækkar og hagkerfið verður varanlega með minni framleiðslu","Sparnaður íbúa eykst sem skapar hagvöxt til skemmri tíma","Engin áhrif á framleiðslu eða fjármagn","Afskriftarhlutfallið eykst, δk hliðrast til vinstri, fjármagn á mann dregst saman til lengri tíma","Fjármagn á mann dregst saman, framleiðsla og neysla á mann minnka. Til lengri tíma jafnar fjármagnsstofninn sig því langtímajafnvægið er óbreytt"], a:4,

{id:"L24-11", t:"ojo", src:"L24 #11",
