{id:"p03", t:"pen", q:"Um það bil hve stór hluti peningamagns (M3) á Íslandi eru seðlar og mynt?",
 o:["Um 2%","Um 25%","Um 50%","Um 75%","Um 98%"], a:0,
 e:"Um 98% af M3 eru innlán, þ.e. skuldir banka. Greiðslukerfi nútímans byggir að langmestu leyti á bankafé."},
{id:"p04", t:"pen", q:"Anna tekur 100 kr. lán hjá Banka B og lánsféð er lagt inn á reikning hennar í sama banka. Hvað gerist strax?",
 o:["Útlán (eign) og innistæða Önnu (skuld) aukast bæði um 100. M3 eykst um 100 en grunnfé er óbreytt","Grunnfé bankans eykst um 100 og M3 eykst um 100","M3 er óbreytt, því bankinn lánaði sparifé sem aðrir höfðu lagt inn","Bankinn verður fyrst að fá 100 kr. í ný innlán áður en hann getur lánað","Grunnfé bankans minnkar um 100 en M3 er óbreytt"], a:0,
 e:"Bankinn býr til peninga með einni bókhaldsfærslu: útlán +100 og innistæða +100. Enginn þurfti að leggja inn fyrst. Viðskiptabankar geta aðeins búið til bankafé, ekki grunnfé."},
{id:"p05", t:"pen", q:"Ári síðar greiðir Anna 10 kr. afborgun af láninu af reikningi sínum í sama banka. Hvað gerist við peningamagn (M3)?",
 o:["M3 minnkar um 10 kr.","M3 er óbreytt, peningarnir færast bara til bankans","M3 eykst um 10 kr. vegna vaxtanna","Grunnfé minnkar um 10 kr. en M3 er óbreytt","M3 minnkar um 20 kr."], a:0,
 e:"Innistæða Önnu −10 og lánið −10. Endurgreiðsla láns eyðir peningum á sama hátt og lánveiting býr þá til. Vaxtagreiðsla færist hins vegar yfir í eigið fé bankans."},
{id:"p06", t:"pen", q:"Seðlabankinn kaupir verðbréf af viðskiptabanka fyrir 20 m.kr. og greiðir með því að leggja inn á reikning bankans í Seðlabankanum. Hvað gerist?",
 o:["Grunnfé (M0) eykst um 20 m.kr. en M3 er óbreytt","Bæði M0 og M3 aukast um 20 m.kr.","M3 eykst um 20 m.kr. en M0 er óbreytt","M0 minnkar um 20 m.kr.","Ekkert gerist, þetta eru eignaskipti"], a:0,
 e:"Bankinn skiptir verðbréfum fyrir innstæðu í SÍ, sem er nýtt grunnfé. Innlán almennings breytast ekki, svo M3 er óbreytt. Ef SÍ keypti af einkaaðila utan bankakerfisins yrði líka til nýtt innlán hjá seljandanum."},
{id:"p07", t:"pen", q:"Hvað af eftirfarandi er EKKI eitt af því sem takmarkar peningamyndun viðskiptabanka samkvæmt nútímaskilningi?",
 o:["Magn innlána sem sparifjáreigendur hafa áður lagt inn","Eftirspurn eftir lánum og arðsemi útlána","Eigið fé og reglur (Basel III)","Grunnfé til að gera upp við aðra banka","Stýrivextir Seðlabankans"], a:0,
 e:"Bankar þurfa ekki innlán til að veita útlán; þeir búa til innlán jafnóðum. Hinir fjórir þættirnir eru taldir upp á glærunni „Bankinn býr til peninga með einni bókhaldsfærslu“."},
{id:"p08", t:"pen", q:"Hvað er magnbundin íhlutun (e. quantitative easing)?",
 o:["Seðlabanki kaupir lengri og áhættumeiri verðbréf á eftirmarkaði, oft þegar vextir eru komnir nálægt 0%","Seðlabanki hækkar bindiskyldu til að draga úr útlánum","Ríkið eykur útgjöld án þess að auka skatta","Seðlabanki selur ríkisskuldabréf til að minnka peningamagn","Seðlabanki festir gengi gjaldmiðilsins við evru"], a:0,
 e:"Munurinn á QE og hefðbundnum markaðsaðgerðum er hve löng og áhættusöm bréfin eru. Notað í BNA og á evrusvæðinu 2011–2020 og á Íslandi 2020."},
{id:"p09", t:"pen", q:"Hvert er verðbólgumarkmið Seðlabanka Íslands og hvað gerist ef verðbólga víkur of mikið frá því?",
 o:["2,5%. Víki verðbólga meira en 1,5 prósentu frá markmiðinu þarf bankinn að gera ríkisstjórninni opinberlega grein fyrir ástæðum og viðbrögðum","2%. Ef verðbólga fer yfir 4% er bankastjóri sjálfkrafa leystur frá störfum","2,5%. Ef verðbólga fer yfir markmið er stýrivöxtum sjálfkrafa breytt eftir Taylor-reglu","0%. Öll verðbólga er talin óæskileg","4%. Víki verðbólga meira en 1 prósentu frá markmiði tekur ríkisstjórnin yfir peningastefnuna"], a:0,
 e:"Markmiðið er 2,5% og þolmörkin ±1,5 prósentur. Helsta tækið til að ná því eru meginvextir Seðlabankans."},
{id:"p10", t:"pen", q:"Hvert er helsta tæki peningastefnunefndar Seðlabanka Íslands til að ná verðbólgumarkmiðinu?",
 o:["Meginvextir bankans (stýrivextir)","Bindiskylda","Gengisskráning","Útgáfa nýrra seðla","Fjárlög ríkisins"], a:0,
 e:"Meginvextir eru vextir bankans í viðskiptum við fjármálafyrirtæki. Bindiskylda getur gegnt sama hlutverki en vaxtatækið er gagnsærra og skilvirkara."},
{id:"p11", t:"pen", q:"Árið 1904 var stofnaður banki á Íslandi sem var hlutafélag í erlendri eigu, skráður í Kaupmannahöfn, og hafði rétt til að gefa út gulltryggða seðla. Hvaða banki var það?",
 o:["Íslandsbanki","Landsbankinn","Útvegsbankinn","Búnaðarbankinn","Iðnaðarbankinn"], a:0,
 e:"Danskir og norskir fjárfestar stofnuðu Íslandsbanka. Undir H. Tofte frá 1913 var eiginfjárhlutfall lækkað og seðlaprentun sjöfaldaðist. Bankinn lokaði 1930."},
{id:"p12", t:"pen", q:"Árið 1930 hafnaði Alþingi aðstoð við Íslandsbanka og bankinn lokaði. Hvaða banki var stofnaður til að yfirtaka eignir hans og skuldir?",
 o:["Útvegsbankinn","Búnaðarbankinn","Landsbankinn","Seðlabanki Íslands","Kaupþing"], a:0,
 e:"Útvegsbankinn, ásamt Búnaðarbankanum (stofnaður 1930) og Landsbankanum, myndaði þriggja ríkisbanka kerfi með pólitískt skipuðum bankastjórum."},
{id:"p13", t:"pen", q:"Fjármagnshöftum var komið á á Íslandi í október 1931. Hvenær lauk þeim?",
 o:["Við inngöngu Íslands í EES árið 1993","Við stofnun Seðlabankans árið 1961","Með Ólafslögum árið 1979","Þegar vextir urðu frjálsir árið 1985","Eftir hrunið árið 2008"], a:0,
 e:"Höftin stóðu í rúm sextíu ár. EES tryggði frjálst flæði vinnuafls, fjármagns, vöru og þjónustu. Aftur voru sett gjaldeyrishöft 2008–2017."},
{id:"p14", t:"pen", q:"Hvað fólst í svonefndum Ólafslögum árið 1979?",
 o:["Verðtrygging var heimiluð í lánaviðskiptum","Seðlabanki Íslands var stofnaður","Fjármagnshöftum var aflétt","Vextir voru gefnir frjálsir","Bankarnir voru einkavæddir"], a:0,
 e:"Tilgangur verðtryggingar er að fjarlægja verðbólguáhættu og tryggja jákvæða raunávöxtun. Áður brann sparifé upp í verðbólgu vegna neikvæðra raunvaxta."},
{id:"p15", t:"pen", q:"Hvenær urðu vextir frjálsir á Íslandi (í stað þess að vera ákveðnir með stjórnvaldsákvörðun)?",
 o:["1985","1961","1979","1993","2001"], a:0,
 e:"Fram að 1985 voru vextir festir með stjórnvaldsákvörðun, sem leiddi til verulegra neikvæðra raunvaxta. Sparifé var í raun millifært til lántakenda."},
{id:"p16", t:"pen", q:"Árið 1990 var Íslandsbanki (hinn nýi) stofnaður þegar ríkið seldi Útvegsbankann. Hvaða bankar sameinuðust honum?",
 o:["Alþýðubankinn, Iðnaðarbankinn og Verslunarbankinn","Landsbankinn, Búnaðarbankinn og Kaupþing","Samvinnubankinn og Búnaðarbankinn","Glitnir og Kaupþing","Arion banki og Landsbankinn"], a:0,
 e:"Viðskiptabönkum fækkaði úr 7 í 3: Landsbankinn, Íslandsbanki og Búnaðarbanki. Landsbankinn hafði keypt Samvinnubankann 1989–1990."},
{id:"p17", t:"pen", q:"Hvaða banka sameinaðist Kaupþing í apríl 2003?",
 o:["Búnaðarbankanum","Landsbankanum","Íslandsbanka","Útvegsbankanum","Glitni"], a:0,
 e:"Búnaðarbankinn keypti 50% í Kaupþingi 1990 og bankarnir sameinuðust 2003. Þess vegna er Kaupþing merkt „(Búnaðarbanki)“ á glærunni um yfirtökuna 2008."},
{id:"p18", t:"pen", q:"Hve stórt var íslenska bankakerfið miðað við landsframleiðslu í aðdraganda hrunsins 2008?",
 o:["Um tíföld landsframleiðsla","Um helmingur landsframleiðslu","Um það bil jafnstórt landsframleiðslu","Um tvöföld landsframleiðsla","Um hundraðföld landsframleiðsla"], a:0,
 e:"Erlendar skuldir bankanna voru um 750% af VLF en gjaldeyrisforði Seðlabankans aðeins um 21% af VLF. Ólíklegt var talið að ríkið gæti bjargað bönkunum."},
{id:"p19", t:"pen", q:"Upp að hvaða fjárhæð eru innstæður í íslenska bankakerfinu tryggðar samkvæmt lögum?",
 o:["€100.000 (um 15 m.kr.)","€20.000 (um 3 m.kr.)","€1.000.000 (um 150 m.kr.)","Allar innstæður eru tryggðar að fullu","Engar innstæður eru tryggðar"], a:0,
 e:"Innstæðutrygging dregur úr hættu á bankaáhlaupi. Icesave-deilan snerist um hvort íslenska ríkið ætti að tryggja innstæður í útibúum erlendis."},
{id:"p20", t:"pen", q:"Hvers vegna eru bankar viðkvæmir fyrir bankaáhlaupi?",
 o:["Þeir breyta skammtímaskuldum (innlánum) í langtímaeignir (útlán) með lítið greiðsluhæfi","Þeir geyma alltaf öll innlán sem seðla í hvelfingu","Seðlabankinn bannar þeim að eiga grunnfé","Útlán þeirra eru öll til skamms tíma","Þeir mega ekki taka lán hjá öðrum bönkum"], a:0,
 e:"Þetta kallast maturity transformation. Ef margir vilja taka út samtímis geta bankarnir ekki breytt langtímalánum í seðla nógu hratt."},
{id:"p21", t:"pen", q:"Frá 1944 til 1971 var Bretton Woods-kerfið við lýði. Hvað einkenndi það?",
 o:["Bandaríkjadollari var á gullfæti og fjöldi annarra gjaldmiðla var tengdur dollaranum","Allir gjaldmiðlar voru fljótandi","Evran var tengd gulli","Gullfótur var afnuminn í öllum ríkjum","Íslenska krónan var tengd breska pundinu"], a:0,
 e:"Gullfótur var grunnur flestra peningakerfa frá um 1870 til 1930. Frá 1971 hafa gjaldmiðlar heims verið pappírsmyntir."},
{id:"p22", t:"pen", q:"Hvaða hlutverk peninga uppfylla rafmyntir (t.d. Bitcoin) samkvæmt glærum námskeiðsins?",
 o:["Ekki gjaldmiðil né reiknieiningu, en mögulega geymslueiningu","Öll þrjú hlutverkin","Gjaldmiðil og reiknieiningu, en ekki geymslueiningu","Aðeins reiknieiningu","Ekkert hlutverkanna og geta ekki geymt verðmæti"], a:0,
 e:"Rafmyntir virka á markaði eins og fjárfestingarvara, líkt og gull. Pappírsmyntir eru hins vegar góður gjaldmiðill og reiknieining en slæm geymslueining til langs tíma."},
{id:"p23", t:"pen", q:"Hvað lýsir greiðsluhæfi (e. liquidity) eignar?",
 o:["Hversu auðveldlega má skipta eigninni yfir í peninga","Hversu mikla ávöxtun eignin gefur","Hversu áhættusöm eignin er","Hve lengi eignin endist","Hvort eignin er verðtryggð"], a:0,
 e:"Seðlar hafa meira greiðsluhæfi en bundin innlán. Röðin M0 → M1 → M2 → M3 → M3+ er í minnkandi greiðsluhæfi."},
{id:"p24", t:"pen", q:"Hvað segja Fisher-áhrifin?",
 o:["Aukning verðbólgu um eitt prósentustig leiðir til hækkunar nafnvaxta um eitt prósentustig til langs tíma","Aukning verðbólgu um eitt prósentustig lækkar raunvexti um tvö prósentustig","Nafnvextir eru alltaf jafnir verðbólgu","Raunvextir hækka þegar peningamagn eykst","Verðbólga hefur engin áhrif á nafnvexti"], a:0,
 e:`<div class="f">(1 + i) = (1 + r)(1 + π) ⇒ i ≈ r + π</div>Til langs tíma eru peningar hlutlausir, svo r breytist ekki og i fylgir π.`},
{id:"p25", t:"pen", q:"Hið opinbera rekur hallarekstur. Hver af þessum fjármögnunarleiðum skapar verðbólguskatt?",
 o:["Lántaka hjá bankakerfinu eða seðlabanka, því þá verða til nýjar innistæður og M eykst","Skattahækkun","Lántaka hjá lífeyrissjóðum og heimilum","Sala ríkiseigna til almennings","Niðurskurður útgjalda"], a:0,
 e:"Lán frá sparifjáreigendum færir til peninga sem þegar eru til (vextir hækka, ruðningsáhrif). Lán frá bankakerfinu býr til nýja peninga: M ↑ → P ↑. Það er falin skattheimta á alla sem eiga peninga."},
{id:"p26", t:"pen", q:"Hvenær er talað um óðaverðbólgu samkvæmt skilgreiningu námskeiðsins?",
 o:["Þegar verðbólga er yfir 50% á mánuði","Þegar verðbólga er yfir 10% á ári","Þegar verðbólga er yfir 50% á ári","Þegar verðbólga er yfir 100% á ári","Þegar verðbólga fer yfir verðbólgumarkmið"], a:0,
 e:"Óðaverðbólga > 50% á mánuði. Dæmi: Þýskaland 1923, Simbabve 2008, Venesúela 2018."},
{id:"p27", t:"pen", q:"Hvað er skósólakostnaður verðbólgu?",
 o:["Kostnaðurinn við að fólk dregur úr peningaeign sinni, t.d. tími sem fer í aukaferðir í bankann","Kostnaðurinn við að prenta nýja verðlista","Kostnaður við að laun hækka hraðar en verðlag","Kostnaðurinn við að skattur er lagður á nafnvexti","Kostnaður við að skór hækka meira í verði en aðrar vörur"], a:0,
 e:"Verðbólga rýrir verðgildi peninga og hvetur fólk til að eiga minna af þeim. Kostnaður við að uppfæra verð er matseðlakostnaður."},
{id:"p28", t:"pen", q:"Raunvextir eru 4% og verðbólga 8%, svo nafnvextir eru um 12%. Skattur á vaxtatekjur er 22% af nafnvöxtum. Hver er raunávöxtun eftir skatt, um það bil?",
 o:["Um 1,4%","Um 3,1%","Um 4,0%","Um 9,4%","Um −8,0%"], a:0,
 e:`<div class="f">Nafnávöxtun e. skatt = 12% × (1 − 0,22) = 9,36%<br>Raunávöxtun e. skatt ≈ 9,36% − 8% = 1,4%</div>Án verðbólgu hefði hún verið 4% × 0,78 = 3,1%. Skatturinn tekur 66% af raunávöxtuninni í stað 22%: þetta eru skattaskekkjur.`},
{id:"p29", t:"pen", q:"Óvænt verðbólga verður meiri en búist var við. Hverjir tapa á henni samkvæmt umfjöllun um handahófskennda endurdreifingu auðs?",
 o:["Sparifjáreigendur og lánveitendur með óverðtryggðar kröfur","Skuldarar með óverðtryggð lán","Ríkissjóður, sem skuldar óverðtryggt","Enginn, því laun hækka alltaf jafn mikið","Eigendur fasteigna"], a:0,
 e:"Óvænt verðbólga færir auð frá sparifjáreigendum til skuldara. Þau sem fá hann unnu ekki fyrir honum og þau sem greiða fá ekkert í staðinn."},
{id:"p30", t:"pen", q:"Hvert af eftirfarandi er EKKI rök fyrir því að verðbólgumarkmið sé nokkuð yfir 0%?",
 o:["Verðbólga eykur kaupmátt launa til langs tíma","Fyrirtæki eiga erfitt með að lækka nafnlaun","Verðhjöðnun eykur raunbyrði óverðtryggðra skulda","Í verðhjöðnun borgar sig að fresta kaupum","Of lítil verðbólga veldur vandræðum ekki síður en of mikil"], a:0,
 e:"Kaupmáttur ræðst til langs tíma af framleiðni (W/P = MPL), ekki af verðbólgu."},
{id:"p31", t:"pen", q:"Samkvæmt MT24 dregur verðbólga ein og sér ekki úr kaupmætti til lengri tíma. Hvað ræður kaupmætti launa til langs tíma?",
 o:["Framleiðni vinnuafls: W/P = MPL","Peningamagn í umferð","Stýrivextir Seðlabankans","Verðbólgumarkmiðið","Nafngengi krónunnar"], a:0,
 e:"Þegar verðlag hækkar hratt hækka laun yfirleitt hratt líka. Framleiðni ræðst af mannauði, náttúruauðlindum, fjármagni og tækni."},
{id:"p32", t:"pen", q:"Á árunum 2000–2009 óx M3 um ~19% á ári en verðbólga var aðeins ~6% að meðaltali. Hvernig skýrir MT24 undantekninguna?",
 o:["Nýju peningarnir fóru í eignaverð og innflutning (sterk króna) og veltuhraðinn féll","Raunhagvöxtur var 13% á ári","Peningamagnskenningin gildir ekki á Íslandi","Seðlabankinn hækkaði bindiskyldu","Verðtrygging kom í veg fyrir verðbólgu"], a:0,
 e:`<div class="f">%ΔM + %ΔV ≈ %ΔP + %ΔY</div>Ef V fellur getur M vaxið hratt án þess að P hækki jafn mikið. Verðbólgan kom 2008 þegar krónan féll.`},
{id:"p33", t:"pen", q:"Í líkaninu af peningamarkaðnum er virði peninga (1/P) á lóðrétta ásnum. Hvað gerist þegar seðlabankinn eykur peningaframboð?",
 o:["Lóðrétti framboðsferillinn hliðrast til hægri, virði peninga lækkar og verðlag hækkar","Eftirspurnarferillinn hliðrast til hægri og verðlag lækkar","Framboðsferillinn hliðrast til hægri og virði peninga hækkar","Ekkert, því framboðið er lóðrétt","Verðlag lækkar því meira er til af peningum"], a:0,
 e:"Framboðið er lóðrétt því seðlabankinn ræður því að lokum. Meira peningamagn → hver króna kaupir minna (1/P ↓) → P ↑."},
{id:"p34", t:"pen", q:"Hvað af eftirfarandi er raunstærð en ekki nafnstærð?",
 o:["Kaupmáttur launa","Mánaðarlaun í krónum","Útgjöld heimila í krónum á verðlagi hvers árs","Nafnvirði VLF","Verð á mjólkurlítra"], a:0,
 e:"Raunstærðir eru mældar í magni eða á föstu verðlagi. Raunvirði = nafnvirði / verðvísitala."},
{id:"p35", t:"pen", q:"Hver eru þrjú lykilhlutverk bindiskyldu samkvæmt minnisblaði Seðlabanka Íslands?",
 o:["Varúðarhlutverk, virkt stjórntæki peningastefnu og skilvirkari miðlun peningastefnu","Að ákvarða peningamargfaldarann, stjórna útlánum og tryggja innstæður","Að fjármagna ríkissjóð, verja gengið og ákveða verðbólgumarkmið","Varúðarhlutverk, innstæðutrygging og gengisskráning","Að takmarka útlán við tífalt grunnfé"], a:0,
 e:"SÍ hækkaði bindiskyldu í apríl 2024 til að láta vaxtabreytingar sínar hafa meiri áhrif. Glæran tekur fram að ekkert sé fjallað um peningamargfaldara."},
{id:"p36", t:"pen", q:"Hvert er hlutverk seðlabanka sem „lánveitandi til þrautavara“ (e. lender of last resort)?",
 o:["Að lána fjármálastofnunum þegar þær geta ekki fengið fé annars staðar, t.d. í lausafjárkreppu","Að lána heimilum sem fá ekki lán í banka","Að lána ríkissjóði til að fjármagna halla","Að kaupa skuldabréf fyrirtækja í gjaldþroti","Að greiða innstæðueigendum ef banki fellur"], a:0,
 e:"Seðlabankinn er banki bankanna og lánveitandi í neyð. Hann sér líka um seðlaútgáfu, gjaldeyrisforða og eftirlit með fjármálastofnunum."},
{id:"p37", t:"pen", q:"Íslenska krónan hefur frá 1939 tapað um 99,997% af verðgildi sínu. Hvaða hlutverk peninga uppfyllir pappírsmynt verst samkvæmt þessu?",
 o:["Geymslueining","Gjaldmiðill","Reiknieining","Greiðsluhæfi","Lögeyrir"], a:0,
 e:"Pappírsmyntir eru nafnverðseignir sem verðbólga rýrir. Raunvirðiseignir eins og gull og húsnæði halda verðgildi betur."},
// ======================= VINNUMARKAÐUR (MT15, MT22) =======================
{id:"v01", t:"vin", q:"Hver eftirtalinna telst atvinnulaus samkvæmt skilgreiningu Hagstofunnar?",
 o:["Ásta missti vinnuna, hefur sótt um störf síðustu þrjár vikur og getur byrjað strax","Bjarni er í fullu námi og vinnur ekki","Kristín er komin á eftirlaun","Davíð hefur gefist upp á að leita sér að vinnu","Eva er heimavinnandi og leitar ekki að vinnu"], a:0,
 e:"Atvinnulaus = án vinnu, hefur leitað síðustu fjórar vikur og getur byrjað innan tveggja vikna (eða bíður eftir að hefja störf). Hinir eru utan vinnumarkaðar."},
{id:"v02", t:"vin", q:"Nokkur hópur atvinnulausra gefst upp á atvinnuleit. Hvað gerist við mælt atvinnuleysishlutfall og atvinnuþátttöku?",
 o:["Atvinnuleysishlutfallið lækkar og atvinnuþátttakan lækkar","Atvinnuleysishlutfallið hækkar og atvinnuþátttakan lækkar","Hvorugt breytist","Atvinnuleysishlutfallið lækkar en atvinnuþátttakan hækkar","Atvinnuleysishlutfallið hækkar og atvinnuþátttakan hækkar"], a:0,
 e:"Þau fara úr hópi atvinnulausra yfir í „utan vinnumarkaðar“. Teljarinn í u minnkar meira hlutfallslega en nefnarinn, og vinnuaflið minnkar miðað við mannfjölda."},
{id:"v03", t:"vin", q:"Forritari segir upp starfi sínu og tekur sér tvo mánuði í að finna starf sem hentar betur. Hvaða tegund atvinnuleysis er þetta?",
 o:["Leitaratvinnuleysi","Skipulagsatvinnuleysi","Hagsveiflubundið atvinnuleysi","Árstíðabundið atvinnuleysi","Langvarandi atvinnuleysi"], a:0,
 e:"Leitaratvinnuleysi stafar af því að vinnuleit er tímafrek. Það er óhjákvæmilegt og hluti af náttúrulegu atvinnuleysi."},
{id:"v04", t:"vin", q:"Fiskvinnsla lokar í litlu sveitarfélagi og starfsfólkið getur ekki flutt til að sækja vinnu annars staðar. Hvaða tegund atvinnuleysis er þetta?",
 o:["Skipulagsatvinnuleysi","Leitaratvinnuleysi","Hagsveiflubundið atvinnuleysi","Árstíðabundið atvinnuleysi","Ekkert atvinnuleysi"], a:0,
 e:"Skipulagsatvinnuleysi myndast þegar vinnuframboð er umfram eftirspurn við ríkjandi laun: landfræðilegar ástæður, tæknibreytingar eða laun yfir jafnvægi."},
{id:"v05", t:"vin", q:"Hvað er náttúrulegt atvinnuleysi?",
 o:["Það atvinnuleysi sem væri til staðar ef hagkerfið væri í jafnvægi: leitaratvinnuleysi + skipulagsatvinnuleysi","Atvinnuleysi sem stafar af niðursveiflu","Atvinnuleysi sem er 0% í uppsveiflu","Árstíðabundið atvinnuleysi yfir sumarið","Atvinnuleysi þeirra sem hafa gefist upp á leit"], a:0,
 e:"Á Íslandi hefur árstíðaleiðrétt atvinnuleysi sveiflast í kringum ~4,5%, sem bendir til náttúrulegs atvinnuleysis nálægt því."},
{id:"v06", t:"vin", q:"Lögmál Okuns á Íslandi er metið sem Δu = 0,0069 − 0,2283·g. Ef hagvöxtur er 5%, hvað gerist við atvinnuleysi samkvæmt þessu?",
 o:["Það lækkar um u.þ.b. 0,45 prósentustig","Það hækkar um u.þ.b. 0,45 prósentustig","Það lækkar um u.þ.b. 1,14 prósentustig","Það lækkar um u.þ.b. 5 prósentustig","Það breytist ekki"], a:0,
 e:`<div class="f">Δu = 0,0069 − 0,2283 × 0,05 = 0,0069 − 0,0114 = −0,0045</div>Atvinnuleysi lækkar um ~0,45 prósentustig. −1,14 fæst ef fastanum 0,0069 er sleppt.`},
{id:"v07", t:"vin", q:"Beveridge-kúrfan lýsir sambandi atvinnuleysis og lausra starfa. Hvað þýðir hliðrun hennar til hægri?",
 o:["Vinnumarkaðurinn er orðinn minna skilvirkur í að para saman fólk og störf","Vinnumarkaðurinn er orðinn skilvirkari","Hagkerfið er komið í uppsveiflu","Verðbólga hefur aukist","Náttúrulegt atvinnuleysi hefur minnkað"], a:0,
 e:"Covid hliðraði Beveridge-kúrfunni í BNA til hægri: fleiri laus störf við sama atvinnuleysi. Kúrfan gefur vísbendingu um skipulagsatvinnuleysi."},
{id:"v08", t:"vin", q:"Hvert af eftirfarandi er EKKI ástæða fyrir því að fyrirtæki greiða afkastalaun (laun yfir jafnvægi)?",
 o:["Lög krefjast þess að laun séu yfir jafnvægislaunum","Betur launað starfsfólk heldur betri heilsu","Vel launað starfsfólk er síður líklegt til að skipta um vinnu","Hærri laun hvetja starfsfólk til að leggja sig fram","Hærri laun laða að betra starfsfólk"], a:0,
 e:"Afkastalaun eru ákvörðun fyrirtækisins sjálfs: heilbrigði, minni vinnuvelta, ánægja/vinnuframlag og gæði starfsfólks. Lögbundin laun yfir jafnvægi eru lágmarkslaun."},
{id:"v09", t:"vin", q:"Lágmarkslaun eru hækkuð upp fyrir jafnvægislaun á tveimur mörkuðum með sama framboð vinnuafls. Á markaði A er eftirspurn eftir vinnuafli mjög teygin, á markaði B óteygin. Hvar verður atvinnuleysið meira?",
 o:["Á markaði A, því þar fækkar störfum meira við hærri laun","Á markaði B, því þar fækkar störfum meira","Jafn mikið á báðum, því framboðið er það sama","Hvergi, lágmarkslaun valda aldrei atvinnuleysi","Á markaði B, því þar er eftirspurnin brattari"], a:0,
 e:"Teygin eftirspurn = flatur ferill: við hærri laun dregst eftirspurn mikið saman. Teygni er oft há þar sem auðvelt er að skipta vinnuafli út, t.d. sjálfsafgreiðslu í láglaunastörfum."},
{id:"v10", t:"vin", q:"Lágmarkslaun eru sett undir markaðsjafnvægislaunum. Hver eru áhrifin?",
 o:["Engin, lágmarkslaunin eru ekki bindandi","Atvinnuleysi eykst","Laun lækka niður í lágmarkslaunin","Störfum fjölgar","Framboð vinnuafls dregst saman"], a:0,
 e:"Verðgólf hefur aðeins áhrif ef það er yfir markaðsverði. Lágmarkslaun á Íslandi eru samningsbundin, í BNA lögbundin."},
{id:"v11", t:"vin", q:"Hvers vegna er eftirspurn eftir vinnuafli kölluð afleidd eftirspurn?",
 o:["Hún leiðir af eftirspurn eftir vörunum og þjónustunni sem vinnuaflið framleiðir","Hún er reiknuð út frá launum annarra starfsstétta","Hún er ákveðin af stjórnvöldum","Hún leiðir af framboði vinnuafls","Hún fer eingöngu eftir menntun"], a:0,
 e:"Fyrirtæki ráða fólk til að framleiða. Þess vegna hliðrast eftirspurn eftir vinnuafli þegar vöruverð (P) eða framleiðni (MPL) breytist."},
{id:"v12", t:"vin", q:"Hagnaðarhámarkandi fyrirtæki á samkeppnismarkaði ræður starfsfólk þar til...",
 o:["W = P × MPL, þ.e. raunlaun W/P eru jöfn jaðarframleiðni vinnuafls","MPL er í hámarki","Heildarframleiðsla Q er í hámarki","W = MPL / P","Meðalframleiðni er jöfn launum"], a:0,
 e:`<div class="f">W = P × MPL ⇔ W/P = MPL ⇔ P = W/MPL = MC</div>W/MPL er jaðarkostnaður einnar viðbótareiningar.`},
{id:"v13", t:"vin", q:"Mikill fjöldi erlends vinnuafls flytur til landsins. Hvað gerist á vinnumarkaði samkvæmt líkaninu?",
 o:["Framboð vinnuafls eykst, laun lækka og störfum fjölgar","Eftirspurn eftir vinnuafli eykst, laun hækka","Framboð vinnuafls minnkar, laun hækka","Ekkert, því innflutt vinnuafl tekur bara störf frá öðrum","Eftirspurn eftir vinnuafli minnkar, laun lækka og störfum fækkar"], a:0,
 e:"Innflutningur vinnuafls hliðrar framboðsferlinum til hægri. Sama á við um hærri eftirlaunaaldur og styttri skólagöngu."},
{id:"v14", t:"vin", q:"Ný tækni eykur jaðarframleiðni starfsfólks í ákveðinni grein. Hvað gerist á vinnumarkaði þeirrar greinar?",
 o:["Eftirspurn eftir vinnuafli eykst, laun hækka og störfum fjölgar","Framboð vinnuafls eykst og laun lækka","Eftirspurn eftir vinnuafli minnkar því vélarnar vinna störfin","Engin áhrif, því laun eru óháð framleiðni","Framboð vinnuafls minnkar"], a:0,
 e:"VMPL = P × MPL. MPL ↑ → VMPL ↑ → eftirspurnarferill hliðrast til hægri. Á glærunum eru tækniframfarir taldar með hliðrunum eftirspurnar."},
{id:"v15", t:"vin", q:"Laun hækka. Hver eru staðkvæmdaráhrifin á framboð vinnu?",
 o:["Fórnarkostnaður frítíma eykst svo fólk vill vinna meira","Fólk getur unnið minna og samt haft sömu neyslu","Fólk vill vinna minna því það er orðið ríkara","Engin áhrif","Fólk skiptir yfir í aðra vinnu"], a:0,
 e:"Tekjuáhrifin vinna í hina áttina: hærri tekjur → meiri frítími. Til að byrja með eru staðkvæmdaráhrifin oft ráðandi, en við háar tekjur geta tekjuáhrifin orðið ráðandi."},
{id:"v16", t:"vin", q:"Sumir hagfræðingar telja að menntun auki ekki framleiðni heldur sé leið fyrir nemendur til að sýna vinnuveitendum hæfileika sína. Hvað kallast þessi sýn?",
 o:["Menntun sem merkimiði (e. signalling)","Mannauðskenningin","Afkastalaun","Ofurstjörnuáhrif","Markaðsáhrif vinnuveitenda"], a:0,
 e:"Mannauðskenningin segir að menntun auki þekkingu og framleiðni og þar með laun. Merkimiðakenningin segir að prófgráðan gefi til kynna eiginleika sem þurfti til að ljúka henni."},
{id:"v17", t:"vin", q:"Hvað skýrir launalægð hjúkrunarfræðinga og kennara samkvæmt umfjöllun um markaðsáhrif fyrirtækja í MT15?",
 o:["Einn stór vinnuveitandi (hið opinbera, Landspítali) hefur mikið markaðsvald og getur haldið launum lægri","Framboð þessara starfsstétta er mjög lítið","Þessi störf hafa enga framleiðni","Lágmarkslaun eru of há","Afkastalaun eru greidd í þessum greinum"], a:0,
 e:"Þegar fáir stórir vinnuveitendur ráða markaðnum eru þeir ekki verðþolar. Lágmarkslaun geta verið leið til að draga úr slíku markaðsvaldi."},
{id:"v18", t:"vin", q:"Í dæmi úr MT22 er vinnuafl 100 ársverk (5.200 vikur). 3 eru atvinnulausir í heilt ár (156 vikur) og 52 eru atvinnulausir í eina viku hver (52 vikur). Hve stór hluti af heildaratvinnuleysinu (í vikum) er langtímaatvinnuleysi?",
 o:["75%","5,5%","4%","25%","3%"], a:0,
 e:`<div class="f">Atvinnuleysi = (156 + 52) / 5.200 = 4%<br>Hlutur langtíma = 156 / 208 = 75%</div>5,5% er hlutfall langtímaatvinnulausra af fjölda atvinnulausra (3/55). Fáir einstaklingar geta vegið þungt.`},
{id:"v19", t:"vin", q:"Atvinnuleysi á Íslandi er mælt á tvo vegu. Hverjir?",
 o:["Með vinnumarkaðskönnun Hagstofunnar og með fjölda þeirra sem fá atvinnuleysisbætur hjá Vinnumálastofnun","Með skattframtölum og tollskýrslum","Með Okun-lögmálinu og Beveridge-kúrfunni","Með vísitölu neysluverðs og launavísitölu","Með manntali á tíu ára fresti"], a:0,
 e:"Hvorug aðferðin er fullkomin: kannanir geta verið ónákvæmar og ekki fá allir atvinnulausir bætur."},
{id:"v20", t:"vin", q:"Hvað einkennir markaði þar sem „ofurstjörnur“ myndast (fáir þéna gríðarlega mikið en flestir lítið)?",
 o:["Allir neytendur vilja vöru besta framleiðandans og tæknin gerir honum kleift að ná til allra á lágu verði","Mikil verkalýðsfélög","Lögbundin lágmarkslaun","Fullkomin samkeppni og engin stærðarhagkvæmni","Mikil mismunun á vinnumarkaði"], a:0,
 e:"Dæmi: tónlistarfólk og knattspyrnumenn í dag miðað við fortíð. Launamunur tónlistarmanna er miklu meiri en hjúkrunarfræðinga."},
// ======================= OPIÐ HAGKERFI (MT25) =======================
{id:"o01", t:"opi", q:"Íslendingur kaupir hlutabréf í Tesla. Hvaða áhrif hefur það á hreint útstreymi fjármagns (NCO) frá Íslandi?",
 o:["NCO eykst","NCO minnkar","NCO er óbreytt","NX minnkar en NCO er óbreytt","Óljóst"], a:0,
 e:"NCO = kaup innlendra aðila á erlendum eignum − kaup erlendra aðila á innlendum eignum. Íslendingur eignast erlenda eign → NCO ↑."},
{id:"o02", t:"opi", q:"Færeyingur kaupir íslensk ríkisskuldabréf. Hvaða áhrif hefur það á NCO frá Íslandi?",
 o:["NCO minnkar","NCO eykst","NCO er óbreytt","NX eykst en NCO er óbreytt","Óljóst"], a:0,
 e:"Útlendingur kaupir innlenda eign → seinni liðurinn í NCO stækkar → NCO ↓ (innstreymi fjármagns)."},
{id:"o03", t:"opi", q:"Íslenskt ferðaþjónustufyrirtæki selur þýskum ferðamanni jöklaferð fyrir 100€ og geymir evrurnar á gjaldeyrisreikningi. Hvað gerist?",
 o:["NX eykst um 100€ og NCO eykst um 100€","NX eykst um 100€ en NCO er óbreytt","NX eykst um 100€ og NCO minnkar um 100€","NX er óbreytt en NCO eykst","Hvorugt breytist fyrr en evrunum er skipt"], a:0,
 e:"Útflutningur → NX ↑. Evruinnstæða er krafa á útlendinga, þ.e. erlend eign → NCO ↑. Öll viðskipti hafa tvær hliðar, svo NX = NCO alltaf."},
{id:"o04", t:"opi", q:"Íslenskt fyrirtæki selur þýskum ferðamanni jöklaferð fyrir 100€ og skiptir evrunum í krónur. Bankinn selur evrurnar innflytjanda sem kaupir þýskan bíl fyrir 100€. Hver eru heildaráhrif allra viðskiptanna á NX og NCO?",
 o:["NX og NCO eru bæði óbreytt (+100 − 100 = 0)","NX og NCO aukast bæði um 100€","NX eykst um 100€ en NCO er óbreytt","NX minnkar um 100€ en NCO eykst","NCO eykst um 200€"], a:0,
 e:"Evrurnar fara aðeins úr landi ef þær greiða fyrir innflutning, og þá lækka NX og NCO saman."},
{id:"o05", t:"opi", q:"Land er með viðskiptahalla (NX < 0). Hvað gildir þá um NCO?",
 o:["NCO < 0: fjármagn streymir inn í landið (landið selur eignir eða tekur lán)","NCO > 0: fjármagn streymir út","NCO = 0","NCO er óháð NX","NCO < 0 og S > I"], a:0,
 e:"Eins og námsmaður sem eyðir 4,5 m.kr. en þénar 4,0: hallinn er greiddur með því að ganga á sparnað eða taka lán, þ.e. fjármagn streymir inn. Og S − I = NX < 0 ⇒ S < I."},
{id:"o06", t:"opi", q:"Hvað segir jafnan S = I + NCO?",
 o:["Þjóðhagslegur sparnaður fer annaðhvort í innlenda fjárfestingu eða í kaup á erlendum eignum","Sparnaður er alltaf meiri en fjárfesting í opnu hagkerfi","Erlend fjárfesting er alltaf jöfn innlendri","Sparnaður fer eingöngu í innlenda fjárfestingu","NCO er alltaf jákvætt"], a:0,
 e:"S = I_innlend + I_erlend. Þetta er líka ástæðan fyrir því að á lánsfjármarkaði opins hagkerfis er framboð = S og eftirspurn = I + NCO."},
{id:"o07", t:"opi", q:"Verð evru fer úr 140 kr. í 130 kr. Hvað hefur gerst?",
 o:["Gengi krónunnar hefur hækkað (króna styrkst)","Gengi krónunnar hefur lækkað (króna veikst)","Raungengið hefur örugglega lækkað","Ekkert hefur breyst fyrir íslenska neytendur","Evran hefur styrkst"], a:0,
 e:"Ein króna kaupir nú meira af evrum (1/130 > 1/140). Verðlækkun á erlendum gjaldeyri jafngildir gengishækkun krónunnar."},
{id:"o08", t:"opi", q:"Hvert af eftirfarandi myndi LÆKKA raungengi krónunnar, E = eP/P*?",
 o:["Verðlag erlendis (P*) hækkar","Nafngengi krónunnar (e) hækkar","Innlent verðlag (P) hækkar","Erlent verðlag (P*) lækkar","Innlent verðlag hækkar meira en erlent"], a:0,
 e:"e ↑, P ↑ og P* ↓ hækka öll E og draga úr NX. P* ↑ lækkar E: íslenskar vörur verða hlutfallslega ódýrari og NX eykst."},
{id:"o09", t:"opi", q:"Raungengi krónunnar lækkar. Hvað gerist samkvæmt MT25?",
 o:["Íslenskar vörur verða hlutfallslega ódýrari, útflutningur eykst, innflutningur minnkar og NX eykst","Íslenskar vörur verða dýrari og NX minnkar","NX er óbreytt því NX = NCO","Innflutningur eykst og útflutningur minnkar","Verðbólga á Íslandi lækkar örugglega"], a:0,
 e:"Neikvætt samband er milli raungengis og NX. Þess vegna hallar eftirspurnarferillinn á gjaldeyrismarkaði niður."},
{id:"o10", t:"opi", q:"Ef kaupmáttarjafnvirðiskenningin (KJK) gildir, hvað gildir þá um raungengið og nafngengið?",
 o:["Raungengið er fasti (E = 1) og nafngengið er e = P*/P","Nafngengið er fasti en raungengið sveiflast","Bæði eru föst","Raungengið er alltaf hærra en nafngengið","e = P/P*"], a:0,
 e:`<div class="f">1/P = e/P* ⇒ 1 = eP/P* = E ⇒ e = P*/P</div>Nafngengið endurspeglar mun á verðlagi landanna.`},
{id:"o11", t:"opi", q:"Samkvæmt KJK, hvað gerist við nafngengi krónunnar ef Seðlabankinn prentar mikið af peningum og innlent verðlag hækkar?",
 o:["Gengi krónunnar lækkar, hver króna kaupir minna af erlendum gjaldeyri","Gengi krónunnar hækkar","Gengi krónunnar breytist ekki","Raungengið hækkar varanlega","Erlent verðlag hækkar"], a:0,
 e:"e = P*/P. P ↑ ⇒ e ↓. Gjaldmiðlar eru eins og vörur að þessu leyti: meira framboð lækkar virðið."},
{id:"o12", t:"opi", q:"Hvert af eftirfarandi er EKKI takmörkun á kaupmáttarjafnvirðiskenningunni samkvæmt MT25?",
 o:["Seðlabankar geta ekki haft nein áhrif á verðlag","Margar vörur, t.d. klipping, er erfitt að eiga viðskipti með yfir landamæri","Vörur frá ólíkum löndum koma ekki alltaf hver í stað annarrar","Flutningskostnaður er ekki 0","Nafngengi breytist á mínútu fresti en verðlag mun hægar"], a:0,
 e:"Takmarkanirnar fjórar á glærunum eru óverslunarhæfar vörur, ólíkar vörur, flutningskostnaður og tregbreytanlegt verðlag. KJK er almennt viðurkennd til lengri tíma."},
{id:"o13", t:"opi", q:"Hvað einkennir fastgengisstefnu eins og hjá dönsku krónunni?",
 o:["Seðlabankinn er virkur á gjaldeyrismarkaði til að halda genginu nálægt viðmiði (€1 = 7,46 DKK, ±2,25%)","Gengið ræðst eingöngu af framboði og eftirspurn án afskipta","Gengið breytist aldrei, óháð framboði og eftirspurn","Landið hefur sjálfstæða peningastefnu og frjálst fjármagnsflæði","Landið notar evru sem gjaldmiðil"], a:0,
 e:"Fastgengi þýðir ekki að framboð og eftirspurn hafi ekki áhrif; seðlabankinn verður stöðugt að vega á móti, og þarf til þess stóran gjaldeyrisforða."},
{id:"o14", t:"opi", q:"Samkvæmt ómöguleikaþríhyrningnum, hvaða tveimur af þremur markmiðum hefur Ísland haldið frá 2001?",
 o:["Frjálsu fjármagnsflæði og sjálfstæðri peningastefnu (fljótandi gengi)","Föstu gengi og frjálsu fjármagnsflæði","Föstu gengi og sjálfstæðri peningastefnu","Öllum þremur","Engu þeirra"], a:0,
 e:"Danmörk og evrusvæðið: fast gengi + frjálst flæði. Bretton Woods og Kína: fast gengi + sjálfstæð peningastefna með höftum."},
{id:"o15", t:"opi", q:"Þrýstingur er á fastgengi til lækkunar. Hvert af eftirfarandi er EKKI eitt af tækjum seðlabanka til að verja það?",
 o:["Lækka vexti","Selja gjaldeyrisforða og kaupa eigin gjaldmiðil","Hækka vexti svo innlendar eignir verði eftirsóknarverðari","Setja gjaldeyrishöft","Ekkert ofangreint er tæki"], a:0,
 e:"Lægri vextir myndu auka NCO og þrýsta genginu enn frekar niður. Englandsbanki keypti pund og hækkaði vexti 16. sept. 1992 en gafst upp sama kvöld."},
{id:"o16", t:"opi", q:"Hvað ákvarðar framboð og eftirspurn króna á gjaldeyrismarkaði í líkaninu af opnu hagkerfi?",
 o:["Framboð = NCO (lóðrétt, óháð raungengi), eftirspurn = NX (niðurhallandi). Raungengið aðlagast","Framboð = S, eftirspurn = I. Raunvextir aðlagast","Framboð = NX, eftirspurn = NCO. Nafngengið aðlagast","Framboð = M, eftirspurn = PY. Verðlagið aðlagast","Framboð = útflutningur, eftirspurn = innflutningur. Vextir aðlagast"], a:0,
 e:"Krónur eru boðnar fram til að kaupa erlendar eignir (NCO) og útlendingar vilja krónur til að kaupa hreinan útflutning (NX). NCO tengir lánsfjármarkaðinn og gjaldeyrismarkaðinn."},
{id:"o17", t:"opi", q:"Ríkið eykur hallarekstur í opnu hagkerfi. Hver er rétta keðjan samkvæmt líkaninu?",
 o:["S ↓ → r ↑ → NCO ↓ → framboð króna minnkar → E ↑ → NX ↓","S ↓ → r ↓ → NCO ↑ → E ↓ → NX ↑","Eftirspurn eftir lánsfé ↑ → r ↑ → NCO ↑ → E ↓","Eftirspurn eftir krónum ↑ → E ↑ → NX óbreytt","S ↑ → r ↓ → NCO ↑ → E ↓"], a:0,
 e:"Þetta kallast tvíburahalli: halli á rekstri ríkisins fylgir halli í viðskiptum við útlönd. Auk þess ryður hann burt innlendri fjárfestingu."},
{id:"o18", t:"opi", q:"Stjórnvöld leggja innflutningstoll á allar innfluttar vörur. Hvað gerist samkvæmt líkaninu af opnu hagkerfi ef S og I eru óbreytt?",
 o:["Eftirspurn eftir krónum eykst, raungengið hækkar og NX er á endanum óbreytt. Raunvextir og NCO óbreytt","NX eykst varanlega og viðskiptahallinn hverfur","Raunvextir hækka og NCO minnkar","Raungengið lækkar og NX eykst","Framboð króna eykst og raungengið lækkar"], a:0,
 e:"Tollurinn eykur NX við gefið E, en E hækkar þar til áhrifin á NX hverfa, því NX = S − I. Viðskiptahalli BNA var 903,5 ma.$ 2024 og 901,5 ma.$ 2025 þrátt fyrir tollahækkanir."},
{id:"o19", t:"opi", q:"Lífeyrissjóðirnir ákveða að kaupa meira af erlendum eignum við hvert vaxtastig. Hver eru áhrifin?",
 o:["NCO ↑ → eftirspurn eftir lánsfé eykst → r ↑; framboð króna eykst → E ↓ → NX ↑","NCO ↓ → r ↓ → E ↑ → NX ↓","Framboð lánsfjár eykst → r ↓ → E ↓","Engin áhrif á vexti, aðeins á gengið","S ↓ → r ↑ → E ↑"], a:0,
 e:"Sama keðja og fjármagnsflótti, bara minni. Skilaverkefni 3 dæmi 5c."},
{id:"o20", t:"opi", q:"Raunvextir á Íslandi hækka miðað við raunvexti erlendis (r − r* eykst). Hvað gerist við NCO samkvæmt líkaninu?",
 o:["NCO minnkar, því innlendar eignir verða eftirsóknarverðari","NCO eykst","NCO er óháð vöxtum","NX eykst strax","Raungengið lækkar"], a:0,
 e:"NCO er niðurhallandi fall af raunvöxtum, alveg eins og innlend fjárfesting. Aukinn vaxtamunur við útlönd → innstreymi fjármagns."},
{id:"o21", t:"opi", q:"Hvaða tæki hefur Seðlabanki Íslands til að draga úr hvata til skammtímafjárfestinga útlendinga í krónum (svo-kallaðra vaxtamunarviðskipta)?",
 o:["Fjárstreymistækið: fjárfestar þurfa að binda hluta fjárfestingar á 0% vöxtum","Bindiskyldu á heimili","Magnbundna íhlutun","Innstæðutryggingu","Verðtryggingu"], a:0,
 e:"Fjárstreymistækið dregur úr væntum hagnaði. Önnur ráð gegn fjármagnsflótta: gjaldeyrisforði og ábyrg ríkisfjármálastefna."},
{id:"o22", t:"opi", q:"Opið hagkerfi: Y = 5.200, C = 2.750, I = 1.330, G = 1.300 (ma.kr.). Hver er hreinn útflutningur og hvert streymir fjármagn?",
 o:["NX = −180 ma.kr.; NCO = −180, fjármagn streymir inn í landið","NX = 180 ma.kr.; fjármagn streymir út","NX = −180 ma.kr.; fjármagn streymir út","NX = 0","NX = 1.150 ma.kr."], a:0,
 e:`<div class="f">S = Y − C − G = 5.200 − 2.750 − 1.300 = 1.150<br>NX = S − I = 1.150 − 1.330 = −180 = NCO</div>NCO &lt; 0 þýðir hreint innstreymi fjármagns. (Skilaverkefni 3, dæmi 5.)`},
// ======================= FASTIR REIKNINGAR & MÆLINGAR (MT20, MT23) =======================
{id:"r01", t:"rei", q:"Hvað af eftirfarandi telst til vergrar landsframleiðslu Íslands árið 2026?",
 o:["Byggingarfyrirtæki lýkur við nýja íbúð árið 2026 sem er enn óseld í árslok","Bílasala selur notaðan bíl sem var framleiddur 2020","Bakarí kaupir hveiti sem það notar í brauð sem selt er sama ár","Ríkið greiðir atvinnuleysisbætur","Íslendingur kaupir hlutabréf í Marel"], a:0,
 e:"Óseld íbúð telst til birgðabreytinga, sem eru hluti fjárfestingar. Notaðar vörur voru taldar þegar þær voru framleiddar, hveitið er aðfang (tvítalning), bætur eru millifærsla og hlutabréfakaup eru sparnaður."},
{id:"r02", t:"rei", q:"Heimili kaupir nýbyggða íbúð. Undir hvaða lið VLF flokkast það?",
 o:["Fjárfestingu (I)","Einkaneyslu (C)","Ríkisútgjöld (G)","Hreinan útflutning (NX)","Telst ekki til VLF"], a:0,
 e:"Húsnæðiskaup teljast til fjárfestingar, ekki einkaneyslu. Einkaneysla nær ekki yfir kaup á íbúðarhúsnæði eða notuðum vörum."},
{id:"r03", t:"rei", q:"Hvað af eftirfarandi telst til ríkisútgjalda (G) í VLF?",
 o:["Laun kennara í grunnskóla","Atvinnuleysisbætur","Ellilífeyrir","Barnabætur","Vaxtagreiðslur ríkissjóðs"], a:0,
 e:"G eru kaup ríkis og sveitarfélaga á vörum og þjónustu, þar með talin laun. Millifærslur eru ekki greiddar fyrir nýja framleiðslu."},
{id:"r04", t:"rei", q:"Hvers vegna eykst VLF ekki þótt innflutningur dragist saman (sbr. dæmið um landsframleiðslu á tunglinu)?",
 o:["Innflutningur er dreginn frá því hann er þegar talinn í C, I og G; minni innflutningur lækkar þá liði jafn mikið","Innflutningur er ekki hluti af VLF-jöfnunni","Innflutningur er alltaf jafn útflutningi","Minni innflutningur eykur alltaf VLF","Innflutningur er talinn tvisvar"], a:0,
 e:`<div class="f">0 = 100 + 0 + 0 + 0 − 100 og 0 = 50 + 0 + 0 + 0 − 50</div>VLF mælir innlenda framleiðslu. Að draga úr innflutningi eykur hana ekki sjálfkrafa.`},
{id:"r05", t:"rei", q:"Verð á innfluttum farsímum hækkar um 20% en verð allrar innlendrar framleiðslu er óbreytt. Hvað gerist líklegast?",
 o:["Vísitala neysluverðs hækkar en verðvísitala VLF ekki","Verðvísitala VLF hækkar en VNV ekki","Báðar hækka jafn mikið","Hvorug breytist","Báðar lækka"], a:0,
 e:"VVLF mælir verð innlendrar framleiðslu. VNV mælir verð þess sem neytendur kaupa, þar með talið innfluttar vörur."},
{id:"r06", t:"rei", q:"Hvert af eftirfarandi er EKKI galli á vísitölu neysluverðs sem mælikvarða á framfærslukostnað?",
 o:["Hún tekur með innfluttar vörur","Karfan breytist hægt þótt neytendur færi sig yfir í vörur sem eru orðnar hlutfallslega ódýrari","Hún nær illa yfir nýjar vörur, t.d. síma og fartölvur","Hún tekur ekki nægilega tillit til aukinna vörugæða","Allir ofangreindir eru gallar"], a:0,
 e:"Að taka með innfluttar vörur er einmitt rétt fyrir mælikvarða á það sem neytendur kaupa. Hinir þrír eru gallarnir sem taldir eru upp í MT20."},
{id:"r07", t:"rei", q:"Hver er munurinn á vergri landsframleiðslu (VLF) og vergri þjóðarframleiðslu (VÞF)?",
 o:["VÞF telur framleiðslu Íslendinga erlendis en dregur frá framleiðslu útlendinga hér á landi","VÞF telur aðeins framleiðslu hins opinbera","VÞF er VLF að frádregnum afskriftum","VÞF er VLF á föstu verðlagi","Enginn munur"], a:0,
 e:"VLF mælir framleiðslu innan landamæra, óháð þjóðerni framleiðandans."},
{id:"r08", t:"rei", q:"Barn brýtur glugga og foreldrið borgar fyrir viðgerð. VLF eykst. Hvað bendir Bastiat (1850) á?",
 o:["Fórnarkostnaðinn: peningarnir hefðu annars farið í annað, t.d. skó, og barnið ætti þá skó og gluggi væri heill","Að það sé gott fyrir hagkerfið að brjóta glugga","Að VLF mæli ekki viðgerðir","Að glerframleiðsla sé innflutningur","Að VLF hækki aðeins ef glugginn er innfluttur"], a:0,
 e:"Hærri VLF þýðir ekki betri lífskjör ef framleiðslan fer í að bæta upp tjón."},
{id:"r09", t:"rei", q:"Nafnvirði VLF jókst um 10% á milli ára en verðvísitala VLF hækkaði um 6%. Hver var raunhagvöxtur, nákvæmlega?",
 o:["Um 3,8%","4,0%","16,6%","6,0%","1,7%"], a:0,
 e:`<div class="f">Raunvirði = Nafnvirði / Verðvísitala<br>1,10 / 1,06 − 1 = 0,0377 ≈ 3,8%</div>4% er nálgunin 10% − 6%.`},
{id:"r10", t:"rei", q:"Óverðtryggðir fastir vextir til 3 ára eru 8,75% en verðtryggðir 4,64%. Samkvæmt einföldun MT20, hvað endurspeglar munurinn?",
 o:["Væntanlega verðbólgu auk óvissuálags","Raunvexti","Skattaskekkjur","Bindiskyldu bankanna","Vaxtamun banka"], a:0,
 e:"Óverðtryggðir vextir ≈ raunvextir + verðbólga + óvissuálag; verðtryggðir ≈ raunvextir (verðbólgan bætist ofan á höfuðstólinn)."},
{id:"r11", t:"rei", q:"Hver er verðvísitala VLF ef nafnvirði VLF er 10.000 ma.kr. og raunvirði 5.000 ma.kr.?",
 o:["200","50","2","0,5","100"], a:0,
 e:`<div class="f">VVLF = Nafnvirði / Raunvirði × 100 = 10.000 / 5.000 × 100 = 200</div>(Sýnidæmi 3, dæmi 2a.)`},
// ======================= HAGVÖXTUR OG SOLOW (MT20–21) =======================
{id:"x01", t:"vox", q:"Sparnaðarhlutfallið eykst varanlega í hagkerfi í Solow-jafnvægi. Hvað gerist?",
 o:["Tímabundinn hagvöxtur, en framleiðsla á mann verður varanlega hærri í nýju jafnvægi","Varanlega hærri hagvöxtur","Engin áhrif til langs tíma á framleiðslu á mann","Framleiðsla á mann lækkar því neysla minnkar","Afskriftir hætta"], a:0,
 e:"sY hliðrast upp → I > δK → k vex upp í nýtt k** → y** > y*. Hagvöxtur stöðvast svo vegna minnkandi jaðarframleiðni fjármagns."},
{id:"x02", t:"vox", q:"Samkvæmt Solow-líkaninu, hvað er eina uppspretta varanlegs hagvaxtar á mann til langs tíma?",
 o:["Tækniframfarir","Aukinn sparnaður","Aukin fjárfesting í fjármagni","Fólksfjölgun","Aukið peningamagn"], a:0,
 e:"Aðrir þættir auka hagvöxt aðeins tímabundið vegna minnkandi jaðarframleiðni fjármagns."},
{id:"x03", t:"vox", q:"Framleiðslufall er Y = A·L^0,6·K^0,6. Hvers konar stærðarhagkvæmni ríkir?",
 o:["Vaxandi stærðarhagkvæmni (a + b = 1,2 > 1)","Föst stærðarhagkvæmni","Fallandi stærðarhagkvæmni","Ekki hægt að segja án þess að vita A","Neikvæð stærðarhagkvæmni"], a:0,
 e:`<div class="f">Y(λL, λK) = λ^(a+b)·Y = λ^1,2·Y &gt; λY</div>Solow gerir ráð fyrir fastri stærðarhagkvæmni, a + b = 1.`},
{id:"x04", t:"vox", q:"Blómapottafyrirtæki með 1 starfsmann og 1 vél framleiðir 50 potta á ári. Það ræður annan starfsmann og kaupir aðra vél og framleiðir nú 90 potta. Hvers konar stærðarhagkvæmni er þetta?",
 o:["Fallandi stærðarhagkvæmni","Föst stærðarhagkvæmni","Vaxandi stærðarhagkvæmni","Fallandi jaðarframleiðni vinnuafls","Ekki hægt að segja"], a:0,
 e:"Aðföng tvöfaldast (+100%) en framleiðsla eykst aðeins um 80%. Föst væri 100 pottar, vaxandi meira en 100."},
{id:"x05", t:"vox", q:"Cobb-Douglas-fall: Y = A·L^0,7·K^0,3. Hvað gerist ef fjármagn eykst um 1% en vinnuafl er óbreytt?",
 o:["Framleiðsla eykst um 0,3%","Framleiðsla eykst um 0,7%","Framleiðsla eykst um 1%","Framleiðsla eykst um 0,21%","Framleiðsla breytist ekki"], a:0,
 e:"Veldisvísarnir lýsa jaðaráhrifum (teygni): 1% meira K → 0,3% meira Y; 1% meira L → 0,7% meira Y."},
{id:"x06", t:"vox", q:"Hvers vegna vaxa fátækari ríki oft hraðar en rík ríki samkvæmt Solow-líkaninu?",
 o:["Þau eru langt undir jafnvægisfjármagni og vegna minnkandi jaðarframleiðni skilar hver eining fjármagns þar meiru","Þau hafa betri tækni","Þau spara meira","Afskriftir eru engar í fátækum ríkjum","Þau hafa fleiri náttúruauðlindir"], a:0,
 e:"Meðalhagvöxtur 2015–2025: millitekjuríki ~4,3%, hátekjuríki ~2,0%. Rík ríki eru oft nálægt jafnvægi."},
{id:"x07", t:"vox", q:"Fólki fjölgar í Solow-hagkerfi. Hvað þarf til að fjármagn á mann haldist óbreytt?",
 o:["Fjárfesting þarf að vera meiri en afskriftir sem nemur fólksfjölguninni","Fjárfesting þarf að vera jöfn afskriftum","Ekkert, fjármagn á mann helst sjálfkrafa","Sparnaðarhlutfallið þarf að lækka","Afskriftir þurfa að aukast"], a:0,
 e:"Annars dreifist fjármagnið á fleiri hendur: K/L lækkar, framleiðni minnkar og lífskjör versna. Fólksfjölgun getur þó líka aukið tækniframfarir (fleiri hugmyndir)."},
{id:"x08", t:"vox", q:"Hagkerfi Hong Kong og Singapúr eru notuð í MT21 sem dæmi um hvað?",
 o:["Að náttúruauðlindir eru ekki nauðsynleg forsenda mikillar framleiðni","Að fólksfjölgun dregur úr lífskjörum","Að tollar auka hagvöxt","Að kommúnismi skilar meiri hagvexti","Að Malthus hafði rétt fyrir sér"], a:0,
 e:"„Bara malbik!“ Mannauður, fjármagn og tækni geta borið uppi mikla framleiðni án auðlinda."},
{id:"x09", t:"vox", q:"Erlent fyrirtæki reisir álver á Íslandi og rekur það sjálft. Hvers konar fjárfesting er það?",
 o:["Bein erlend fjárfesting","Óbein erlend fjárfesting","Innlend fjárfesting fjármögnuð með innlendum sparnaði","Opinber fjárfesting","Ekki fjárfesting í hagfræðilegum skilningi"], a:0,
 e:"Bein: fjármagnið í eigu útlendinga og rekið af þeim. Óbein: í eigu útlendinga en rekið af innlendum aðilum. Ný tækni fylgir oft erlendri fjárfestingu."},
{id:"x10", t:"vox", q:"Hvað sýndi „náttúrulega tilraunin“ með Austur- og Vestur-Þýskalandi eftir 1949?",
 o:["Lítill menningarmunur og sama tungumál, en meiri hagvöxtur í markaðshagkerfinu í vestri","Að kommúnískt hagkerfi skilaði meiri hagvexti","Að hagvöxtur ræðst eingöngu af náttúruauðlindum","Að tungumál skiptir mestu máli fyrir hagvöxt","Að enginn munur var á hagvexti"], a:0,
 e:"Stofnanir skipta sköpum: eignaréttur, markaðir og hagnaðarhvati. Skoda í kommúnisma og kapítalisma er annað dæmi á glærunum."},
{id:"x11", t:"vox", q:"VLF fer úr 100 í 133 á 6 árum. Meðaltal árlegra hlutfallsbreytinga er 4,93%. Hver er réttur meðalvöxtur á ári?",
 o:["4,87%","4,93%","5,50%","33%","5,00%"], a:0,
 e:`<div class="f">(133/100)^(1/6) − 1 = 1,048677 − 1 = 4,87%</div>Einfalt meðaltal ofmetur: 100·1,0493⁶ = 133,47 ≠ 133.`},
{id:"x12", t:"vox", q:"Hvers vegna sveiflast einkaneysla minna en fjárfesting samkvæmt MT20?",
 o:["Vegna fallandi jaðarnytja vill fólk jafna neyslu yfir æviskeiðið með lántöku og sparnaði; fyrirtæki fjárfesta hins vegar eftir væntingum","Vegna þess að ríkið stjórnar einkaneyslu","Einkaneysla er alltaf föst upphæð","Fjárfesting er mæld með meiri skekkju","Fyrirtæki vilja jafna fjárfestingu yfir tíma"], a:0,
 e:"Einkaneysla er sveiflujafnari. Þau sem hafa ekki aðgang að lánsfé geta þó ekki jafnað neyslu jafn vel."},
{id:"x13", t:"vox", q:"Í einföldu leikjafræðilíkani í MT20 velja tvö fyrirtæki samtímis hvort þau fjárfesta. Hvað einkennir jafnvægin?",
 o:["Tvö Nash-jafnvægi: að gera það sama og hinn. Aðeins jafnvægið þar sem báðir fjárfesta er Pareto-skilvirkt","Eitt Nash-jafnvægi þar sem hvorugt fjárfestir","Ekkert Nash-jafnvægi er til","Bæði jafnvægin eru jafn skilvirk","Ríkjandi stefna beggja er að fjárfesta ekki"], a:0,
 e:"Þetta skýrir hvers vegna fjárfesting kemur í bylgjum og fylgir væntingum. Í Nash-jafnvægi tekur hver bestu ákvörðun miðað við ákvarðanir hinna."},
{id:"x14", t:"vox", q:"Hvað af eftirfarandi er EKKI nefnt í MT21 sem einkenni misheppnaðs kapítalisma (t.d. í Argentínu)?",
 o:["Of mikil samkeppni á mörkuðum","Spilling","Opinber afskipti af mörkuðum","Pólitískur óstöðugleiki","Eignaréttur ekki varinn"], a:0,
 e:"Samkeppni er einmitt hluti af því sem lætur markaðshagkerfi virka."},
{id:"x15", t:"vox", q:"Hvers vegna varð fyrsta iðnbyltingin í Bretlandi samkvæmt MT21?",
 o:["Meðal annars vegna þess að vinnuafl var hlutfallslega dýrt en kol ódýr, sem hvatti til nýrra véla","Vegna þess að vinnuafl var mjög ódýrt","Vegna þess að Bretland hafði engin kol","Vegna þess að konungsvald var algjört","Vegna gullfótarins"], a:0,
 e:"Aðrar ástæður: aðgangur að fjármagni, kolanámur, upplýsingin, takmörkun konungsvalds eftir 1688, menning og nýlendur."},
{id:"x16", t:"vox", q:"Hvað mælir lögmál Okuns og hvar á það heima í námsefninu?",
 o:["Línulegt samband hagvaxtar og breytinga í atvinnuleysi; það lýsir hagsveiflubundnu atvinnuleysi","Samband verðbólgu og atvinnuleysis","Samband sparnaðar og fjárfestingar","Samband peningamagns og verðlags","Samband raunvaxta og gengis"], a:0,
 e:`<div class="f">Δuₜ = α + β·gₜ</div>Arthur Okun var ráðgjafi Kennedy. Verðbólga og atvinnuleysi er Phillips-kúrfan.`},
{id:"x17", t:"vox", q:"Hvað er „creative destruction“ í umfjöllun MT21 um iðnbyltinguna?",
 o:["Nýir framleiðsluhættir ryðja burt gömlum fyrirtækjum og losa vinnuafl og fjármagn til nýrrar framleiðslu","Stríðsrekstur sem eykur VLF","Afskriftir fjármagns","Þegar ríkið bannar nýja tækni","Þegar seðlabanki prentar peninga"], a:0,
 e:"Luddítar voru textílverkamenn sem börðust gegn nýjum vélum."},
// ======================= ÓJÖFNUÐUR OG FÁTÆKT (MT16) =======================
{id:"j01", t:"ojo", q:"Hvert er fyrsta skrefið við að teikna Lorenz-kúrfu?",
 o:["Raða einstaklingum eftir tekjum frá þeim lægstu til þeirra hæstu","Reikna meðaltekjur","Raða einstaklingum frá hæstu tekjum til lægstu","Teikna 45° línuna og reikna Gini","Skipta mannfjölda eftir aldri"], a:0,
 e:"Síðan er skipt í jafnstóra hópa og reiknaður hlutur hvers í heildartekjum. Kúrfan sýnir uppsafnað hlutfall tekna á móti uppsöfnuðu hlutfalli mannfjölda."},
{id:"j02", t:"ojo", q:"Hvað þýðir Gini-stuðull upp á 1?",
 o:["Fullkominn ójöfnuð tekna: einn fær allt","Fullkominn jöfnuð","Að Lorenz-kúrfan falli saman við 45° línuna","Að tekjur hafi tvöfaldast","Að helmingur fólks sé undir lágtekjumörkum"], a:0,
 e:"G = A/(A + B) er á bilinu 0 (fullkominn jöfnuður) til 1 (fullkominn ójöfnuður)."},
{id:"j03", t:"ojo", q:"Allir í samfélagi fylgja nákvæmlega sama ævitekjuferli (lágar tekjur ung, háar miðaldra, lágar á eftirlaunum). Hvað mælir Gini-stuðullinn?",
 o:["Hann mælir ójöfnuð þótt allir séu á sama ferli, og hann breytist eftir aldurssamsetningu","Hann er 0","Hann er 1","Hann mælir aðeins ójöfnuð milli kynslóða","Hann er óskilgreindur"], a:0,
 e:"Dæmi úr MT16: tekjur 500/1000/300. G = 0,20 með 600/200/200 í hópunum en 0,27 með 200/400/400. Annað vandamál: Gini fangar ekki muninn á nútímatekjum og ævitekjum."},
{id:"j04", t:"ojo", q:"Á pizzastað vinna 4 bakarar með 500.000 kr. og forstjóri með 3.000.000 kr. á mánuði. Hver eru meðallaun og miðgildi?",
 o:["Meðallaun 1.000.000 kr., miðgildi 500.000 kr.","Meðallaun 700.000 kr., miðgildi 500.000 kr.","Meðallaun 500.000 kr., miðgildi 1.000.000 kr.","Hvort tveggja 1.000.000 kr.","Meðallaun 1.750.000 kr., miðgildi 500.000 kr."], a:0,
 e:`<div class="f">Meðaltal = (4 × 500.000 + 3.000.000) / 5 = 5.000.000 / 5 = 1.000.000</div>Miðgildi = 3. talan í röð = 500.000. Tekjudreifingar hafa langa hala svo miðgildi er meira lýsandi.`},
{id:"j05", t:"ojo", q:"Við hvað eru lágtekjumörk (fátæktarmörk) almennt miðuð í Evrópu?",
 o:["60% af miðgildi launa","50% af meðallaunum","Lágmarkslaun","Atvinnuleysisbætur","Neðstu 10% tekjudreifingarinnar"], a:0,
 e:"Á Íslandi er fátækt mæld með lágtekjumörkum og skorti á efnislegum gæðum (þrennt af níu atriðum á lista)."},
{id:"j06", t:"ojo", q:"Hvaða stjórnmálaheimspeki byggir á því að hámarka eigi summu nytja allra og að fallandi jaðarnyt réttlæti endurdreifingu, þó án þess að eyða hvötum?",
 o:["Nytjastefna (e. utilitarianism)","Frjálslyndisstefna Rawls (e. liberalism)","Frjálshyggja (e. libertarianism)","Malthusarkenning","Kenning Hume"], a:0,
 e:"Nytjastefnuyfirvöld vega ábata af jöfnuði á móti tapinu af bjöguðum hvötum til vinnu."},
{id:"j07", t:"ojo", q:"John Rawls lagði til að við ákvæðum reglur um endurdreifingu áður en við vitum inn í hvaða aðstæður við fæðumst. Hvað taldi hann að ætti að hámarka?",
 o:["Lágmarksnyt í samfélaginu, þ.e. hag þeirra sem verst eru settir","Summu nytja allra","Meðaltekjur","Hagvöxt","Ekkert; ríkið á ekki að endurdreifa"], a:0,
 e:"Rawls taldi þó ekki æskilegt að útrýma allri misdreifingu, því hvatar geta aukið getu samfélagsins til að hjálpa þeim tekjulægstu."},
{id:"j08", t:"ojo", q:"Hver er afstaða frjálshyggju (e. libertarianism) til endurdreifingar tekna samkvæmt MT16?",
 o:["Ríkið á að tryggja sanngjarnt ferli og jöfn tækifæri, en ekki endurdreifa tekjum eftir á","Ríkið á að hámarka summu nytja","Ríkið á að hámarka hag þeirra verst settu","Ríkið á að jafna allar tekjur","Ríkið á að ákveða laun allra"], a:0,
 e:"Frjálshyggja hafnar því að tekjur séu samfélagsleg gæði sem hægt sé að endurdreifa; einstaklingar þéna þær."},
{id:"j09", t:"ojo", q:"Neikvæður tekjuskattur: Skattur = ⅓ af tekjum − 200.000. Hvað greiðir einstaklingur með 400.000 kr. í tekjur á mánuði?",
 o:["−66.667 kr., hann fær greitt frá skattinum","133.333 kr.","66.667 kr.","0 kr.","−200.000 kr."], a:0,
 e:`<div class="f">400.000 / 3 − 200.000 = 133.333 − 200.000 = −66.667</div>Með 1.000.000 kr. greiðir einstaklingur 333.333 − 200.000 = 133.333.`},
{id:"j10", t:"ojo", q:"Lífeyrisþegi með 400 þ.kr. í laun hefur 487.199 kr. í ráðstöfunartekjur. Ef hann tekur aukavakt og fær 410 þ.kr. hækka ráðstöfunartekjurnar í 489.873 kr. Hver er jaðarskatturinn?",
 o:["Um 73%","Um 27%","Um 2,7%","Um 50%","Um 22%"], a:0,
 e:`<div class="f">1 − (489.873 − 487.199) / 10.000 = 1 − 2.674/10.000 = 0,73</div>Af 10.000 kr. viðbót heldur hann aðeins 2.674. Úrræði gegn fátækt fela oft í sér háa jaðarskatta.`},
{id:"j11", t:"ojo", q:"Hvað gildir um eignaójöfnuð samanborið við tekjuójöfnuð?",
 o:["Eignir dreifast ójafnar en tekjur í flestum löndum","Eignir dreifast jafnar en tekjur","Enginn munur","Eignaójöfnuður er aðeins til í fátækum löndum","Gini fyrir eignir er alltaf 0"], a:0,
 e:"Á Íslandi er eignaójöfnuður meiri en tekjuójöfnuður en lítill í alþjóðlegu samhengi; miðgildi eigna á mann er það hæsta í heiminum."},
{id:"j12", t:"ojo", q:"Hver eftirtalinna fullyrðinga er stefnugreining (e. normative) en ekki staðreyndagreining?",
 o:["Ríkið ætti að hækka örorkubætur","Hækkun lágmarkslauna getur dregið úr störfum ef eftirspurn er teygin","Gini-stuðullinn á Íslandi er með þeim lægstu í heiminum","Eignir dreifast ójafnar en tekjur","Neikvæður tekjuskattur endurdreifir tekjum"], a:0,
 e:"Stefnugreining segir hvernig heimurinn á að vera; staðreyndagreining hvernig hann virkar. Mikið af umfjöllun um ójöfnuð er stefnugreining."},
{id:"j13", t:"ojo", q:"Hvað sýnir tíundastuðull launa?",
 o:["Hlutfallið milli heildarlauna efsta tíundahluta og neðsta tíundahluta","Hlutfall launþega undir meðaltali","Gini-stuðul fyrir tíu stærstu fyrirtækin","Meðallaun deilt með miðgildi","Tíu prósent af miðgildi"], a:0,
 e:"Á Íslandi hefur tíundastuðull reglulegra heildarlauna verið á bilinu ~3,4–4,1 á árunum 2014–2025."},
// ======================= SPARNAÐUR OG LÁNSFJÁRMARKAÐUR (MT23) =======================
{id:"s01", t:"spa", q:"Hvað af eftirfarandi telst fjárfesting í hagfræðilegum skilningi?",
 o:["Hótel kaupir nýjar þvottavélar","Heimili kaupir hlutabréf í Icelandair","Lífeyrissjóður kaupir ríkisskuldabréf","Einstaklingur leggur inn á sparireikning","Fjárfestir kaupir notaða verksmiðju af öðru fyrirtæki"], a:0,
 e:"Fjárfesting = útgjöld til fjárfestingarvara (vélar, verksmiðjur, hótel, skip). Kaup á verðbréfum eru sparnaður, og kaup á notuðu eigni eru eignatilfærsla."},
{id:"s02", t:"spa", q:"Hver er munurinn á fjármálamörkuðum og fjármálastofnunum?",
 o:["Á fjármálamörkuðum útvega sparifjáreigendur lánsfé beint; fjármálastofnanir (t.d. bankar) hafa milligöngu um það óbeint","Fjármálamarkaðir eru í eigu ríkisins en fjármálastofnanir einkaaðila","Fjármálastofnanir versla aðeins með hlutabréf","Enginn munur","Fjármálamarkaðir taka við innlánum"], a:0,
 e:"Markaðir: hlutabréf og skuldabréf (verðbréf). Stofnanir: bankar og fjárfestingarsjóðir."},
{id:"s03", t:"spa", q:"Hvað gildir almennt um hlutabréf samanborið við skuldabréf?",
 o:["Hlutabréf eru eignarhlutur og eru jafnan bæði arðbærari og áhættusamari","Hlutabréf eru skuld fyrirtækisins við eigandann og öruggari","Hlutabréf bera fasta vexti","Skuldabréf veita eignarhlut í fyrirtæki","Hlutabréf hafa gjalddaga"], a:0,
 e:"Skuldabréf kveða á um skuld með lánstíma og vöxtum; áhættan er að útgefandi standi ekki í skilum."},
{id:"s04", t:"spa", q:"Hvert er sambandið milli ávöxtunarkröfu og verðs skuldabréfs?",
 o:["Neikvætt: þegar krafan hækkar lækkar verðið","Jákvætt: þegar krafan hækkar hækkar verðið","Ekkert samband","Krafan er alltaf jöfn vöxtunum","Verðið er alltaf 100"], a:0,
 e:`<div class="f">Ávöxtunarkrafa ≈ Vextir / Verð × 100</div>Lægra verð fyrir sömu vaxtagreiðslur þýðir hærri ávöxtun.`},
{id:"s05", t:"spa", q:"Hvað einkennir áhættufælinn einstakling?",
 o:["Hann tekur ekki sanngjörnu veðmáli þar sem væntigildi útkomunnar er 0","Hann tekur jafnvel ósanngjörnu veðmáli","Hann fjárfestir eingöngu í hlutabréfum","Hann sparar aldrei","Hann vill hámarka áhættu"], a:0,
 e:"Áhættusækinn tekur sanngjörnu veðmáli og jafnvel ósanngjörnu."},
{id:"s06", t:"spa", q:"Hvaða áhættu er EKKI hægt að dreifa með því að kaupa hlutabréf í mörgum óskyldum fyrirtækjum?",
 o:["Heildaráhættu (e. aggregate risk), sem snertir allt hagkerfið","Sértækri áhættu (e. idiosyncratic risk)","Áhættu bundinni við eitt fyrirtæki","Áhættu bundinni við eina atvinnugrein","Allri áhættu má dreifa"], a:0,
 e:"Tíu egg í fimm körfur dreifir sértækri áhættu, en ekki áfalli sem lendir á öllum körfunum í einu."},
{id:"s07", t:"spa", q:"Stjórnvöld lækka skatta á fjárfestingu fyrirtækja. Hvað gerist á lánsfjármarkaði?",
 o:["Eftirspurn eftir lánsfé hliðrast til hægri, vextir hækka og lánsfé í umferð eykst","Framboð lánsfjár hliðrast til hægri og vextir lækka","Eftirspurn hliðrast til vinstri og vextir lækka","Framboð hliðrast til vinstri og vextir hækka","Engin áhrif"], a:0,
 e:"Hærri vextir auka líka sparnað (hreyfing eftir framboðsferlinum). Berðu saman við lægri skatta á sparnað, sem hliðra framboðinu."},
{id:"s08", t:"spa", q:"Hvað eru ruðningsáhrif (e. crowding out) á lánsfjármarkaði?",
 o:["Lántökur ríkisins til að fjármagna halla hækka vexti og ryðja burt fjárfestingu einkaaðila","Einkaaðilar ryðja ríkinu af lánsfjármarkaði","Erlendir fjárfestar ryðja innlendum burt","Seðlabankinn ryður bönkunum burt","Skattahækkanir auka fjárfestingu"], a:0,
 e:"Ríkishalli = minni opinber sparnaður → framboð lánsfjár ← → r ↑ → I ↓."},
{id:"s09", t:"spa", q:"Lokað hagkerfi: S = 200 + 40r og I = 800 − 60r (r í %). Fjárfestingarhvati eykur fjárfestingu um 50 við hvert vaxtastig (I = 850 − 60r) og opinber sparnaður er óbreyttur. Hve mikið eykst fjárfesting í jafnvægi?",
 o:["Um 20 ma.kr.","Um 50 ma.kr.","Um 30 ma.kr.","Um 0","Um 440 ma.kr."], a:0,
 e:`<div class="f">Fyrir: 200 + 40r = 800 − 60r ⇒ r = 6, I = 440<br>Eftir: 200 + 40r = 850 − 60r ⇒ r = 6,5, I = 460</div>Vextir hækka og draga úr hluta aukningarinnar, svo I eykst minna en 50. (Sýnidæmi 3, dæmi 4.)`},
{id:"s10", t:"spa", q:"Lokað hagkerfi: Einkasparnaður = 300 + 50r, opinber sparnaður T − G = 100, I = 1.000 − 50r (r í %). Hverjir eru raunvextir og fjárfesting í jafnvægi?",
 o:["r = 6%, I = 700 ma.kr.","r = 7%, I = 650 ma.kr.","r = 5%, I = 750 ma.kr.","r = 6%, I = 600 ma.kr.","r = 8%, I = 600 ma.kr."], a:0,
 e:`<div class="f">300 + 50r + 100 = 1.000 − 50r<br>100r = 600 ⇒ r = 6<br>I = 1.000 − 300 = 700 = S</div>(Skilaverkefni 3, dæmi 3a.)`},
{id:"s11", t:"spa", q:"Hvaða vextir ráða framboði og eftirspurn á lánsfjármarkaði?",
 o:["Raunvextir","Nafnvextir","Stýrivextir","Innlánsvextir","Dráttarvextir"], a:0,
 e:`<div class="f">r = (1 + i)/(1 + π) − 1 ≈ i − π</div>`},
{id:"s12", t:"spa", q:"Hvenær ræðst fyrirtæki í fjárfestingu samkvæmt núvirðishugtakinu?",
 o:["Þegar núvirði væntra tekna er meira en núvirði kostnaðar","Þegar tekjur eru meiri en kostnaður í krónum, óháð tímasetningu","Þegar vextir eru hærri en vænt ávöxtun","Alltaf þegar vextir lækka","Þegar framtíðarvirði kostnaðar er hærra en tekna"], a:0,
 e:`<div class="f">PV = X / (1 + r)^N</div>Hærri vextir lækka núvirði framtíðartekna og draga úr fjárfestingu: eftirspurnin eftir lánsfé hallar niður.`},
{id:"s13", t:"spa", q:"Hvert er helsta hlutverk fjárfestingarsjóða fyrir litla sparifjáreigendur?",
 o:["Að gera þeim kleift að dreifa áhættu með því að kaupa hlut í verðbréfasafni","Að tryggja þeim fasta vexti","Að veita þeim lán","Að geyma seðla","Að verja þá gegn heildaráhættu"], a:0,
 e:"Sjóðirnir selja almenningi bréf og kaupa fyrir andvirðið hlutabréf og skuldabréf."},
{id:"s14", t:"spa", q:"Lokað hagkerfi: VLF 2.000 ma.kr., skattar 600, einkasparnaður 200 og opinber sparnaður 100. Hver er einkaneysla?",
 o:["1.200 ma.kr.","1.400 ma.kr.","1.700 ma.kr.","1.100 ma.kr.","1.500 ma.kr."], a:0,
 e:`<div class="f">Einkasparnaður = Y − T − C ⇒ C = 2.000 − 600 − 200 = 1.200<br>G = T − opinber sparnaður = 600 − 100 = 500<br>S = I = 300</div>(Sýnidæmi 2, dæmi 2.)`},
// ======================= ALÞJÓÐAVIÐSKIPTI (MT17) =======================
{id:"d01", t:"vid", q:`Vinnustundir á einingu (hvort land hefur 120 vinnustundir):<table class="dt"><tr><th></th><th>Saltfiskur (klst./tonn)</th><th>Vín (klst./tunnu)</th></tr><tr><td>Ísland</td><td>3</td><td>6</td></tr><tr><td>Portúgal</td><td>2,5</td><td>2</td></tr></table>Hvaða land hefur hlutfallslega yfirburði í saltfiski?`,
 o:["Ísland, því fórnarkostnaður tonns af saltfiski er 0,5 tunna á Íslandi en 1,25 tunnur í Portúgal","Portúgal, því það þarf færri klukkustundir í saltfisk","Portúgal, því það hefur algera yfirburði í báðum vörum","Ísland, því það þarf fleiri klukkustundir í vín","Hvorugt"], a:0,
 e:`<div class="f">Fórnark. saltfisks = (klst./tonn) / (klst./tunnu)<br>Ísland: 3/6 = 0,5 tunna; Portúgal: 2,5/2 = 1,25 tunnur</div>Gildran: í töflu með <b>vinnustundum á einingu</b> snúast hlutföllin við miðað við töflu með <b>framleiðslu á tímabili</b>. Portúgal hefur algera yfirburði í báðum.`},
{id:"d02", t:"vid", q:"Fórnarkostnaður eins tonns af saltfiski er 0,5 tunna af víni á Íslandi en 1,25 tunnur í Portúgal. Á hvaða verðbili, mælt í tunnum af víni fyrir tonn af saltfiski, geta bæði lönd hagnast á viðskiptum?",
 o:["Milli 0,5 og 1,25 tunna","Milli 0 og 0,5 tunna","Yfir 1,25 tunnum","Milli 0,8 og 2 tunna","Aðeins við nákvæmlega 1 tunnu"], a:0,
 e:"Ísland selur saltfisk ef það fær meira en fórnarkostnaðinn (0,5); Portúgal kaupir ef það borgar minna en sinn fórnarkostnað (1,25). Samningsverðið 20 tunnur fyrir 20 tonn = 1 er innan bilsins."},
{id:"d03", t:"vid", q:"Nautgripabóndinn framleiðir 1 kg af kjöti á kostnað 2 kg af kartöflum; kartöflubóndinn á kostnað 4 kg. Hvert er mögulegt verð á 1 kg af kjöti í viðskiptum þeirra?",
 o:["Milli 2 og 4 kg af kartöflum","Undir 2 kg af kartöflum","Yfir 4 kg af kartöflum","Milli ¼ og ½ kg af kartöflum","Nákvæmlega 6 kg af kartöflum"], a:0,
 e:"Í dæminu í MT17 er samið um 3 kg af kartöflum fyrir 1 kg af kjöti; báðir neyta utan síns framleiðslujaðars."},
{id:"d04", t:"vid", q:"Hvað þýða algjörir yfirburðir?",
 o:["Að framleiðandi þarf minna af aðföngum (t.d. tíma) til að framleiða tiltekið magn","Að framleiðandi hefur lægri fórnarkostnað","Að framleiðandi á að sérhæfa sig í vörunni","Að framleiðandi græðir alltaf á viðskiptum","Að framleiðandi getur framleitt bæði vörurnar"], a:0,
 e:"Algjörir yfirburðir snúast um framleiðni; hlutfallslegir um fórnarkostnað. Það eru hlutfallslegu yfirburðirnir sem ráða sérhæfingu."},
{id:"d05", t:"vid", q:"Land sem hefur ekki stundað viðskipti opnar fyrir þau. Heimsmarkaðsverð er HÆRRA en innlent jafnvægisverð. Hvernig breytist ábatinn (svæði A–D á mynd af útflutningslandi)?",
 o:["Neytendaábati −B, framleiðendaábati +B+D, heildarábati +D","Neytendaábati +B+D, framleiðendaábati −B, heildarábati +D","Neytendaábati −B, framleiðendaábati +B, heildarábati óbreyttur","Neytendaábati +B, framleiðendaábati +D, heildarábati +B+D","Engin breyting"], a:0,
 e:"Landið flytur út. Verð innanlands hækkar upp í heimsmarkaðsverð: neytendur tapa B, framleiðendur græða B + D. Heildin eykst um D."},
{id:"d06", t:"vid", q:"Heimsmarkaðsverð er LÆGRA en innlent jafnvægisverð og opnað er fyrir viðskipti. Hvað gerist?",
 o:["Landið flytur inn, neytendaábati eykst og framleiðendaábati minnkar, heildarábati eykst","Landið flytur út, neytendaábati minnkar","Landið flytur inn, neytendaábati minnkar","Ekkert, verð innanlands breytist ekki","Landið flytur inn og heildarábati minnkar"], a:0,
 e:"Innflutningsland: neytendur +B+D, framleiðendur −B, heild +D. Ef innlent verð er yfir heimsmarkaðsverði hefur landið ekki hlutfallsyfirburði í vörunni."},
{id:"d07", t:"vid", q:"Tollur er lagður á innflutta vöru (svæði A–G á mynd í MT17). Hvert er allratapið?",
 o:["D + F","E","C","C + D + E + F","G + C"], a:0,
 e:"Neytendur tapa C+D+E+F, framleiðendur græða C, ríkið fær E í tolltekjur. Eftir stendur tap upp á D + F."},
{id:"d08", t:"vid", q:"Hvað greinir innflutningskvóta frá tolli samkvæmt MT17?",
 o:["Kvóti er ónæmur fyrir breytingum á heimsmarkaðsverði; ef heimsverð lækkar veitir hann meiri vernd án nýrrar ákvörðunar","Kvóti lækkar verð innanlands en tollur hækkar það","Kvóti veldur ekki allratapi","Tollur eykur neytendaábata","Enginn munur á neinn hátt"], a:0,
 e:"Ef ríkið selur kvótann fullu verði eru tekjurnar jafnar tolltekjum og áhrifin þau sömu. Kvóti getur líka leitt til meira allrataps vegna lobbýisma."},

// Reikningsdæmi sem búa til nýjar tölur í hvert skipti. Hvert fall skilar {q, o, a:0, e}.
const R = {
  ri: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: arr => arr[Math.floor(Math.random() * arr.length)],
  shuffle: arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
};
const F = {
  int: n => { const s = Math.round(n).toString(); const neg = s.startsWith('-'); const d = neg ? s.slice(1) : s; return (neg ? '−' : '') + d.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); },
  dec: (x, d = 2) => { const neg = x < 0 && Math.abs(x) >= 0.5 * Math.pow(10, -d); let [i, f] = Math.abs(x).toFixed(d).split('.'); i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return (neg ? '−' : '') + i + (f ? ',' + f : ''); },
  pct: (x, d = 1) => F.dec(x * 100, d) + '%',
  num: x => Number.isInteger(x) ? F.int(x) : F.dec(x, 2)
};
// Byggir 5 einstaka valkosti; correct fyrst.
function opts(correct, distract, fmt, perturb) {
  const c = fmt(correct); const out = [c]; const seen = new Set([c]);
  for (const d of distract) { if (d === null || d === undefined || !isFinite(d)) continue; const s = fmt(d); if (!seen.has(s)) { seen.add(s); out.push(s); } if (out.length === 5) break; }
  let k = 1;
  while (out.length < 5 && k < 60) { const v = perturb(correct, k); const s = fmt(v); if (!seen.has(s)) { seen.add(s); out.push(s); } k++; }
  return out;
}
const pertAdd = step => (c, k) => c + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * step;
const pertMul = (c, k) => c * (1 + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 0.08);

  const C = R.ri(8,30)*10, I = R.ri(2,8)*10, G = R.ri(3,9)*10, X = R.ri(3,12)*10; let M = R.ri(3,12)*10; if (M === X) M += 10;
  const Y = C + I + G + X - M; const vals = {C, I, G}; const names = {C:'einkaneysla', I:'fjárfesting', G:'útgjöld hins opinbera'}; const verb = {C:'er', I:'er', G:'eru'};
  const ask = R.pick(['C','I','G']); const others = Object.keys(vals).filter(k => k !== ask);
  const sumO = others.reduce((s,k)=>s+vals[k],0); const corr = vals[ask];
  const txt = others.map(k => `${names[k]} ${verb[k]} ${F.int(vals[k])} m.kr.`).join(', ');
  return { q:`Verg landsframleiðsla er ${F.int(Y)} m.kr., ${txt}, útflutningur er ${F.int(X)} m.kr. og innflutningur er ${F.int(M)} m.kr. ${ask==='G'?'Hver eru':'Hver er'} ${names[ask]} (${ask})?`,
    o: opts(corr, [Y - sumO, Y - sumO + (X - M), Y - sumO - X - M, Y - sumO - X].filter(v => v > 0), v => F.int(v) + ' m.kr.', pertAdd(10)), a:0,
    e:`<div class="f">Y = C + I + G + (X − M)<br>${ask} = ${F.int(Y)} − ${others.map(k=>F.int(vals[k])).join(' − ')} − (${F.int(X)} − ${F.int(M)}) = ${F.int(corr)}</div>Algengasta villan er að gleyma NX (gefur ${F.int(Y - sumO)}).` };

// ---------- Ársverðbólga úr VNV-töflu ----------
{id:"gen-vnv", t:"rei", name:"Ársverðbólga úr VNV-töflu", f(){
  const y0 = R.pick([2024, 2025]); const sm = R.ri(0, 11); const n = 15; let v = R.ri(5800, 6600) / 10; const rows = [];
  const drift = R.ri(2, 7) / 1000;
  for (let i = 0; i < n; i++) { rows.push(v); v = v * (1 + drift + (Math.random() - 0.45) * 0.01); v = Math.round(v * 10) / 10; }
  const lab = i => { const m = sm + i; return `${y0 + Math.floor(m/12)}M${String((m%12)+1).padStart(2,'0')}`; };
  const t = R.ri(12, 14); const corr = rows[t]/rows[t-12] - 1;
  const mname = i => { const m = sm + i; return `${MONTHS[m%12]}. ${y0 + Math.floor(m/12)}`; };
  const tbl = '<table class="dt"><tr><th>Mánuður</th><th>VNV</th></tr>' + rows.map((r,i)=>`<tr><td>${lab(i)}</td><td>${F.dec(r,1)}</td></tr>`).join('') + '</table>';
  return { q:`Taflan sýnir vísitölu neysluverðs. Hver var verðbólgan í ${mname(t)} mæld á ársgrundvelli?${tbl}`,
    o: opts(corr, [rows[t]/rows[t-1]-1, rows[t]/rows[t-11]-1, t>=13? rows[t]/rows[t-13]-1 : rows[t-1]/rows[0]-1, (rows[t]-rows[t-12])/rows[t], (rows[t]/rows[t-1]-1)*12], v=>F.pct(v), (c,k)=>c+(k%2?1:-1)*Math.ceil(k/2)*0.004), a:0,
    e:`<div class="f">π = VNV(${lab(t)}) / VNV(${lab(t-12)}) − 1 = ${F.dec(rows[t],1)} / ${F.dec(rows[t-12],1)} − 1 = ${F.pct(corr)}</div>Berðu saman sama mánuð með 12 mánaða millibili. Mánaðarbreytingin var ${F.pct(rows[t]/rows[t-1]-1)}.` };
}},

// ---------- Nákvæmir raunvextir ----------
{id:"gen-fisher", t:"rei", name:"Raunvextir (Fisher)", f(){
  const pairs = [[0.25,0.4],[0.5,2],[0.75,0.25],[0.4,1],[0.1,0.05],[0.08,0.12],[0.3,0.6],[0.6,0.2],[0.2,0.5],[0.15,0.35],[0.9,0.5],[0.05,0.1]];

    o: opts(c, [i-p, (1+p)/(1+i)-1, p-i, (i-p)/(1+i)], v=>F.pct(v,1), (c,k)=>c+(k%2?1:-1)*Math.ceil(k/2)*0.02), a:0,
    e:`<div class="f">r = (1 + i)/(1 + π) − 1 = ${F.dec(1+i,2)} / ${F.dec(1+p,2)} − 1 = ${F.pct(c,1)}</div>Nálgunin i − π = ${F.pct(i-p,1)} er aðeins góð þegar verðbólga er lítil.` };

{id:"gen-pv", t:"rei", name:"Núvirði", f(){
  const X = R.pick([1,2,5,8,10,12,15,20,25,50]) * 1e6, r = R.pick([0.03,0.04,0.05,0.06,0.07,0.08,0.1]), N = R.ri(2, 10);

    o: opts(c, [X*Math.pow(1+r,N), X/(1+r*N), X/Math.pow(1+r,N-1), X*Math.pow(1-r,N)], v=>F.int(v), pertMul), a:0,
