<style>

:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}

.tag.old{background:var(--warn-weak);color:var(--warn)}
.tag.gen{background:var(--accent-weak);color:var(--accent)}
.qtext{font-size:1.06rem;line-height:1.6;min-width:0}
.qtext b{font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:48px;line-height:1.45}

.timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,58px));z-index:4;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.clock.low{color:var(--bad)}
.tbar{flex:1 1 160px;height:6px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:120px}
.tbar i{display:block;height:100%;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.grid button{font-family:var(--f-mono);font-size:.82rem;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:8px;height:36px;cursor:pointer;position:relative}
.grid button.ans{background:var(--soft);color:var(--ink)}
.grid button.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink)}
.grid button.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.grid button.r{background:var(--good-weak);color:var(--good);border-color:transparent}
.grid button.w{background:var(--bad-weak);color:var(--bad);border-color:transparent}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1}
details.rv{border:1px solid var(--line);border-radius:12px;background:var(--paper)}
details.rv>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:baseline;list-style:none}
details.rv>summary::-webkit-details-marker{display:none}
details.rv>div{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;align-self:center}
.dot.g{background:var(--good)} .dot.b{background:var(--bad)} .dot.n{background:var(--line)}
.sheet{display:flex;flex-direction:column;gap:22px}
.sheet section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet h2{display:flex;gap:10px;align-items:baseline}
.sheet h2 .n{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.sheet .tt td,.sheet .tt th{font-size:.88rem}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols>div{min-width:0}
.plan li{list-style:none}
.plan ol{margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.step.brk{background:transparent;border-style:dashed}
.step.done{opacity:.55}
.step .tm{font-family:var(--f-mono);font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.step .tm small{display:block;color:var(--muted);font-size:.75rem}
.step h3{font-size:1rem}
.step p{font-size:.9rem;color:var(--muted);margin-top:2px}
.step input{width:22px;height:22px;accent-color:var(--accent);margin-top:2px}
.step .go{margin-top:8px}
input[type="time"]{font:inherit;font-family:var(--f-mono);border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);color:var(--ink)}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}

@media (max-width:720px){

<script>
// Gömul próf: engin eru til fyrir Kaflapróf 3 í HAG107G, svo OLD er tómt.
// Bæta má við spurningum hér á sama sniði ({id, t, src, q, o, a, e}).
const OLD = [];

// Nýjar krossaspurningar í stíl prófsins, byggðar á glærum K11, K12, K13, K17, K18, dæmablöðum 7–9 og aukadæmum 7–9.
const NEW = [
// ======================= EINOKUN (K11) =======================
{id:"e01", t:"ein", src:"K11 · Einokun: skilgreining",
 q:"Hvað af eftirfarandi er <b>EKKI</b> einkenni einokunar?",
 o:["Fyrirtækið stendur frammi fyrir láréttri eftirspurnarkúrfu","Einn seljandi á skýrt afmörkuð gæði","Engin náin staðkvæmdarvara er til","Aðgangshindranir halda öðrum frá markaðnum","Fyrirtækið getur sjálft ákveðið verðið"], a:0,
 e:"Lárétt eftirspurnarkúrfa einkennir fyrirtæki á samkeppnismarkaði, sem er verðþegi. Einokunarfyrirtækið er eini seljandinn og stendur því frammi fyrir niðurhallandi eftirspurn alls markaðarins. Hinir fjórir valkostirnir eru taldir upp á glærunum „Einokun: Skilgreining“ og „Einokun – samkeppni“."},
{id:"e02", t:"ein", src:"K11 · Orsakir einokunar",
 q:"Aðalorsök einokunar eru aðgangshindranir. Hvað af eftirfarandi er <b>EKKI</b> nefnt sem uppspretta þeirra á glærunum?",
 o:["Mörg lítil fyrirtæki framleiða einsleita vöru","Stærðarhagkvæmni","Eitt fyrirtæki á framleiðsluþátt sem nauðsynlegur er til framleiðslunnar","Leyfi ríkisvalds, t.d. einkaleyfi og höfundarréttur","Fyrirtæki tekur yfir önnur fyrirtæki á markaðnum og vex þannig"], a:0,
 e:"Mörg lítil fyrirtæki með einsleita vöru er lýsing á fullkominni samkeppni, andstæðu einokunar. Hinar fjórar orsakirnar eru taldar upp á glærunni „Einokun: Orsakir“."},
{id:"e03", t:"ein", src:"K11 · Tekjur einokunarfyrirtækis",
 q:"Af hverju eru jaðartekjur einokunarfyrirtækis alltaf lægri en verðið?",
 o:["Til að selja eina einingu í viðbót þarf að lækka verðið á öllum einingunum, svo verðáhrifin draga úr tekjuaukningunni","Af því að jaðarkostnaður hækkar þegar framleiðsla eykst","Af því að fastur kostnaður dreifist á fleiri einingar","Af því að einokunarfyrirtækið stendur frammi fyrir láréttri eftirspurn","Af því að ríkið skattleggur einokunarhagnað"], a:0,
 e:"Aukið magn hefur tvenns konar áhrif á HT = V × M: <b>magnáhrif</b> (fleiri einingar seldar, + V) og <b>verðáhrif</b> (allar fyrri einingar seljast á lægra verði, −). Jaðartekjur eru summan, svo JT &lt; V. Gildran „jaðarkostnaður hækkar“ blandar saman tekjuhliðinni og kostnaðarhliðinni."},
{id:"e04", t:"ein", src:"K11 · Tafla um heildar- og jaðartekjur",
 q:`Eftirspurn einokunarfyrirtækis er gefin í töflunni.<table class="dt"><tr><th>Magn</th><th>Verð</th></tr><tr><td>3</td><td>8</td></tr><tr><td>4</td><td>7</td></tr><tr><td>5</td><td>6</td></tr><tr><td>6</td><td>5</td></tr></table>Hverjar eru jaðartekjurnar af 5. einingunni?`,
 o:["2","6","30","4","−2"], a:0,
 e:`<div class="f">HT(4) = 4 × 7 = 28<br>HT(5) = 5 × 6 = 30<br>JT = HT(5) − HT(4) = 30 − 28 = 2</div>Gildrur: 6 er verðið (= meðaltekjur), 30 eru heildartekjurnar og 4 eru jaðartekjur 4. einingarinnar (28 − 24). Jaðartekjur eru alltaf breytingin í HT, ekki verðið.`},
{id:"e05", t:"ein", src:"K11 · Tafla um heildar- og jaðartekjur",
 q:"Í töflunni á glærunni lækkar verðið um 1 kr. fyrir hverja viðbótareiningu (M = 1 ⇒ V = 10, M = 2 ⇒ V = 9 o.s.frv.). Af hvaða einingu eru jaðartekjurnar núll?",
 o:["6. einingunni","5. einingunni","1. einingunni","8. einingunni","11. einingunni"], a:0,
 e:`<table class="dt"><tr><th>M</th><th>V</th><th>HT</th><th>JT</th></tr><tr><td>4</td><td>7</td><td>28</td><td>4</td></tr><tr><td>5</td><td>6</td><td>30</td><td>2</td></tr><tr><td>6</td><td>5</td><td>30</td><td>0</td></tr><tr><td>7</td><td>4</td><td>28</td><td>−2</td></tr></table>HT er jafn há (30) við 5 og 6 einingar, svo 6. einingin bætir engu við. Gildran er 5. einingin: hún gefur líka HT = 30, en jaðartekjur hennar eru 2.`},
{id:"e06", t:"ein", src:"K11 · Hámörkun hagnaðar",
 q:"Hvernig velur einokunarfyrirtæki magn og verð til að hámarka hagnað?",
 o:["Velur magnið þar sem JT = JK og les svo verðið af eftirspurnarkúrfunni við það magn","Velur magnið þar sem V = JK","Velur magnið þar sem JT = 0, þ.e. hámarkar heildartekjur","Velur magnið þar sem MHK er í lágmarki","Velur magnið þar sem V = MHK"], a:0,
 e:"Skrefin á glærunni: (1) JT = JK gefur magnið, (2) eftirspurnarkúrfan gefur verðið við það magn. Gildrur: V = JK er regla samkeppnisfyrirtækis; JT = 0 hámarkar tekjur en ekki hagnað; V = MHK er langtímajafnvægi í einokunarsamkeppni."},
{id:"e07", t:"ein", src:"Dæmablað 8, dæmi 1a",
 q:"Andhverft eftirspurnarfall einokunarfyrirtækis er P = 110 − Q og kostnaðarfallið er C = 30 + 6Q. Hvaða magn og verð velur fyrirtækið?",
 o:["Q = 52, P = 58","Q = 104, P = 6","Q = 55, P = 55","Q = 52, P = 6","Q = 26, P = 84"], a:0,
 e:`<div class="f">JT = 110 − 2Q<br>JK = 6<br>110 − 2Q = 6 ⇒ Q = 52<br>P = 110 − 52 = 58</div>Gildrur: Q = 104 kemur úr V = JK (samkeppnismagn). Q = 55 kemur úr JT = 0 (tekjuhámörkun). P = 6 er jaðarkostnaðurinn, ekki verðið sem neytendur greiða við Q = 52.`},
{id:"e08", t:"ein", src:"Dæmablað 8, dæmi 1b",
 q:"Áfram er P = 110 − Q og C = 30 + 6Q, og fyrirtækið framleiðir Q = 52 á P = 58. Hver er hagnaður þess?",
 o:["2.674","2.704","3.016","2.604","3.025"], a:0,
 e:`<div class="f">HT = 58 × 52 = 3.016<br>HK = 30 + 6 × 52 = 342<br>Hagnaður = 3.016 − 342 = 2.674</div>Gildrur: 2.704 gleymir fasta kostnaðinum (30). 3.016 eru heildartekjur. 2.604 er svarið við c-lið (fastur kostnaður 100).`},
{id:"e09", t:"ein", src:"Dæmablað 8, dæmi 1c",
 q:"Hvað gerist ef kostnaðarfallið breytist úr C = 30 + 6Q í C = 100 + 6Q (eftirspurn óbreytt, P = 110 − Q)?",
 o:["Q og P breytast ekki; hagnaður lækkar um 70 í 2.604","Fyrirtækið minnkar magn og hækkar verð","Verðið hækkar um 70 kr.","Fyrirtækið eykur magn til að dreifa fasta kostnaðinum","Q og P breytast ekki og hagnaður breytist ekki heldur"], a:0,
 e:`<div class="f">JK = 6 í báðum tilvikum ⇒ JT = JK gefur áfram Q = 52, P = 58<br>Hagnaður = 3.016 − (100 + 312) = 2.604</div>Fastur kostnaður hefur ekki áhrif á jaðarkostnað og því ekki á magn eða verð, aðeins á hagnaðinn. Algeng villa er að halda að hærri kostnaður (hvers konar sem er) skili sér í verðið.`},
{id:"e10", t:"ein", src:"Dæmablað 8, dæmi 2b",
 q:"Á markaðnum fyrir Apple-úr er MC = $45 og P = $150. Hver er Lerner-vísitalan?",
 o:["0,70","0,30","3,33","105","1,43"], a:0,
 e:`<div class="f">L = (P − MC) / P<br>L = (150 − 45) / 150 = 105 / 150 = 0,70</div>Gildrur: 0,30 = MC/P (hlutur jaðarkostnaðar í verðinu). 3,33 = P/MC (a-liður). 105 er álagningin í dollurum, ekki hlutfallið. 1,43 = 1/L, sem er tölugildi teygninnar (c-liður).`},
{id:"e11", t:"ein", src:"Dæmablað 8, dæmi 2c",
 q:"Apple hámarkar hagnað með P = $150 og MC = $45. Hvaða verðteygni eftirspurnar telur Apple sig standa frammi fyrir?",
 o:["−1,43","−0,70","−3,33","−0,30","−1,00"], a:0,
 e:`<div class="f">L = −1 / ε_D<br>0,70 = −1 / ε_D<br>ε_D = −1 / 0,70 = −1,43</div>Gildran −0,70 setur L beint inn sem teygni. Athugaðu líka að hagnaðarhámarkandi einokunarfyrirtæki með MC &gt; 0 er alltaf á teygna hluta eftirspurnar (|ε| &gt; 1), svo −0,70 og −0,30 geta ekki staðist.`},
{id:"e12", t:"ein", src:"Dæmablað 8, dæmi 3a",
 q:"Einokunarfyrirtæki selur á Grænlandi (P<sub>G</sub> = 120 − Q<sub>G</sub>) og Íslandi (P<sub>Í</sub> = 140 − 2,75Q<sub>Í</sub>) með kostnaðarfallið C = 20Q + 0,25Q². Ef það getur <b>ekki</b> stundað verðmismunun, hvert verður verðið (bæði lönd kaupa)?",
 o:["Um 86,1","Um 46,8","Um 125,3","Um 72,3","Um 98,0"], a:0,
 e:`Leggðu saman <b>magnið</b> (lárétt samlagning), ekki verðin:<div class="f">Q<sub>G</sub> = 120 − P<br>Q<sub>Í</sub> = (140 − P)/2,75 = 50,91 − 0,3636P<br>Q = 170,91 − 1,3636P ⇒ P = 125,33 − 0,7333Q<br>JT = 125,33 − 1,4667Q<br>JK = 20 + 0,5Q<br>125,33 − 1,4667Q = 20 + 0,5Q ⇒ Q = 53,56<br>P = 125,33 − 0,7333 × 53,56 = 86,06</div>Gildrur: 46,8 er jaðarkostnaðurinn við Q = 53,56. 125,3 er skurðpunktur samanlagðrar eftirspurnar við lóðrétta ásinn. Algengasta villan er að leggja saman andhverfu föllin (P<sub>G</sub> + P<sub>Í</sub>) í stað magnsins.`},
{id:"e13", t:"ein", src:"Dæmablað 8, dæmi 3b",
 q:"Sama fyrirtæki (P<sub>G</sub> = 120 − Q<sub>G</sub>, P<sub>Í</sub> = 140 − 2,75Q<sub>Í</sub>, C = 20Q + 0,25Q²) getur nú aðgreint markaðina. Hvaða verð setur það?",
 o:["P<sub>G</sub> ≈ 83,4 og P<sub>Í</sub> ≈ 93,4","P<sub>G</sub> ≈ 70 og P<sub>Í</sub> ≈ 80","P<sub>G</sub> = P<sub>Í</sub> ≈ 86,1","P<sub>G</sub> ≈ 93,4 og P<sub>Í</sub> ≈ 83,4","P<sub>G</sub> ≈ 46,8 og P<sub>Í</sub> ≈ 46,8"], a:0,
 e:`Regla: JT á hvorum markaði = JK af <b>heildarmagninu</b>.<div class="f">JT<sub>G</sub> = 120 − 2Q<sub>G</sub><br>JT<sub>Í</sub> = 140 − 5,5Q<sub>Í</sub><br>JK = 20 + 0,5(Q<sub>G</sub> + Q<sub>Í</sub>)</div>Úr JT<sub>G</sub> = JT<sub>Í</sub> og JT<sub>G</sub> = JK fæst:<div class="f">Q<sub>Í</sub> = 16,95 · Q<sub>G</sub> = 36,61 · JK = 46,78<br>P<sub>G</sub> = 120 − 36,61 = 83,39<br>P<sub>Í</sub> = 140 − 2,75 × 16,95 = 93,39</div>Hærra verð þar sem eftirspurn er óteygnari (Ísland). Gildran 70/80 fæst með því að setja JK = 20 (gleyma 0,25Q²-liðnum). Víxlaða parið snýr mörkuðunum við. 46,8 er JK, ekki verð.`},
{id:"e14", t:"ein", src:"Dæmablað 8, dæmi 3a–c",
 q:"Berðu saman niðurstöðuna í DB8 dæmi 3 með og án verðmismununar. Hvað er rétt?",
 o:["Hagnaður er hærri með verðmismunun (≈ 2.847 á móti ≈ 2.821) en heildarmagnið er það sama (≈ 53,6)","Heildarmagnið eykst verulega við verðmismunun og hagnaðurinn líka","Hagnaðurinn er sá sami en verðin ólík","Verðmismunun lækkar hagnað því Grænlendingar fá lægra verð","Verðmismunun hækkar bæði verðin upp fyrir 86,1"], a:0,
 e:`<table class="dt"><tr><th></th><th>Án mism.</th><th>Með mism.</th></tr><tr><td>Heildarmagn</td><td>53,56</td><td>53,56</td></tr><tr><td>Verð</td><td>86,06</td><td>83,39 / 93,39</td></tr><tr><td>HT</td><td>4.609,1</td><td>4.635,7</td></tr><tr><td>HK</td><td>1.788,3</td><td>1.788,3</td></tr><tr><td>Hagnaður</td><td>2.820,8</td><td>2.847,5</td></tr></table>Með línulegri eftirspurn (og báðum mörkuðum þjónað) breytist heildarmagnið ekki, aðeins skiptingin. Hagnaðurinn getur aldrei lækkað við að mega mismuna, því fyrirtækið gæti alltaf valið sama verð á báðum mörkuðum.`},
{id:"e15", t:"ein", src:"K11 · Verðmismunun",
 q:"Hvað af eftirfarandi er <b>EKKI</b> skilyrði fyrir því að verðmismunun sé möguleg?",
 o:["Jaðarkostnaður þarf að vera mismunandi milli hópanna","Fyrirtækið stendur frammi fyrir niðurhallandi eftirspurn","Hægt er að skipta viðskiptavinum í a.m.k. tvo hópa","Hóparnir geta ekki átt viðskipti sín á milli (endursala útilokuð)","Fyrirtækið hefur eitthvert markaðsvald"], a:0,
 e:"Verðmismunun er að selja <b>sömu vöru</b> á ólíku verði; hún byggir á ólíkum greiðsluvilja, ekki ólíkum kostnaði. Skilyrðin á glærunni: niðurhallandi eftirspurn (markaðsvald) og aðgreinanlegir hópar sem geta ekki endurselt sín á milli."},
{id:"e16", t:"ein", src:"K11 · Fullkomin verðaðgreining",
 q:"Hvað á við um fullkomna verðaðgreiningu (fyrsta stigs)?",
 o:["Ekkert allratap verður og fyrirtækið nær til sín öllum neytendaábatanum","Allratapið er meira en við eitt einokunarverð","Neytendaábatinn er sá sami og á samkeppnismarkaði","Selt magn er það sama og hjá einokunarfyrirtæki með eitt verð","Allir kaupendur greiða sama verð, jafnt jaðarkostnaði"], a:0,
 e:"Hver eining er seld á greiðsluvilja kaupandans, svo eftirspurnarkúrfan verður jaðartekjukúrfan. Fyrirtækið framleiðir þar til V = JK fyrir síðustu eininguna, sem er skilvirkt magn. Neytendaábatinn verður núll (ekki eins og í samkeppni) og allur ábatinn fer til fyrirtækisins."},
{id:"e17", t:"ein", src:"K11 · Þrjú stig verðmismununar",
 q:"Sundlaug selur stakan miða á 1.300 kr. en tíu miða kort á 8.000 kr. Hvers konar verðmismunun er þetta?",
 o:["Annars stigs (magnverðaðgreining)","Fyrsta stigs","Þriðja stigs","Fullkomin verðaðgreining","Þetta er ekki verðmismunun"], a:0,
 e:"Annars stigs: neytandinn fær hverja einingu ódýrar ef hann kaupir meira. Þriðja stigs væri ólíkt verð til ólíkra hópa (t.d. nemar, eldri borgarar). Fyrsta stigs er ólíkt verð fyrir hverja einingu/kaupanda eftir greiðsluvilja."},
{id:"e18", t:"ein", src:"K11 · Þrjú stig verðmismununar",
 q:"Kvikmyndahús selur nemum miða á 1.500 kr. en öðrum á 2.200 kr. Hvers konar verðmismunun er þetta?",
 o:["Þriðja stigs","Fyrsta stigs","Annars stigs","Fullkomin verðaðgreining","Engin, því kostnaður er ólíkur"], a:0,
 e:"Þriðja stigs: neytendur á aðgreindum mörkuðum (hópum) fá vöruna á ólíku verði. Nemar eru taldir hafa teygnari eftirspurn og fá því lægra verð. Gildran „annars stigs“ á við magnafslátt."},
{id:"e19", t:"ein", src:"K11 · Þrjú stig verðmismununar",
 q:"Heildsali selur bretti af vatnsflöskum ódýrar á flösku en stakar kippur, eingöngu vegna þess að það kostar minna á flösku að afgreiða og senda heilt bretti. Hvað á við?",
 o:["Þetta er ekki magnverðaðgreining, því verðmunurinn endurspeglar kostnaðarmun","Þetta er annars stigs verðmismunun","Þetta er þriðja stigs verðmismunun","Þetta er fyrsta stigs verðmismunun","Þetta skapar allratap eins og einokun"], a:0,
 e:"Glæran tekur þetta sérstaklega fram: það er <b>ekki</b> magnverðaðgreining ef ástæðan er að það kostar minna að selja einum aðila mikið. Verðmismunun er ólíkt verð fyrir sömu vöru sem ekki skýrist af kostnaði."},
{id:"e20", t:"ein", src:"K11 · Einokunarhagnaður: kostnaður samfélagsins?",
 q:"Hvaðan kemur allratapið vegna einokunar?",
 o:["Fyrirtækið framleiðir minna en samfélagslega hagkvæmt magn, svo einingar þar sem greiðsluvilji er yfir jaðarkostnaði eru ekki seldar","Flutningi á ábata frá neytendum til eigenda fyrirtækisins","Einokunarhagnaðinum sjálfum","Því að fyrirtækið framleiðir þar sem V = JK","Því að neytendaábatinn verður núll"], a:0,
 e:"Velferð markaðarins = neytendaábati + framleiðendaábati. Flutningur ábata frá neytendum til framleiðanda er því ekki samfélagslegt tap. Tapið er þríhyrningurinn milli eftirspurnar og JK frá M<sub>einokun</sub> að M<sub>samkeppni</sub>. Ef fyrirtækið eyðir fé í að viðhalda einokunarvaldi bætist sá kostnaður við tapið."},
{id:"e21", t:"ein", src:"K11 · Allratap vegna einokunar",
 q:"Glærurnar bera allratap einokunar saman við allratap skatta. Hver er munurinn?",
 o:["Ríkið fær tekjurnar af skattinum en einokunarfyrirtækið fær einokunarhagnaðinn","Skattur veldur engu allratapi","Einokun veldur engu allratapi ef fyrirtækið skilar hagnaði","Allratap einokunar er alltaf tvöfalt allratap skatts","Skattur hækkar framleitt magn en einokun lækkar það"], a:0,
 e:"Bæði reka fleyg milli greiðsluvilja kaupenda og kostnaðar seljenda, svo selt magn minnkar og allratap verður. Munurinn er hver fær rétthyrninginn: skatttekjur renna til ríkisins, einokunarhagnaðurinn til eigenda fyrirtækisins."},
{id:"e22", t:"ein", src:"K11 · Markaðsvald og teygni",
 q:"Tvö einokunarfyrirtæki hafa sama jaðarkostnað. Eftirspurn eftir vöru fyrirtækis A er mun óteygnari en eftir vöru B. Hvað á við?",
 o:["A getur sett hlutfallslega meiri álagningu ofan á jaðarkostnað en B","B getur sett meiri álagningu en A","Álagningin er sú sama því JK er sá sami","Hvorugt getur sett verð yfir JK","A framleiðir meira en B"], a:0,
 e:`<div class="f">(P − JK)/P = −1/ε</div>Því óteygnari sem eftirspurnin er (|ε| nær 1), því hærri er Lerner-vísitalan og álagningin. Glæran „Markaðsvald“ sýnir þetta: með óteygna eftirspurn liggur einokunarverðið langt fyrir ofan JK.`},
{id:"e23", t:"ein", src:"K11 · Náttúruleg einokunarfyrirtæki",
 q:"Hvað er náttúrulegt einokunarfyrirtæki?",
 o:["Fyrirtæki sem getur framleitt allt markaðsmagnið með lægri kostnaði en mörg fyrirtæki gætu","Fyrirtæki sem á náttúruauðlind","Fyrirtæki sem hefur fengið einkaleyfi frá ríkinu","Fyrirtæki sem er í ríkiseigu","Fyrirtæki sem selur vöru án staðkvæmdarvöru"], a:0,
 e:"Náttúruleg einokun stafar af stærðarhagkvæmni: MHK fer lækkandi yfir allt viðeigandi magnbil, svo eitt fyrirtæki er skilvirkara en mörg (t.d. vatnsveita). Gildrurnar eru aðrar orsakir einokunar (eign á framleiðsluþætti, einkaleyfi) eða rekstrarform."},
{id:"e24", t:"ein", src:"K11 · Hugsanleg viðbrögð við einokun",
 q:"Stjórnvöld neyða náttúrulegt einokunarfyrirtæki til að verðleggja á jaðarkostnaði (V = JK). Hvað gerist?",
 o:["Fyrirtækið tapar, því JK liggur undir MHK þegar MHK fer lækkandi","Fyrirtækið skilar áfram einokunarhagnaði","Fyrirtækið skilar nákvæmlega núll hagnaði","Allratapið eykst","Framleitt magn minnkar"], a:0,
 e:"Þegar MHK lækkar með magni er JK fyrir neðan MHK. Við V = JK er því V &lt; MHK og fyrirtækið tapar (myndin „Fyrirtækið tapar ef það framleiðir það magn sem er þjóðhagslega hagkvæmt“). Þess vegna þarf niðurgreiðslu, verð = MHK eða ríkisrekstur."},
{id:"e25", t:"ein", src:"K11 · Stjórnvaldsaðgerðir",
 q:"Glærurnar skipta algengustu aðgerðum ríkisins gegn einokun í fernt. Hvað er <b>EKKI</b> ein þeirra?",
 o:["Setja tolla á innfluttar staðkvæmdarvörur","Auka samkeppni með samkeppnislögum","Setja reglugerðir, t.d. hámarksverð","Hafa einokunarfyrirtækið í ríkiseigu","Aðhafast ekkert"], a:0,
 e:"Tollar á staðkvæmdarvörur myndu <b>styrkja</b> einokunina. Fjórar leiðirnar eru samkeppnislög (hindra samruna, skipta upp fyrirtækjum), reglugerðir, ríkisrekstur og að gera ekkert ef markaðsbresturinn er lítill."},
{id:"e26", t:"ein", src:"K11 · Vandi við stjórnvaldsaðgerðir",
 q:"Hvað af eftirfarandi er <b>EKKI</b> vandamál við að stýra einokunarfyrirtækjum samkvæmt glærunum?",
 o:["Neytendur eru sterkur og vel skipulagður þrýstihópur","Öruggar upplýsingar um kostnað eru illfáanlegar","Framleiðendur eru fáir og mynda sterkan þrýstihóp","Fyrirtækið hefur ekki hvata til að lágmarka kostnað ef ríkið lækkar verð þegar hagnaður er mikill","Neytendur eru dreifðir"], a:0,
 e:"Glæran segir hið gagnstæða: neytendur eru dreifðir og því <b>veikur</b> þrýstihópur, en framleiðendur fáir og sterkir. Hinir valkostirnir eru allir á glærunni."},
{id:"e27", t:"ein", src:"K11 · Aðgerðir stjórnvalda sem búa til einokun",
 q:"Af hverju veita stjórnvöld einkaleyfi, þótt þau skapi einokun?",
 o:["Til að ýta undir nýsköpun","Til að lækka verð til neytenda strax","Til að auka samkeppni á markaðnum","Til að draga úr allratapi","Til að afla skatttekna"], a:0,
 e:"Einkaleyfi tryggir uppfinningamanni tímabundinn einokunarhagnað, sem er hvati til nýsköpunar. Fórnarkostnaðurinn er hærra verð og allratap meðan einkaleyfið gildir."},
{id:"e28", t:"ein", src:"Aukadæmi 8, dæmi 1",
 q:"Ríkið setur verðþak á einokunarfyrirtæki. Þakið er á milli einokunarverðsins og samkeppnisverðsins (V = JK). Hver eru áhrifin?",
 o:["Selt magn eykst og allratap minnkar","Selt magn minnkar og allratap eykst","Selt magn er óbreytt en hagnaður minnkar","Skortur myndast eins og við verðþak á samkeppnismarkaði","Fyrirtækið hættir framleiðslu"], a:0,
 e:"Undir þakinu er jaðartekjukúrfan lárétt í þakverðinu (fyrirtækið getur selt meira án þess að lækka verð) þar til hún mætir eftirspurninni. Fyrirtækið framleiðir þá meira en einokunarmagnið, nær skilvirka magninu, og allratapið minnkar. Gildran er að yfirfæra niðurstöðuna um verðþak á samkeppnismarkaði."},
{id:"e29", t:"ein", src:"Aukadæmi 7, dæmi 1a",
 q:"Einokunarfyrirtæki: P = 160 − Q og MC = 10. Settur er 12 kr. einingaskattur á framleiðandann. Hvert verður verðið eftir skatt?",
 o:["91","97","85","79","22"], a:0,
 e:`<div class="f">Fyrir skatt: 160 − 2Q = 10 ⇒ Q = 75, P = 85<br>Eftir skatt: JK = 10 + 12 = 22<br>160 − 2Q = 22 ⇒ Q = 69<br>P = 160 − 69 = 91</div>Verðið hækkar um 6 kr., helming skattsins. Gildran 97 bætir öllum skattinum við verðið. 22 er nýr jaðarkostnaður.`},
{id:"e30", t:"ein", src:"Aukadæmi 7, dæmi 1b–c",
 q:"P = 160 − Q, MC = 10 og 12 kr. einingaskattur (Q fer úr 75 í 69). Um hve mikið eykst allratapið vegna skattsins?",
 o:["468","828","3.280,5","2.812,5","936"], a:0,
 e:`Allratap miðast við samkeppnismagnið Q = 150 (P = JK = 10).<div class="f">Fyrir: ½ × (150 − 75) × (85 − 10) = 2.812,5<br>Eftir: ½ × (150 − 69) × (91 − 10) = 3.280,5<br>Aukning = 3.280,5 − 2.812,5 = 468</div>Sama fæst sem lækkun heildarábata: NÁ + FÁ + skatttekjur fara úr 8.437,5 í 7.969,5. Gildrur: 828 = skatttekjurnar (12 × 69); 3.280,5 er heildartapið eftir skatt; 936 gleymir helmingnum.`},
{id:"e31", t:"ein", src:"Aukadæmi 7, dæmi 1d",
 q:"P = 160 − Q, MC = 10 og 12 kr. einingaskattur: verðið fer úr 85 í 91. Hve stór hluti skattsins lendir á neytendum?",
 o:["50%, þ.e. 6 kr. á einingu (samtals 414)","100%, þ.e. 12 kr. á einingu","0%, einokunarfyrirtækið ber allan skattinn","25%, þ.e. 3 kr. á einingu","75%, þ.e. 9 kr. á einingu"], a:0,
 e:`<div class="f">Verðhækkun = 91 − 85 = 6<br>Hlutur neytenda = 6 / 12 = 50%<br>Skattbyrði neytenda = 6 × 69 = 414</div>Með línulegri eftirspurn og föstum JK hækkar einokunarverðið alltaf um helming skattsins (halli JT er tvöfaldur halli eftirspurnar). Gildran 100% á við ef fyrirtækið gæti velt öllu áfram.`},
{id:"e32", t:"ein", src:"Dæmablað 7, dæmi 4a",
 q:`Bókaútgefandi: höfundur fær $2 m. og jaðarkostnaður er $10 á bók.<table class="dt"><tr><th>Verð ($)</th><th>Magn</th></tr><tr><td>70</td><td>300.000</td></tr><tr><td>60</td><td>400.000</td></tr><tr><td>50</td><td>500.000</td></tr><tr><td>40</td><td>600.000</td></tr></table>Hver er hámarkshagnaður útgefandans?`,
 o:["$18 m.","$25 m.","$20 m.","$16 m.","$22 m."], a:0,
 e:`<table class="dt"><tr><th>Q</th><th>HT</th><th>HK = 2 m + 10Q</th><th>Hagnaður</th></tr><tr><td>300.000</td><td>21 m</td><td>5 m</td><td>16 m</td></tr><tr><td>400.000</td><td>24 m</td><td>6 m</td><td>18 m</td></tr><tr><td>500.000</td><td>25 m</td><td>7 m</td><td>18 m</td></tr><tr><td>600.000</td><td>24 m</td><td>8 m</td><td>16 m</td></tr></table>Hagnaður er $18 m. við 400 þús. (P = 60) og 500 þús. (P = 50). Gildrur: 25 m eru hámarkstekjur; 20 og 22 m gleyma $2 m. greiðslunni til höfundar.`},
{id:"e33", t:"ein", src:"Dæmablað 7, dæmi 4b",
 q:"Í bókadæminu (DB7 #4) fer magnið úr 300.000 í 400.000 þegar verð lækkar úr $70 í $60. Hverjar eru jaðartekjurnar á bók á þessu bili?",
 o:["$30","$60","$3.000.000","$70","$10"], a:0,
 e:`<div class="f">ΔHT = 60 × 400.000 − 70 × 300.000 = 24 m − 21 m = 3 m<br>JT = 3.000.000 / 100.000 = $30 á bók</div>JT ($30) er helmingur verðsins ($60): verðlækkunin á fyrstu 300 þúsund bókunum étur upp hluta af tekjunum af nýju bókunum. Gildra: $3 m. er breytingin í HT, ekki á bók.`},
{id:"e34", t:"ein", src:"Dæmablað 7, dæmi 4e",
 q:"Í bókadæminu (DB7 #4) fær höfundurinn $3 m. í stað $2 m. Hvað verður um verð bókarinnar?",
 o:["Ekkert, greiðslan til höfundar er fastur kostnaður sem breytir ekki JK","Verðið hækkar um $10","Verðið hækkar þar til hagnaður nær aftur $18 m.","Verðið lækkar til að auka sölu","Útgefandinn hættir við útgáfuna"], a:0,
 e:"Greiðsla til höfundar breytist ekki með fjölda seldra bóka, svo JK og JT haldast óbreytt og þar með magn og verð. Aðeins hagnaðurinn lækkar um $1 m. (í $17 m.). Sama rökfræði og í DB8 #1c."},
{id:"e35", t:"ein", src:"Dæmablað 7, dæmi 4f",
 q:"Ef útgefandinn í bókadæminu (DB7 #4) hámarkaði skilvirkni í stað hagnaðar, hvaða verð myndi hann setja og hver yrði hagnaðurinn?",
 o:["P = $10 og hagnaður −$2 m.","P = $10 og hagnaður $0","P = $55 og hagnaður $18 m.","P = $0 og hagnaður −$2 m.","P = $50 og hagnaður $18 m."], a:0,
 e:`<div class="f">Skilvirkt: P = JK = 10 ⇒ Q = 900.000<br>HT = 10 × 900.000 = 9 m<br>HK = 2 m + 10 × 900.000 = 11 m<br>Hagnaður = 9 m − 11 m = −2 m</div>Við P = JK greiðast aðeins breytilegu kostnaðirnir, svo fastur kostnaður (höfundarlaunin) tapast. Gildran „hagnaður 0“ gleymir fasta kostnaðinum.`},
{id:"e36", t:"ein", src:"K11 · Samantekt",
 q:"Hvaða fullyrðing um einokunarfyrirtæki er <b>RÖNG</b>?",
 o:["Það getur sett hvaða verð sem er og samt selt hvaða magn sem það vill","Það hámarkar hagnað þar sem jaðartekjur eru jafnar jaðarkostnaði","Verð þess er hærra en jaðarkostnaður","Það framleiðir minna en það magn sem hámarkar samanlagðan ábata","Það getur tapað ef MHK er yfir eftirspurnarkúrfunni við öll magn"], a:0,
 e:"Einokunarfyrirtæki ræður verðinu <b>eða</b> magninu, ekki hvoru tveggja: það er bundið af eftirspurnarkúrfunni. Hærra verð þýðir minni sölu. Hinar fullyrðingarnar eru úr samantektinni (atriði 6–9)."},
{id:"e37", t:"ein", src:"K11 · Markaðsvald · Lerner",
 q:"Einokunarfyrirtæki með jákvæðan jaðarkostnað hámarkar hagnað. Á hvaða hluta eftirspurnarkúrfunnar framleiðir það alltaf?",
 o:["Teygna hlutanum (|ε| > 1), þar sem jaðartekjur eru jákvæðar","Óteygna hlutanum (|ε| < 1)","Þar sem teygnin er nákvæmlega −1","Þar sem eftirspurn er fullkomlega óteygin","Það fer eftir fasta kostnaðinum"], a:0,
 e:`<div class="f">JT = JK &gt; 0 ⇒ JT &gt; 0 ⇒ |ε| &gt; 1</div>Á óteygna hlutanum eru jaðartekjur neikvæðar: fyrirtækið gæti dregið úr framleiðslu, hækkað heildartekjur og lækkað kostnað í senn. Teygnin −1 er þar sem JT = 0 (tekjuhámörkun).`},
// ======================= EINOKUNARSAMKEPPNI (K12) =======================
{id:"m01", t:"eis", src:"K12 · Einkenni einokunarsamkeppni",
 q:"Hvað af eftirfarandi er <b>EKKI</b> einkenni einokunarsamkeppni?",
 o:["Umtalsverðar aðgangshindranir","Mörg fyrirtæki keppa um sömu viðskiptavinina","Hvert fyrirtæki selur vöru sem er aðeins frábrugðin vöru hinna","Hvert fyrirtæki stendur frammi fyrir niðurhallandi eftirspurn","Fyrirtæki geta komið inn á markaðinn og farið af honum án takmarkana"], a:0,
 e:"Einkennin þrjú eru mörg fyrirtæki, aðgreinanlegar vörur og <b>litlar</b> aðgangshömlur. Umtalsverðar aðgangshindranir einkenna fákeppni og einokun. Aðgreiningin gefur niðurhallandi eftirspurn."},
{id:"m02", t:"eis", src:"K12 · Fjórar tegundir markaða",
 q:"Samkvæmt grófflokkuninni á glærunum: hvaða markaður er dæmi um einokunarsamkeppni?",
 o:["Veitingastaðir í Reykjavík","Olíumarkaðurinn á Íslandi","Vatnsveita","Gjaldeyrismarkaður","Flugvélaframleiðsla (Airbus, Boeing)"], a:0,
 e:"Glæran: einokun = vatnsveita; fákeppni = bílaframleiðendur, olíumarkaðurinn á Íslandi, flugvélar; einokunarsamkeppni = veitingastaðir í Reykjavík, bækur, snyrtivörur; fullkomin samkeppni = gjaldeyris- og hrávörumarkaðir."},
{id:"m03", t:"eis", src:"Aukadæmi 8, dæmi 2",
 q:"Hvaða pörun markaðar og markaðsforms er réttust?",
 o:["Rafmagnsleiðsla til heimila: einokun · Varalitur: einokunarsamkeppni","Rafmagnsleiðsla til heimila: fullkomin samkeppni · Varalitur: einokun","Rafmagnsleiðsla til heimila: einokunarsamkeppni · Varalitur: fullkomin samkeppni","Rafmagnsleiðsla til heimila: einokunarsamkeppni · Varalitur: einokun","Rafmagnsleiðsla til heimila: fákeppni · Varalitur: fullkomin samkeppni"], a:0,
 e:"Rafmagnsleiðsla er klassísk náttúruleg einokun: eitt net er ódýrara en mörg. Varalitur er aðgreind vara frá mörgum framleiðendum með vörumerki og auglýsingar, þ.e. einokunarsamkeppni. Sama á við um sódavatn og jarðarberjasultu."},
{id:"m04", t:"eis", src:"K12 · Einokunarsamkeppni til skamms tíma",
 q:"Fyrirtæki á markaði með einokunarsamkeppni skila hagfræðilegum hagnaði til skamms tíma. Hvað gerist í kjölfarið?",
 o:["Ný fyrirtæki koma inn og eftirspurnarkúrfa hvers starfandi fyrirtækis hliðrast til vinstri","Fyrirtæki hætta og eftirspurnarkúrfan hliðrast til hægri","Starfandi fyrirtæki hækka verðið til að verja hagnaðinn","Ekkert, aðgangshindranir verja hagnaðinn","Jaðarkostnaður allra fyrirtækja hækkar"], a:0,
 e:"Hagnaður laðar að ný fyrirtæki (litlar aðgangshömlur). Vöruúrval eykst og hvert starfandi fyrirtæki missir hluta viðskiptavina sinna: eftirspurn og JT hliðrast til vinstri þar til hagnaðurinn er horfinn."},
{id:"m05", t:"eis", src:"K12 · Einokunarsamkeppni til skamms tíma",
 q:"Fyrirtæki á markaði með einokunarsamkeppni tapa til skamms tíma. Hvað gerist?",
 o:["Fyrirtæki hætta, eftirspurn eftir vöru þeirra sem eftir eru hliðrast til hægri og tapið minnkar","Ný fyrirtæki koma inn og tapið eykst","Fyrirtækin lækka verð niður í jaðarkostnað","Ríkið verður að niðurgreiða framleiðsluna","Eftirspurnarkúrfan verður lárétt"], a:0,
 e:"Tap hvetur fyrirtæki til að yfirgefa markaðinn. Þeir viðskiptavinir dreifast á fyrirtækin sem eftir eru, svo eftirspurn þeirra hliðrast til hægri þar til hagnaður er orðinn núll."},
{id:"m06", t:"eis", src:"K12 · Langtímajafnvægi",
 q:"Hvaða tvö skilyrði lýsa langtímajafnvægi fyrirtækis í einokunarsamkeppni?",
 o:["V = MHK (núll hagnaður) og V > JK","V = JK og V = MHK","V > MHK og V > JK","V = JK og JT = MHK","V = lágmark MHK og JT = JK"], a:0,
 e:"Líkt og í einokun er V &gt; JK (niðurhallandi eftirspurn ⇒ JT &lt; V og JT = JK). Líkt og í samkeppni er V = MHK, því frjáls innkoma keyrir hagnaðinn í núll. Myndrænt snertir eftirspurnarkúrfan MHK-kúrfuna. Gildran „V = JK og V = MHK“ er langtímajafnvægi fullkominnar samkeppni."},
{id:"m07", t:"eis", src:"K12 · Umframgeta",
 q:"Hvað er átt við með <b>umframgetu</b> í einokunarsamkeppni?",
 o:["Hvert fyrirtæki framleiðir minna magn en það sem lágmarkar MHK","Fyrirtækin framleiða meira en eftirspurnin","Fyrirtækin eiga birgðir sem seljast ekki","Fyrirtækin framleiða þar sem MHK er í lágmarki","Of fá fyrirtæki eru á markaðnum"], a:0,
 e:"Snertipunkturinn milli niðurhallandi eftirspurnar og MHK er á niðurhallandi hluta MHK, vinstra megin við lágmarkið (stærðarhagkvæmnina). Í fullkominni samkeppni framleiðir fyrirtækið hins vegar í lágmarki MHK til langs tíma."},
{id:"m08", t:"eis", src:"K12 · Einokunarsamkeppni vs. fullkomin samkeppni",
 q:"Hvaða tvö atriði greina langtímajafnvægi einokunarsamkeppni frá fullkominni samkeppni samkvæmt glærunum?",
 o:["Umframgeta og álagning yfir jaðarkostnaði","Hagnaður og aðgangshindranir","Fjöldi fyrirtækja og hagnaður","Auglýsingar og ríkisafskipti","Jaðarkostnaður og fastur kostnaður"], a:0,
 e:"Glæran nefnir tvö atriði: (1) umframgetu og (2) álagningu yfir JK. Í báðum markaðsformum er hagnaður núll til langs tíma og mörg fyrirtæki, svo hagnaður og fjöldi greina þau ekki að."},
{id:"m09", t:"eis", src:"Aukadæmi 8, dæmi 3",
 q:"Fyrirtæki í einokunarsamkeppni gæti aukið framleiðslu og lækkað meðalheildarkostnað. Af hverju gerir það það ekki?",
 o:["Til að selja meira þarf það að lækka verðið; jaðartekjurnar af viðbótareiningum eru lægri en jaðarkostnaðurinn, svo hagnaðurinn myndi minnka","Því aðgangshindranir banna það","Því ríkið setur kvóta á framleiðsluna","Því jaðarkostnaður er hærri en verðið","Því það framleiðir nú þegar í lágmarki MHK"], a:0,
 e:"Hagnaður ræðst af JT og JK, ekki MHK. Við hagnaðarhámarksmagnið er JT = JK; hvert viðbótarmagn hefur JT &lt; JK. Lægri MHK skiptir ekki máli ef verðið lækkar meira en kostnaðurinn."},
{id:"m10", t:"eis", src:"Dæmablað 8, dæmi 4b",
 q:"Tropicana er eitt margra fyrirtækja sem framleiða appelsínusafa og markaðurinn er í langtímajafnvægi. Hver er hagfræðilegur hagnaður Tropicana?",
 o:["Núll, því eftirspurnin snertir MHK-kúrfuna við hagnaðarhámarksmagnið","Jákvæður, því verðið er yfir jaðarkostnaði","Neikvæður, því fyrirtækið framleiðir ekki í lágmarki MHK","Jákvæður, því vörumerkið skapar aðgangshindrun","Jafn álagningunni sinnum magninu"], a:0,
 e:"Frjáls innkoma og útganga keyra hagnaðinn í núll: V = MHK. Gildrurnar rugla saman V &gt; JK (sem er satt) og V &gt; MHK (sem væri hagnaður). Álagning × magn er ekki hagnaður, því fastur kostnaður dregst líka frá."},
{id:"m11", t:"eis", src:"Dæmablað 8, dæmi 4d",
 q:"Ef stjórnvöld neyddu Tropicana (langtímajafnvægi í einokunarsamkeppni) til að framleiða skilvirkt magn (þar sem V = JK), hvað myndi gerast?",
 o:["Verðið færi undir MHK, fyrirtækið tapaði og myndi til lengri tíma hætta","Fyrirtækið skilaði hagnaði","Ekkert myndi breytast","Allratap myndi aukast","Fyrirtækið myndi lækka jaðarkostnað sinn"], a:0,
 e:"Í langtímajafnvægi er V = MHK. Til að selja meira þarf verðið að lækka niður í JK, sem liggur undir MHK á þessu bili. Þá er V &lt; MHK og fyrirtækið tapar. Þess vegna er erfitt fyrir stjórnvöld að sporna við óskilvirkni í einokunarsamkeppni."},
{id:"m12", t:"eis", src:"K12 · Einokunarsamkeppni og velferð",
 q:"Hvaða fullyrðing um einokunarsamkeppni og velferð er rétt samkvæmt glærunum?",
 o:["Allratap verður vegna álagningar yfir jaðarkostnaði, en erfitt er fyrir stjórnvöld að sporna við því","Ekkert allratap verður því hagnaðurinn er núll","Allratapið er það sama og í einokun","Stjórnvöld leysa vandann auðveldlega með hámarksverði","Einokunarsamkeppni hefur alla æskilegu eiginleika fullkominnar samkeppni"], a:0,
 e:"Núll hagnaður þýðir ekki skilvirkni: verðið er yfir JK svo sumar einingar sem neytendur meta umfram kostnað eru ekki framleiddar. Samantektin segir að einokunarsamkeppni hafi ekki alla æskilega eiginleika samkeppni og að hámarksverð myndi leiða til taps."},
{id:"m13", t:"eis", src:"K12 · Hvatinn til að auglýsa",
 q:"Hvaða fyrirtæki má búast við að eyði <b>minnstu</b> í auglýsingar?",
 o:["Framleiðandi hveitis, sem er einsleit vara","Snyrtivöruframleiðandi","Veitingastaður","Bókaútgefandi","Gosdrykkjaframleiðandi"], a:0,
 e:"Fyrirtæki sem selja aðgreinanlega vöru yfir JK hafa hvata til að auglýsa: hver viðbótarsala skilar álagningu. Fyrirtæki sem selja einsleita vöru á V = JK græða ekkert á viðbótarsölu og eyða mjög litlu í auglýsingar."},
{id:"m14", t:"eis", src:"K12 · Kostir og gallar auglýsinga",
 q:"Hvaða rök eru úr hópi <b>gagnrýnenda</b> auglýsinga?",
 o:["Auglýsingar stýra smekk fólks og draga úr samkeppni með því að gefa í skyn að vörur séu einstakari en þær eru","Auglýsingar miðla upplýsingum til neytenda","Auglýsingar auka samkeppni með því að ýta undir vöruúrval og fjölbreyttara verð","Vilji til að eyða miklu í auglýsingar er merki um gæði","Auglýsingar auðvelda nýjum fyrirtækjum að ná athygli"], a:0,
 e:"Gagnrýnendur: stýra smekk, draga úr samkeppni (gerviaðgreining ⇒ óteygnari eftirspurn ⇒ hærri álagning). Verjendur: miðla upplýsingum, auka samkeppni og vöruúrval. Auglýsingar sem gæðastimpill eru líka rök verjenda."},
{id:"m15", t:"eis", src:"K12 · Auglýsingar sem gæðastimpill",
 q:"Hvernig getur dýr auglýsingaherferð sem segir neytendum nánast ekkert um vöruna samt gagnast þeim?",
 o:["Viljinn til að eyða miklu er merki um að fyrirtækið trúi á gæði vörunnar og búist við endurteknum kaupum","Hún lækkar jaðarkostnað fyrirtækisins","Hún gerir eftirspurnina teygnari og lækkar verðið","Hún tryggir að fyrirtækið skili núll hagnaði","Hún gagnast ekki neytendum á neinn hátt"], a:0,
 e:"Auglýsingin virkar sem merki (signal): aðeins fyrirtæki með góða vöru, sem býst við að neytendur kaupi aftur, hefur efni á að eyða miklu í að fá þá til að prófa. Innihald auglýsingarinnar skiptir minna máli en kostnaðurinn við hana."},
{id:"m16", t:"eis", src:"K12 · Vörumerki",
 q:"Hvaða rök styðja vörumerki samkvæmt glærunum?",
 o:["Þau veita upplýsingar um gæði og gefa fyrirtækjum hvata til að viðhalda háum gæðum","Þau valda því að neytendur skynja mun sem er ekki til staðar","Þau hækka verð án þess að gæði breytist","Þau koma í veg fyrir að ný fyrirtæki komi inn á markaðinn","Þau lækka jaðarkostnað"], a:0,
 e:"Verjendur: vörumerki gefa til kynna gæði og fyrirtækið hefur hvata til að halda gæðunum uppi, því orðsporið er í húfi. Gagnrýnendur: vörumerki skapa skynjaðan mun sem er ekki raunverulegur (t.d. merkjalyf vs. samheitalyf)."},
{id:"m17", t:"eis", src:"Aukadæmi 8, dæmi 4a–b",
 q:"Verkjalyfjaframleiðandi A auglýsir mikið og á trygga viðskiptavini. B auglýsir ekki og viðskiptavinir þess kaupa alltaf ódýrasta lyfið. JK er fastur og sá sami hjá báðum. Hvað á við?",
 o:["Eftirspurn A er óteygnari, svo A hefur meiri álagningu yfir JK en B","Eftirspurn B er óteygnari, svo B hefur meiri álagningu","Álagningin er sú sama því JK er sá sami","A selur á jaðarkostnaði","B hefur meiri álagningu því það sparar sér auglýsingakostnað"], a:0,
 e:"Tryggir viðskiptavinir bregðast lítið við verðhækkun ⇒ óteygin eftirspurn ⇒ hærri Lerner-vísitala. Viðskiptavinir B skipta um leið og annað er ódýrara ⇒ næstum lárétt eftirspurn ⇒ verð nálægt JK. Auglýsingakostnaður er fastur kostnaður og breytir ekki álagningunni."},
{id:"m18", t:"eis", src:"Aukadæmi 8, dæmi 4c",
 q:"Hvort verkjalyfjafyrirtækið í AD8 #4 (A með vörumerki og trygga viðskiptavini, B selur ódýrast) hefur meiri hvata til að huga að gæðum vöru sinnar?",
 o:["A, því orðspor vörumerkisins og endurtekin kaup eru í húfi","B, því viðskiptavinir þess eru verðnæmir","Hvorugt, því JK er sá sami","Bæði jafnt","B, því það eyðir ekki fé í auglýsingar"], a:0,
 e:"Þetta eru rök glærunnar um vörumerki: fyrirtæki með vörumerki tapar miklu ef gæðin bregðast, því tryggir viðskiptavinir hverfa og fjárfestingin í auglýsingum fer forgörðum. Viðskiptavinir B velja hvort eð er eftir verði."},
{id:"m19", t:"eis", src:"K12 · Samanburður á markaðsgerðum",
 q:"Hvað er <b>eins</b> í langtímajafnvægi einokunarsamkeppni og fullkominnar samkeppni?",
 o:["Hagfræðilegur hagnaður er núll","Verð er jafnt jaðarkostnaði","Fyrirtæki framleiða í lágmarki MHK","Eftirspurn hvers fyrirtækis er lárétt","Vörurnar eru einsleitar"], a:0,
 e:"Í báðum tilvikum keyrir frjáls innkoma hagnaðinn í núll. Allt hitt á aðeins við fullkomna samkeppni: V = JK, framleiðsla í lágmarki MHK, lárétt eftirspurn, einsleitar vörur."},
{id:"m20", t:"eis", src:"K12 · Fyrirtæki reyna að halda í hagnað",
 q:"Glærurnar nefna leiðir sem fyrirtæki í einokunarsamkeppni nota til að halda í hagnað. Hvað er <b>EKKI</b> ein þeirra?",
 o:["Selja á jaðarkostnaði","Skapa sér sérstöðu með ímynd, t.d. með auglýsingum","Hafa lægstan kostnað","Búa til aðgangshindranir","Byggja upp vörumerki"], a:0,
 e:"Að selja á JK skilar engri álagningu og eyðir hagnaðinum. Hinar leiðirnar (sérstaða, lágur kostnaður, aðgangshindranir, vörumerki) eru allar á glærunni eða í beinu framhaldi af henni."},
{id:"m21", t:"eis", src:"K12 · Einkenni einokunarsamkeppni",
 q:"Hvernig lítur eftirspurnarkúrfa eins fyrirtækis í einokunarsamkeppni út?",
 o:["Hún hallar niður, því varan er aðgreind, en er teygin því nánar staðkvæmdarvörur eru til","Hún er lárétt, því fyrirtækin eru mörg","Hún er lóðrétt, því viðskiptavinir eru tryggir","Hún er sú sama og eftirspurn alls markaðarins","Hún hallar upp á við"], a:0,
 e:"Aðgreiningin gefur fyrirtækinu svolítið markaðsvald (niðurhallandi kúrfa), en margar nánar staðkvæmdarvörur gera hana tiltölulega teygna. Gildran „lárétt“ á við fullkomna samkeppni; „sama og markaðarins“ við einokun."},
{id:"m22", t:"eis", src:"K12 · Langtímajafnvægi · mynd",
 q:"Á mynd af langtímajafnvægi í einokunarsamkeppni: hvar snertir eftirspurnarkúrfan MHK-kúrfuna?",
 o:["Við hagnaðarhámarksmagnið, þar sem JT = JK, á niðurhallandi hluta MHK","Í lágmarki MHK","Þar sem JT = 0","Þar sem JK sker eftirspurnina","Hún snertir aldrei MHK"], a:0,
 e:"Við magnið þar sem JT = JK er V = MHK (snertipunktur), svo hagnaðurinn er núll. Þar sem eftirspurnin hallar niður getur hún aðeins snert MHK þar sem MHK hallar líka niður, þ.e. vinstra megin við lágmarkið. Það er umframgetan."},
// ======================= FÁKEPPNI OG LEIKJAFRÆÐI (K13) =======================
{id:"f01", t:"fak", src:"K13 · Einkenni fákeppni",
 q:"Hvað af eftirfarandi lýsir fákeppni best?",
 o:["Fá fyrirtæki, einsleitar eða misleitar vörur og umtalsverðar aðgangshindranir","Mörg fyrirtæki, aðgreinanlegar vörur og litlar aðgangshindranir","Eitt fyrirtæki og engar staðkvæmdarvörur","Mörg fyrirtæki, einsleitar vörur og engar aðgangshindranir","Fá fyrirtæki sem eru öll verðþegar"], a:0,
 e:"Glæran „Einkenni fákeppni“: fá fyrirtæki, vörur geta verið einsleitar (bensín) eða misleitar (bílar), umtalsverðar aðgangshindranir og talsverð stærðarhagkvæmni. Dæmi: olíufélögin hér á landi."},
{id:"f02", t:"fak", src:"K13 · Fákeppni",
 q:"Hvað er lykilatriði við greiningu á fákeppnismarkaði samkvæmt glærunum?",
 o:["Togstreitan milli samvinnu og eiginhagsmuna","Að fyrirtækin séu verðþegar","Að aðgangur að markaðnum sé frjáls","Að hvert fyrirtæki hunsi hegðun hinna","Að verð sé alltaf jafnt jaðarkostnaði"], a:0,
 e:"Fyrirtækin græða mest saman ef þau vinna saman (haga sér eins og einokari), en hvert og eitt hefur hvata til að framleiða meira á kostnað hinna. Þess vegna skiptir hegðun keppinautanna máli og leikjafræði er notuð."},
{id:"f03", t:"fak", src:"K13 · Verðsamráð (cartel)",
 q:"Af hverju er verðsamráð yfirleitt óstöðugt?",
 o:["Hver þátttakandi hefur hvata til að svindla með því að framleiða meira en umsamið er","Því samráðið lækkar hagnað þátttakenda","Því verð í samráði er undir jaðarkostnaði","Því neytendur sniðganga fyrirtækin","Því samráð er löglegt og öllum frjálst að taka þátt"], a:0,
 e:"Við samráðsverðið er V &gt; JK, svo hvert fyrirtæki græðir á að selja aðeins meira, en það lækkar verðið fyrir alla. Glæran nefnir líka að markaðsvald þurfi að ríkja, annars selja aðilar utan hópsins mikið magn. Verðsamráð er auk þess ólöglegt í flestum vestrænum ríkjum."},
{id:"f04", t:"fak", src:"K13 · Tvíkeppni: pizzur í litlum bæ",
 q:`Eftirspurn eftir pizzum er P = 120 − Q og JK = 0. Tveir pizzastaðir velja magn. Hvert er heildarmagn og verð í Nash-jafnvægi samkvæmt glærunum?`,
 o:["80 pizzur á P = 40","60 pizzur á P = 60","120 pizzur á P = 0","70 pizzur á P = 50","40 pizzur á P = 80"], a:0,
 e:`<table class="dt"><tr><th></th><th>Magn</th><th>Verð</th></tr><tr><td>Einokun / samráð</td><td>60</td><td>60</td></tr><tr><td>Tvíkeppni (Nash)</td><td>80</td><td>40</td></tr><tr><td>Fullkomin samkeppni</td><td>120</td><td>0</td></tr></table>Hvor staður framleiðir 40 og fær 40 × 40 = 1.600. Tvíkeppnin lendir á milli einokunar og samkeppni. Gildrur: 60 er samráðsniðurstaðan; 70 er þegar annar svindlar á samráðinu.`},
{id:"f05", t:"fak", src:"K13 · Tvíkeppni: leikjafræðiframsetning",
 q:"Pizzastaðirnir (P = 120 − Q, JK = 0) hafa samráð um að framleiða 30 hvor. Pizzastaður 1 svíkur og framleiðir 40 en staður 2 heldur sig við 30. Hver er hagnaður staðar 1?",
 o:["2.000","1.800","1.600","1.500","3.500"], a:0,
 e:`<div class="f">Heildarmagn = 40 + 30 = 70 ⇒ P = 120 − 70 = 50<br>Staður 1: 40 × 50 = 2.000<br>Staður 2: 30 × 50 = 1.500</div>Svikin hækka hagnað staðar 1 úr 1.800 í 2.000. Þess vegna er (40, 40) jafnvægið, þótt (30, 30) sé betra fyrir báða. Gildrur: 1.800 er hagnaðurinn í samráði, 1.500 er hagnaður staðarins sem var svikinn, 3.500 eru heildartekjurnar.`},
{id:"f06", t:"fak", src:"K13 · Tvíkeppni",
 q:"Hvernig ber tvíkeppni (án samráðs) saman við einokun og fullkomna samkeppni?",
 o:["Magn og heildarhagnaður lenda á milli einokunar og samkeppni; verðið er lægra en í einokun en hærra en í samkeppni","Magnið er minna en í einokun","Verðið er það sama og í fullkominni samkeppni","Heildarhagnaðurinn er hærri en í einokun","Niðurstaðan er sú sama og í einokun"], a:0,
 e:"Glæran: þegar fyrirtæki í tvíkeppni velja magn til að hámarka eigin hagnað framleiða þau meira en einokari en minna en í samkeppni. Verð og heildarhagnaður lenda því líka á milli."},
{id:"f07", t:"fak", src:"K13 · Fjöldi fyrirtækja á fákeppnismarkaði",
 q:"Hvað gerist eftir því sem fyrirtækjum á fákeppnismarkaði fjölgar?",
 o:["Verðáhrifin dreifast á fleiri fyrirtæki og jafnvægisverðið stefnir á jaðarkostnað","Verðið stefnir á einokunarverðið","Hagnaður hvers fyrirtækis eykst","Samráð verður auðveldara","Heildarmagnið minnkar"], a:0,
 e:"Hvert fyrirtæki metur magnáhrif og verðáhrif eins og einokari, en verðáhrifin (lægra verð) bitna líka á hinum. Því fleiri sem fyrirtækin eru, því minni hluta verðáhrifanna ber hvert þeirra, og útkoman nálgast fullkomna samkeppni (V → JK)."},
{id:"f08", t:"fak", src:"K13 · Leikjafræði",
 q:"Hvað er <b>ríkjandi leikáætlun</b>?",
 o:["Leikáætlun sem er alltaf betri en allar aðrar, sama hvað andstæðingarnir gera","Leikáætlun sem gefur hæstu mögulegu útborgun í leiknum","Leikáætlun sem báðir leikmenn velja","Leikáætlun sem er best ef andstæðingurinn vinnur með þér","Leikáætlun sem er alltaf verri en einhver önnur"], a:0,
 e:"Skilgreiningin á glærunni. Gildrurnar: hæsta útborgunin í töflunni er ekki endilega ríkjandi; „alltaf verri en einhver önnur“ er skilgreining á <b>víkjandi</b> leikáætlun."},
{id:"f09", t:"fak", src:"K13 · Nash-jafnvægi",
 q:"Hvað er Nash-jafnvægi?",
 o:["Staða þar sem hver þátttakandi hefur valið þá leikáætlun sem er honum best í ljósi þess hvað hinir völdu","Staða sem hámarkar samanlagða útborgun leikmanna","Staða þar sem allir hafa ríkjandi leikáætlun","Staða sem enginn leikmaður vill vera í","Staða þar sem leikmenn hafa samráð"], a:0,
 e:"Í Nash-jafnvægi getur enginn bætt sig með því að breyta einn um leikáætlun. Það þarf ekki að vera hagkvæmasta útkoman (valkreppa fangans) og leikmenn þurfa ekki að hafa ríkjandi leikáætlun."},
{id:"f10", t:"fak", src:"K13 · Valkreppa fangans",
 q:`Bói og Biggi eru handteknir.<table class="dt"><tr><th></th><th>Biggi játar</th><th>Biggi þegir</th></tr><tr><td>Bói játar</td><td>8 ár / 8 ár</td><td>0 / 20 ár</td></tr><tr><td>Bói þegir</td><td>20 ár / 0</td><td>1 ár / 1 ár</td></tr></table>(Fyrst Bói, svo Biggi.) Hver er útkoman í Nash-jafnvægi?`,
 o:["Báðir játa og fá 8 ár","Báðir þegja og fá 1 ár","Bói játar og sleppur, Biggi fær 20 ár","Biggi játar og sleppur, Bói fær 20 ár","Ekkert jafnvægi er til"], a:0,
 e:`Að játa er ríkjandi fyrir báða:<div class="f">Ef hinn játar: játa 8 ár &lt; þegja 20 ár<br>Ef hinn þegir: játa 0 ár &lt; þegja 1 ár</div>Báðir játa og fá 8 ár, þótt báðir væru betur settir ef þeir þegðu (1 ár). Það er kjarni valkreppunnar: eiginhagsmunir leiða til verri niðurstöðu fyrir hópinn.`},
{id:"f11", t:"fak", src:"K13 · Vandamál fangans: auglýsingar",
 q:`Hekla og Toyota ákveða hvort þau auglýsa. Hagnaður (Hekla, Toyota):<table class="dt"><tr><th></th><th>Toyota auglýsir</th><th>Toyota auglýsir ekki</th></tr><tr><td>Hekla auglýsir</td><td>80, 80</td><td>120, 45</td></tr><tr><td>Hekla auglýsir ekki</td><td>45, 120</td><td>100, 100</td></tr></table>Hvað er rétt?`,
 o:["Bæði auglýsa og fá 80 hvort, þótt bæði fengju 100 ef hvorugt auglýsti","Hvorugt auglýsir og bæði fá 100","Hekla auglýsir en Toyota ekki","Engin ríkjandi leikáætlun er til","Bæði auglýsa og fá 120 hvort"], a:0,
 e:`Að auglýsa er ríkjandi:<div class="f">Ef hinn auglýsir: 80 &gt; 45<br>Ef hinn auglýsir ekki: 120 &gt; 100</div>Nash-jafnvægið (80, 80) er verra fyrir bæði en (100, 100). Þetta skýrir AD9 #1: auglýsingabann getur <b>hækkað</b> hagnað fyrirtækjanna.`},
{id:"f12", t:"fak", src:"K13 · Vandamál fangans: olíuframleiðsla",
 q:`Írak og Íran velja að framleiða mikið eða lítið. Hagnaður (Írak, Íran):<table class="dt"><tr><th></th><th>Íran mikið</th><th>Íran lítið</th></tr><tr><td>Írak mikið</td><td>40, 40</td><td>60, 30</td></tr><tr><td>Írak lítið</td><td>30, 60</td><td>50, 50</td></tr></table>Hver er hagnaður hvors lands í Nash-jafnvægi?`,
 o:["40","50","60","30","45"], a:0,
 e:`Að framleiða mikið er ríkjandi:<div class="f">Ef hitt framleiðir mikið: 40 &gt; 30<br>Ef hitt framleiðir lítið: 60 &gt; 50</div>Jafnvægið er (mikið, mikið) með 40 hvort. Samráð um lítið magn myndi gefa 50, en það er ekki stöðugt. 60 er útborgun þess sem svíkur.`},
{id:"f13", t:"fak", src:"Dæmablað 9, dæmi 1a",
 q:`Demantar: jaðarkostnaður er $1.000 á demant.<table class="dt"><tr><th>Verð ($)</th><th>Magn</th></tr><tr><td>8.000</td><td>5.000</td></tr><tr><td>7.000</td><td>6.000</td></tr><tr><td>6.000</td><td>7.000</td></tr><tr><td>2.000</td><td>11.000</td></tr><tr><td>1.000</td><td>12.000</td></tr></table>Ef framleiðendur væru margir, hvert yrði verð og magn?`,
 o:["P = $1.000, Q = 12.000","P = $7.000, Q = 6.000","P = $6.000, Q = 7.000","P = $2.000, Q = 11.000","P = $8.000, Q = 5.000"], a:0,
 e:"Í fullkominni samkeppni er V = JK = $1.000, og við það verð eru eftirspurð 12.000. Gildran $7.000 er einokunarlausnin (b-liður)."},
{id:"f14", t:"fak", src:"Dæmablað 9, dæmi 1b",
 q:"Demantar: JK = $1.000. Eftirspurn: P = 8.000 ⇒ Q = 5.000; 7.000 ⇒ 6.000; 6.000 ⇒ 7.000; 5.000 ⇒ 8.000. Ef aðeins einn framleiðandi er á markaðnum, hver er hagnaður hans?",
 o:["$36 m. (P = 7.000, Q = 6.000)","$42 m. (P = 7.000, Q = 6.000)","$35 m. (P = 6.000, Q = 7.000)","$35 m. (P = 8.000, Q = 5.000)","$40 m. (P = 5.000, Q = 8.000)"], a:0,
 e:`<table class="dt"><tr><th>P</th><th>Q</th><th>(P − 1.000) × Q</th></tr><tr><td>8.000</td><td>5.000</td><td>35 m</td></tr><tr><td>7.000</td><td>6.000</td><td><b>36 m</b></td></tr><tr><td>6.000</td><td>7.000</td><td>35 m</td></tr><tr><td>5.000</td><td>8.000</td><td>32 m</td></tr></table>Gildrur: $42 m. eru heildartekjurnar (gleymt að draga kostnað frá). Hámarkstekjur ($42 m.) nást líka við P = 6.000, en hagnaður ræðst af tekjum <b>mínus</b> kostnaði.`},
{id:"f15", t:"fak", src:"Dæmablað 9, dæmi 1c",
 q:"Rússland og Suður-Afríka hafa samráð: P = $7.000, Q = 6.000, 3.000 demantar hvort. JK = $1.000. Ef S-Afríka eykur framleiðslu í 4.000 (verð fer í $6.000) en Rússland heldur sig við samkomulagið, hvernig breytist hagnaður S-Afríku?",
 o:["Eykst um $2 m. (úr 18 í 20 m.)","Minnkar um $3 m. (úr 18 í 15 m.)","Breytist ekki","Eykst um $6 m. (úr 18 í 24 m.)","Minnkar um $1 m. (úr 36 í 35 m.)"], a:0,
 e:`<div class="f">Samráð: (7.000 − 1.000) × 3.000 = 18 m<br>Svik: (6.000 − 1.000) × 4.000 = 20 m<br>Breyting = +2 m</div>Rússland fer í (6.000 − 1.000) × 3.000 = 15 m (gildran −3 m. á við Rússland). 24 m gleymir að verðið lækkar. 36 → 35 m er breytingin á samanlögðum hagnaði.`},
{id:"f16", t:"fak", src:"Dæmablað 9, dæmi 1d",
 q:"Hvað sýnir demantadæmið (DB9 #1c) um samráð?",
 o:["Hvor aðili græðir á að auka framleiðslu ef hinn heldur samkomulagið, svo samráð er óstöðugt","Samráð er alltaf stöðugt því báðir græða á því","Samráð lækkar verð til neytenda","Sá sem eykur framleiðsluna tapar alltaf","Samráð og fullkomin samkeppni gefa sama hagnað"], a:0,
 e:"S-Afríka hækkar hagnað sinn úr 18 í 20 m. með því að svíkja. Rússland hefur sama hvata. Ef bæði svíkja lækkar verðið enn meira og samanlagður hagnaður minnkar. Sama valkreppa og hjá föngunum."},
{id:"f17", t:"fak", src:"Dæmablað 9, dæmi 2a–b",
 q:`Hugbúnaðarfyrirtæki A og B velja stóran eða lítinn rannsóknarsjóð. Hagnaður í m. kr. (A, B):<table class="dt"><tr><th></th><th>A stór</th><th>A lítill</th></tr><tr><td>B stór</td><td>20, 30</td><td>0, 70</td></tr><tr><td>B lítill</td><td>30, 0</td><td>40, 50</td></tr></table>Hvaða fyrirtæki hefur ríkjandi leikáætlun?`,
 o:["Aðeins B (stór sjóður)","Aðeins A (stór sjóður)","Bæði (stór sjóður)","Hvorugt","Aðeins A (lítill sjóður)"], a:0,
 e:`<div class="f">B: ef A stór: stór 30 &gt; lítill 0<br>B: ef A lítill: stór 70 &gt; lítill 50 ⇒ stór er ríkjandi<br>A: ef B stór: stór 20 &gt; lítill 0<br>A: ef B lítill: stór 30 &lt; lítill 40 ⇒ engin ríkjandi</div>Besta svar A fer eftir því hvað B gerir. Algeng villa er að lesa útborganir dálkaleikmannsins (A) sem línuleikmannsins.`},
{id:"f18", t:"fak", src:"Dæmablað 9, dæmi 2c",
 q:`Sama ábatafylki (A, B): B stór/A stór = (20, 30); B stór/A lítill = (0, 70); B lítill/A stór = (30, 0); B lítill/A lítill = (40, 50). Hvert er Nash-jafnvægið?`,
 o:["Báðir stór sjóður: A fær 20, B fær 30","Báðir lítill sjóður: A fær 40, B fær 50","A lítill, B stór: A fær 0, B fær 70","A stór, B lítill: A fær 30, B fær 0","Ekkert Nash-jafnvægi er til"], a:0,
 e:"B velur stóran sjóð (ríkjandi). Besta svar A við því er stór sjóður (20 &gt; 0). Hvorugt vill þá breyta einhliða. (Lítill, lítill) gefur báðum meira en er ekki jafnvægi, því B myndi skipta í stóran (70 &gt; 50)."},
{id:"f19", t:"fak", src:"Dæmablað 9, dæmi 3a",
 q:"Tveir bændur kaupa 10 eða 20 kýr hvor. Hver kýr kostar $1.000 og gefur mjólk fyrir $4.000 ef kýrnar eru 20 alls, $3.000 ef 30 og $2.000 ef 40. Ef bóndi 1 kaupir 20 en bóndi 2 kaupir 10, hver er hagnaður þeirra?",
 o:["Bóndi 1: $40.000 · Bóndi 2: $20.000","Bóndi 1: $60.000 · Bóndi 2: $30.000","Bóndi 1: $30.000 · Bóndi 2: $30.000","Bóndi 1: $20.000 · Bóndi 2: $20.000","Bóndi 1: $40.000 · Bóndi 2: $10.000"], a:0,
 e:`<div class="f">Kýr alls = 30 ⇒ $3.000 á kú<br>Bóndi 1: 20 × (3.000 − 1.000) = 40.000<br>Bóndi 2: 10 × (3.000 − 1.000) = 20.000</div>Gildran 60.000/30.000 gleymir kostnaðinum ($1.000 á kú). Fylkið allt: (10,10) = 30 þ. hvor; (20,20) = 20 þ. hvor.`},
{id:"f20", t:"fak", src:"Dæmablað 9, dæmi 3b",
 q:"Í kúadæminu (DB9 #3) gefur (10, 10) 30.000 hvor, (20, 10) 40.000/20.000 og (20, 20) 20.000 hvor. Hvaða útkoma er hagkvæmust og hver er líklegust?",
 o:["Hagkvæmust: báðir 10 kýr (samtals 60.000) · Líklegust: báðir 20 kýr","Hagkvæmust: báðir 20 kýr · Líklegust: báðir 10 kýr","Hagkvæmust og líklegust: báðir 10 kýr","Hagkvæmust og líklegust: báðir 20 kýr","Hagkvæmust: báðir 20 (samtals 40.000) · Líklegust: annar 20 og hinn 10"], a:0,
 e:`<table class="dt"><tr><th></th><th>B 10</th><th>B 20</th></tr><tr><td>A 10</td><td>30 þ, 30 þ</td><td>20 þ, 40 þ</td></tr><tr><td>A 20</td><td>40 þ, 20 þ</td><td>20 þ, 20 þ</td></tr></table>Samtals: (10,10) = 60 þ, (20,10) = 60 þ, (20,20) = 40 þ. Að kaupa 20 er aldrei verra (40 &gt; 30; 20 = 20), svo líklegast kaupa báðir 20. Þetta er harmleikur almenninganna. (10,10) og (20,10) gefa sömu summu, en (10,10) skiptir jafnt og er sú útkoma sem dæmið leitar að.`},
{id:"f21", t:"fak", src:"K13 · Hver leikur á eftir öðrum",
 q:"Fyrirtæki X velur fyrst hátt eða lágt verð; Y sér valið og ákveður hvort það kemur inn. Útborganir (X, Y): lágt + inn = (5, −5); lágt + ekki = (10, 0); hátt + inn = (−5, 7,5); hátt + ekki = (15, 0). Hvað gerist?",
 o:["X setur lágt verð, Y kemur ekki inn og X fær 10","X setur hátt verð, Y kemur ekki inn og X fær 15","X setur hátt verð, Y kemur inn og X fær −5","X setur lágt verð, Y kemur inn og X fær 5","X setur hátt verð og fær 7,5"], a:0,
 e:`Leystu aftur á bak (frá Y):<div class="f">Ef lágt: Y ekki inn (0 &gt; −5) ⇒ X fær 10<br>Ef hátt: Y inn (7,5 &gt; 0) ⇒ X fær −5<br>X ber saman 10 og −5 ⇒ lágt verð</div>Gildran 15 gerir ráð fyrir að Y komi ekki inn við hátt verð, en það er ekki trúverðugt: Y græðir á að koma inn.`},
{id:"f22", t:"fak", src:"K13 · Eðli trúverðugleika: þvottaefni",
 q:"X velur fyrst fljótandi eða duft, svo Y. Útborganir í €m (X, Y): duft/duft = (−10, −10); duft/fljótandi = (20, 30); fljótandi/duft = (30, 20); fljótandi/fljótandi = (−10, −10). Hver er niðurstaðan ef X leikur fyrst?",
 o:["X framleiðir fljótandi, Y framleiðir duft: X fær 30, Y fær 20","X framleiðir duft, Y fljótandi: X fær 20, Y fær 30","Bæði framleiða fljótandi: −10 hvort","Bæði framleiða duft: −10 hvort","X framleiðir ekkert"], a:0,
 e:`<div class="f">Ef X fljótandi: Y velur duft (20 &gt; −10) ⇒ X fær 30<br>Ef X duft: Y velur fljótandi (30 &gt; −10) ⇒ X fær 20<br>X velur fljótandi (30 &gt; 20)</div>Sá sem leikur fyrst hefur forskot: með því að skuldbinda sig við fljótandi neyðir X Y til að velja duft.`},
{id:"f23", t:"fak", src:"K13 · Hótanir og trúverðugleiki",
 q:"Hvað þarf til að hótun hafi áhrif á hegðun keppinautar?",
 o:["Hún þarf að vera trúverðug, þ.e. það þarf að borga sig fyrir þann sem hótar að framfylgja henni","Hún þarf að vera opinber","Hún þarf að valda keppinautnum miklu tapi","Hún þarf að vera ólögleg","Nóg er að hún sé sett fram fyrst"], a:0,
 e:"Ef það borgar sig ekki að framfylgja hótuninni þegar á reynir, mun keppinauturinn ekki trúa henni (sjá X/Y-leikinn: hótun um að Y komi ekki inn við hátt verð er ekki trúverðug). Trúverðug hótun getur þvingað keppinautinn til ákveðinna viðbragða."},
{id:"f24", t:"fak", src:"K13 · HHI: dæmi",
 q:"Á markaði eru fimm fyrirtæki. Eitt hefur 80% markaðshlutdeild og hin fjögur 5% hvert. Hver er HHI?",
 o:["6.500","2.000","100","6.425","10.000"], a:0,
 e:`<div class="f">HHI = Σ sᵢ²<br>HHI = 80² + 4 × 5² = 6.400 + 100 = 6.500</div>Til samanburðar: fimm jafnstór (20% hvert) gefa 5 × 400 = 2.000. Gildrur: 100 er summa hlutdeildanna (gleymt að setja í annað veldi); 6.425 setur aðeins eitt 5% í annað veldi; 10.000 er einokun.`},
{id:"f25", t:"fak", src:"K13 · Herfindahl-Hirschman vísitalan",
 q:"Hvað er rétt um HHI?",
 o:["HHI er 10.000 í einokun og lækkar eftir því sem samkeppni er meiri","HHI er 0 í einokun og 10.000 í fullkominni samkeppni","HHI er á milli 0 og 1","HHI mælir álagningu umfram jaðarkostnað","HHI er summa markaðshlutdeilda"], a:0,
 e:`<div class="f">HHI = Σ sᵢ² (s í prósentum)<br>Einokun: 100² = 10.000</div>Gildrurnar „á milli 0 og 1“ og „álagning umfram JK“ eiga við <b>Lerner</b>-vísitöluna. Summa hlutdeilda er alltaf 100.`},
{id:"f26", t:"fak", src:"K13 · Lerner vísitalan",
 q:"Hvað á <b>EKKI</b> við um Lerner-vísitöluna?",
 o:["Hún er 10.000 í einokun","Hún mælir álagningu umfram jaðarkostnað","Hún er á milli 0 og 1","Hún er 0 í fullkominni samkeppni","Því hærri sem hún er, því meira markaðsvald"], a:0,
 e:`<div class="f">L = (P − MC)/P = −1/ε_D</div>10.000 er hámark HHI, ekki Lerner. Rugli þessara tveggja vísitalna er algeng gildra.`},
{id:"f27", t:"fak", src:"Aukadæmi 9, dæmi 1",
 q:"Þegar bann var sett á tóbaksauglýsingar börðust tóbaksfyrirtækin lítið gegn því og hagnaður þeirra jókst. Hvernig skýrir leikjafræði þetta?",
 o:["Auglýsingar voru valkreppa fangans: hvert fyrirtæki auglýsti því það var ríkjandi, en bannið leysti þau undan því og sparaði auglýsingakostnað","Bannið jók eftirspurn eftir tóbaki","Bannið gerði fyrirtækjunum kleift að hækka jaðarkostnað","Bannið fjölgaði fyrirtækjum á markaðnum","Auglýsingar höfðu engin áhrif á hagnað"], a:0,
 e:"Rétt eins og í Heklu/Toyota-leiknum er ríkjandi að auglýsa, en jafnvægið (bæði auglýsa) er verra en ef hvorugt auglýsti. Bannið framfylgir samvinnulausninni. Bannið getur samt verið góð stefna (c-liður) ef markmiðið er að draga úr reykingum, þótt það auki hagnað fyrirtækjanna."},
{id:"f28", t:"fak", src:"K13 · Viðbrögð við samkeppnishömlum",
 q:"Hvaða fullyrðing um viðbrögð stjórnvalda við samkeppnishömlum er rétt samkvæmt glærunum?",
 o:["Verðsamráð er bannað, en reglur um fjölda fyrirtækja eru flóknari því mæla þarf t.d. markaðshlutdeild (HHI, Lerner)","Verðsamráð er löglegt ef fyrirtækin eru færri en fimm","Stjórnvöld geta auðveldlega sett reglur sem eru réttlátar í öllum tilvikum","Stjórnvöld nota HHI til að ákveða verð","Lerner-vísitalan mælir fjölda fyrirtækja"], a:0,
 e:"Glæran greinir á milli banns (augljóslega slæm hegðun eins og verðsamráð) og stýringar á fjölda fyrirtækja, sem er flóknari og aðstæðubundnari. Til þess eru notaðir mælikvarðar á borð við Lerner og HHI."},
{id:"f29", t:"fak", src:"K13 · Samantekt (tafla)",
 q:"Samkvæmt samantektartöflunni: hvað á aðeins við fákeppni og einkasölusamkeppni, en ekki einokun og fullkomna samkeppni?",
 o:["Hegðun fyrirtækisins er háð aðgerðum samkeppnisaðila","Hagnaður hámarkaður þar sem JT = JK","P > JK","Aðgangshindranir eru umtalsverðar","Hagnaður er alltaf núll til langs tíma"], a:0,
 e:"Taflan, lína 7: einokun hefur enga samkeppni og samkeppnisfyrirtæki hugsa bara um markaðsverðið, en í fákeppni og einkasölusamkeppni ráðast ákvarðanir af keppinautunum. JT = JK gildir í öllum fjórum; P &gt; JK á við þrjú; umtalsverðar hindranir aðeins við fákeppni."},
// ======================= ALÞJÓÐAVIÐSKIPTI (K17) =======================
{id:"v01", t:"vid", src:"K17 · Heimsmarkaðsverð og hlutfallslegir yfirburðir",
 q:"Verð á vöru í landi án viðskipta er lægra en heimsmarkaðsverðið. Hvað segir það og hvað gerist þegar viðskipti eru leyfð?",
 o:["Landið hefur hlutfallslega yfirburði í framleiðslunni og flytur vöruna út","Landið hefur hlutfallslega yfirburði og flytur vöruna inn","Umheimurinn hefur hlutfallslega yfirburði og landið flytur vöruna út","Landið hefur algera yfirburði og hættir framleiðslu","Ekkert gerist, því innlent verð ræður"], a:0,
 e:"Lágt innanlandsverð ⇒ lágur fórnarkostnaður ⇒ hlutfallslegir yfirburðir ⇒ útflutningur. Innlent verð hækkar upp í heimsmarkaðsverð. Ef innanlandsverð væri hærra myndi landið flytja inn."},
{id:"v02", t:"vid", src:"K17 · Áhrif útflutnings á velferð",
 q:"Land byrjar að flytja út vöru. Á myndinni eru svæðin A, B, C og D. Hver er breytingin á neytenda-, framleiðenda- og heildarábata?",
 o:["Neytendur −B · Framleiðendur +(B + D) · Heild +D","Neytendur +(B + D) · Framleiðendur −B · Heild +D","Neytendur −B · Framleiðendur +B · Heild 0","Neytendur 0 · Framleiðendur +D · Heild +D","Neytendur −(B + D) · Framleiðendur +(B + D) · Heild 0"], a:0,
 e:`<table class="dt"><tr><th></th><th>Fyrir</th><th>Eftir</th><th>Breyting</th></tr><tr><td>NÁ</td><td>A + B</td><td>A</td><td>−B</td></tr><tr><td>FÁ</td><td>C</td><td>B + C + D</td><td>+(B + D)</td></tr><tr><td>Heild</td><td>A + B + C</td><td>A + B + C + D</td><td>+D</td></tr></table>Gildran (−B, +(B+D)) víxlað er niðurstaðan fyrir <b>innflutnings</b>land. Í útflutningslandi hækkar verðið, svo neytendur tapa.`},
{id:"v03", t:"vid", src:"K17 · Hagnaður og tap innflutningslandsins",
 q:"Land byrjar að flytja inn vöru á heimsmarkaðsverði sem er lægra en innlent verð. Hverjir hagnast og hverjir tapa?",
 o:["Innlendir neytendur hagnast, innlendir framleiðendur tapa og heildarábati eykst","Innlendir framleiðendur hagnast, neytendur tapa og heildarábati eykst","Bæði neytendur og framleiðendur hagnast","Neytendur hagnast en heildarábati minnkar","Enginn hagnast því innflutningur flytur störf úr landi"], a:0,
 e:"Verðið lækkar í heimsmarkaðsverð: neytendaábati eykst um B + D, framleiðendaábati minnkar um B, heildarábati eykst um D (ávinningurinn af viðskiptum). Hagnaður sigurvegaranna er meiri en tap þeirra sem tapa."},
{id:"v04", t:"vid", src:"K17 · Hagnaður og tap útflutningslandsins",
 q:"Hvaða fullyrðing um alþjóðaviðskipti er <b>RÖNG</b>?",
 o:["Neytendaábati dregst aldrei saman þegar land hefur viðskipti","Í útflutningslandi fá innlendir framleiðendur ávinning","Viðskipti auka heildarábata þjóðarinnar","Í innflutningslandi minnka innlendir framleiðendur framleiðslu sína","Þegar land stundar viðskipti eru sigurvegarar og taparar"], a:0,
 e:"Í útflutningslandi hækkar verðið upp í heimsmarkaðsverð, svo neytendaábati dregst saman um B. Hinar fullyrðingarnar eru teknar beint úr glærunum."},
{id:"v05", t:"vid", src:"Dæmablað 9, dæmi 4a",
 q:"Gulrætur: innlend eftirspurn Q<sub>D</sub> = 100 − 2P og innlent framboð Q<sub>S</sub> = 20 + 2P. Ef innflutningur er bannaður, hvert er jafnvægisverð og -magn?",
 o:["P = 20, Q = 60","P = 8, Q = 84","P = 25, Q = 50","P = 30, Q = 40","P = 20, Q = 40"], a:0,
 e:`<div class="f">100 − 2P = 20 + 2P<br>80 = 4P ⇒ P = 20<br>Q = 100 − 2 × 20 = 60</div>Gildrur: P = 8 er heimsmarkaðsverðið (Q = 84 er eftirspurnin við það). P = 25 kemur úr 100/4 (gleymt að draga 20 frá).`},
{id:"v06", t:"vid", src:"Dæmablað 9, dæmi 4b-i",
 q:"Gulrætur: Q<sub>D</sub> = 100 − 2P, Q<sub>S</sub> = 20 + 2P og heimsmarkaðsverð er 8 kr. Innflutningur er leyfður. Hve mikið er flutt inn?",
 o:["48","84","36","60","24"], a:0,
 e:`<div class="f">Q<sub>D</sub> = 100 − 2 × 8 = 84<br>Q<sub>S</sub> = 20 + 2 × 8 = 36<br>Innflutningur = 84 − 36 = 48</div>Gildrur: 84 er eftirspurnin, 36 innlent framboð. 24 kemur úr (84 − 60): bilið milli nýrrar eftirspurnar og gamla jafnvægismagnsins, ekki innflutningur.`},
{id:"v07", t:"vid", src:"Dæmablað 9, dæmi 4b-iii",
 q:"Gulrætur: Q<sub>D</sub> = 100 − 2P, Q<sub>S</sub> = 20 + 2P, heimsmarkaðsverð 8 (jafnvægi án viðskipta P = 20). Um hve mikið eykst heildarvelferð þegar innflutningur er leyfður?",
 o:["288","576","864","144","432"], a:0,
 e:`Ávinningurinn er þríhyrningurinn D:<div class="f">Hæð = 20 − 8 = 12<br>Grunnur = innflutningur = 84 − 36 = 48<br>D = ½ × 12 × 48 = 288</div>Eða sem summa breytinganna:<div class="f">ΔNÁ = +864 · ΔFÁ = −576<br>Δheild = 864 − 576 = 288</div>Gildrur: 576 gleymir ½ (og er líka tap framleiðenda); 864 er aukning neytendaábatans einungis.`},
{id:"v08", t:"vid", src:"Dæmablað 9, dæmi 4b-ii",
 q:"Gulrætur: Q<sub>D</sub> = 100 − 2P, Q<sub>S</sub> = 20 + 2P. Verðið fer úr 20 í heimsmarkaðsverðið 8. Hver er breytingin á neytendaábata og framleiðendaábata?",
 o:["Neytendaábati +864 · Framleiðendaábati −576","Neytendaábati +576 · Framleiðendaábati −864","Neytendaábati +720 · Framleiðendaábati −432","Neytendaábati +288 · Framleiðendaábati 0","Neytendaábati +1.008 · Framleiðendaábati −432"], a:0,
 e:`Hvort svæði er trapisa milli verðanna 8 og 20:<div class="f">ΔNÁ = ½ × (60 + 84) × 12 = 864<br>ΔFÁ = −½ × (60 + 36) × 12 = −576<br>Δheild = 864 − 576 = 288</div>Gildrur: 720 = 60 × 12 og 432 = 36 × 12 eru rétthyrningarnir án þríhyrninganna; 1.008 = 84 × 12 reiknar allt magnið á nýja verðinu sem rétthyrning. 864/576 víxlað snýr neytendum og framleiðendum við.`},
{id:"v09", t:"vid", src:"Dæmablað 9, dæmi 4c-i",
 q:"Gulrætur: Q<sub>D</sub> = 100 − 2P, Q<sub>S</sub> = 20 + 2P, heimsmarkaðsverð 8. Settur er 40% tollur á heimsmarkaðsverðið. Hve mikið er flutt inn?",
 o:["35,2","48","77,6","12,8","40"], a:0,
 e:`<div class="f">P = 8 × 1,4 = 11,2<br>Q<sub>D</sub> = 100 − 2 × 11,2 = 77,6<br>Q<sub>S</sub> = 20 + 2 × 11,2 = 42,4<br>Innflutningur = 77,6 − 42,4 = 35,2</div>Gildrur: 48 er innflutningur án tolls; 77,6 er eftirspurnin. 12,8 er samdráttur innflutnings (48 − 35,2). 40 kemur úr því að leggja 40 kr. ofan á verðið í stað 40%.`},
{id:"v10", t:"vid", src:"Dæmablað 9, dæmi 4c-ii",
 q:"Gulrætur: 40% tollur á heimsmarkaðsverðið 8 hækkar verðið í 11,2 og innflutningur fer í 35,2. Hverjar eru tolltekjur ríkisins?",
 o:["112,64","153,6","394,24","20,48","89,6"], a:0,
 e:`<div class="f">Tollur á einingu = 11,2 − 8 = 3,2<br>Tolltekjur = 3,2 × 35,2 = 112,64</div>Gildrur: 153,6 = 3,2 × 48 (innflutningur fyrir toll); 394,24 = 11,2 × 35,2 (allt verðið, ekki tollurinn); 20,48 er allratapið.`},
{id:"v11", t:"vid", src:"Dæmablað 9, dæmi 4c-iii",
 q:"Gulrætur: 40% tollur hækkar verðið úr 8 í 11,2. Innlent framboð fer úr 36 í 42,4 og eftirspurn úr 84 í 77,6. Hvert er allratap tollsins?",
 o:["20,48","10,24","40,96","112,64","35,84"], a:0,
 e:`Allratapið er þríhyrningarnir D + F:<div class="f">D = ½ × 3,2 × (42,4 − 36) = 10,24<br>F = ½ × 3,2 × (84 − 77,6) = 10,24<br>D + F = 20,48</div>Eða: ΔNÁ = −258,56, ΔFÁ = +125,44, tolltekjur +112,64 ⇒ summa −20,48. Gildrur: 10,24 telur aðeins annan þríhyrninginn; 40,96 gleymir ½.`},
{id:"v12", t:"vid", src:"Dæmablað 9, dæmi 4c-iv",
 q:"Í stað 40% tollsins er settur innflutningskvóti upp á 35,2 einingar (heimsmarkaðsverð 8, innlent verð með kvóta 11,2). Hve miklu væru hagsmunahópar sem fengju kvótann tilbúnir að eyða til að fá hann?",
 o:["Allt að 112,64, sem er kvótarentan","Allt að 20,48, sem er allratapið","Allt að 288","Engu, því kvótinn skilar þeim engum ábata","Allt að 394,24"], a:0,
 e:`<div class="f">Kvótahafi kaupir á 8 og selur á 11,2<br>Renta = (11,2 − 8) × 35,2 = 112,64</div>Kvótinn gefur sama verð, magn og allratap og tollurinn, en svæðið sem áður voru tolltekjur (E′ + E″) rennur til kvótahafa. Þeir myndu eyða allt að þeirri upphæð í hagsmunagæslu, og þá getur kvóti valdið meira tapi en tollur.`},
{id:"v13", t:"vid", src:"Dæmablað 9, dæmi 4d",
 q:"Gulrætur: Q<sub>D</sub> = 100 − 2P, Q<sub>S</sub> = 20 + 2P, heimsmarkaðsverð 8. Í stað 40% er settur 200% tollur. Hvað gerist?",
 o:["Verð með tolli (24) er yfir jafnvægisverðinu án viðskipta (20), svo innflutningur hverfur, P = 20 og Q = 60","Verðið verður 24, innlent framboð 68 og eftirspurn 52","Innflutningur verður 16","Verðið verður 16 og innflutningur 36","Tolltekjur verða 16 × 48 = 768"], a:0,
 e:`<div class="f">8 × (1 + 2) = 24 &gt; 20 = jafnvægisverð án viðskipta</div>Enginn kaupir innflutt á 24 þegar innlent jafnvægi gefur 20. Tollurinn er bannandi: engar tolltekjur og allratapið verður allur ávinningurinn af viðskiptum, 288. Gildran (24; 68; 52) setur P = 24 inn í föllin, en þá væri umframframboð.`},
{id:"v14", t:"vid", src:"Aukadæmi 9, dæmi 2a–b",
 q:"Hrísgrjón: Q<sub>D</sub> = 500 − 2P, Q<sub>S</sub> = 50 + P og heimsmarkaðsverð P<sub>W</sub> = 50. Engar hömlur eru á viðskiptum. Hvað gerist?",
 o:["Landið flytur inn 300","Landið flytur út 300","Landið flytur inn 200","Landið flytur út 150","Landið flytur inn 400"], a:0,
 e:`<div class="f">Án viðskipta: 500 − 2P = 50 + P ⇒ P = 150, Q = 200<br>P<sub>W</sub> = 50 &lt; 150 ⇒ innflutningur<br>Q<sub>D</sub> = 500 − 100 = 400<br>Q<sub>S</sub> = 50 + 50 = 100<br>Innflutningur = 400 − 100 = 300</div>Gildrur: 200 er jafnvægismagnið án viðskipta; 400 er eftirspurnin. Útflutningur kæmi aðeins til ef P<sub>W</sub> &gt; 150.`},
{id:"v15", t:"vid", src:"Aukadæmi 9, dæmi 2c",
 q:"Hrísgrjón: Q<sub>D</sub> = 500 − 2P, Q<sub>S</sub> = 50 + P, P<sub>W</sub> = 50. Settur er innflutningskvóti upp á 120 einingar. Hvert verður innanlandsverðið?",
 o:["110","90","150","50","120"], a:0,
 e:`<div class="f">Q<sub>D</sub> − Q<sub>S</sub> = 120<br>(500 − 2P) − (50 + P) = 120<br>450 − 3P = 120 ⇒ P = 110</div>Gildrur: 150 er verð án viðskipta, 50 heimsmarkaðsverðið. 90 kemur úr því að leggja kvótann við í stað þess að draga hann frá (450 − 3P = 180).`},
{id:"v16", t:"vid", src:"Aukadæmi 9, dæmi 2d",
 q:"Hrísgrjón: Q<sub>D</sub> = 500 − 2P, Q<sub>S</sub> = 50 + P, P<sub>W</sub> = 50. Með 120 eininga kvóta verður verðið 110. Hve mikið er framleitt innanlands?",
 o:["160","280","100","200","120"], a:0,
 e:`<div class="f">Q<sub>S</sub> = 50 + 110 = 160<br>Q<sub>D</sub> = 500 − 220 = 280<br>Athugun: 280 − 160 = 120 = kvóti ✓</div>Gildrur: 280 er eftirspurnin; 100 er innlend framleiðsla án kvóta; 200 er jafnvægið án viðskipta.`},
{id:"v17", t:"vid", src:"K17 · Áhrif tolla (samantekt)",
 q:"Settur er tollur á innflutta vöru (svæðin A–G eins og á glærunni). Hvaða svæði mælir allratapið?",
 o:["D + F","E","C","C + D + E + F","D + E + F"], a:0,
 e:`<table class="dt"><tr><th></th><th>Breyting</th></tr><tr><td>Neytendaábati</td><td>−(C + D + E + F)</td></tr><tr><td>Framleiðendaábati</td><td>+C</td></tr><tr><td>Tolltekjur</td><td>+E</td></tr><tr><td>Heildarábati</td><td>−(D + F)</td></tr></table>D er offramleiðsla innanlands (dýrari en innflutningur), F er neysla sem tapast. E eru tolltekjur og C fer til framleiðenda; þau eru tilfærsla, ekki tap.`},
{id:"v18", t:"vid", src:"K17 · Áhrif innflutningskvóta",
 q:"Hvað greinir innflutningskvóta frá tolli sem gefur sama innlenda verð?",
 o:["Allratapið er það sama, en það sem hefðu verið tolltekjur rennur til kvótahafa","Kvótinn veldur engu allratapi","Kvótinn lækkar innanlandsverð en tollur hækkar það","Tollurinn eykur heildarábata en kvótinn minnkar hann","Kvótinn eykur innflutning"], a:0,
 e:"Kvótahafar kaupa á heimsmarkaðsverði og selja á hærra innanlandsverði og fá svæðið E′ + E″. Allratapið D + F er það sama. Glæran bætir við að kvóti geti valdið meira tapi en tollur ef úthlutun kvótanna er óhagkvæm."},
{id:"v19", t:"vid", src:"K17 · Bæði tollar og innflutningskvótar",
 q:"Hvað á <b>EKKI</b> við um bæði tolla og innflutningskvóta?",
 o:["Þeir auka heildarábata þjóðarinnar","Þeir hækka innanlandsverð","Þeir draga úr velferð innlendra neytenda","Þeir auka velferð innlendra framleiðenda","Þeir valda allratapi"], a:0,
 e:"Glæran „Bæði tollar og innflutningskvótar…“ telur upp: hækka innanlandsverð, draga úr velferð neytenda, auka velferð framleiðenda, valda allratapi. Heildarábati minnkar um D + F."},
{id:"v20", t:"vid", src:"K17 · Áhrif tolla",
 q:"Hvaða áhrif hefur tollur á innlendan markað?",
 o:["Hann færir markaðinn nær því jafnvægi sem væri án alþjóðaviðskipta","Hann færir innanlandsverð niður að heimsmarkaðsverði","Hann eykur innflutning","Hann lækkar innlenda framleiðslu","Hann hefur aðeins áhrif á heimsmarkaðsverðið"], a:0,
 e:"Tollur hækkar innanlandsverð (í átt að verði án viðskipta), eykur innlenda framleiðslu og dregur úr neyslu og innflutningi. Í öfgatilfelli (DB9 #4d) hverfur innflutningurinn alveg og markaðurinn er aftur í jafnvægi án viðskipta."},
{id:"v21", t:"vid", src:"K17 · Aðrir kostir alþjóðaviðskipta",
 q:"Hvað er <b>EKKI</b> talið upp sem einn af öðrum kostum alþjóðaviðskipta?",
 o:["Hærra innlent verð á innfluttum vörum","Meiri fjölbreytni vara","Lægri kostnaður vegna stærðarhagkvæmni","Aukin samkeppni","Hagvöxtur"], a:0,
 e:"Glæran „Aðrir kostir alþjóðaviðskipta“: fjölbreytni, stærðarhagkvæmni, aukin samkeppni og hagvöxtur. Viðskipti lækka verð innfluttra vara, ekki hækka."},
{id:"v22", t:"vid", src:"K17 · Samantekt",
 q:"Hvaða rök fyrir viðskiptahömlum eru nefnd í samantektinni?",
 o:["Að vernda störf, koma í veg fyrir ósanngjarna samkeppni og bregðast við höftum erlendis","Að auka heildarábata og lækka verð","Að auka fjölbreytni vara","Að draga úr allratapi","Að auka hlutfallslega yfirburði landsins"], a:0,
 e:"Samantektin nefnir þessi þrjú rök. Hin eru í raun rök <b>fyrir</b> frjálsum viðskiptum eða standast ekki (hömlur valda allratapi)."},
{id:"v23", t:"vid", src:"K17 · Tollar",
 q:"Hvað er tollur?",
 o:["Skattur á innfluttar vörur sem hækkar verð þeirra um sem nemur tollinum","Magntakmörkun á innflutningi","Niðurgreiðsla til innlendra framleiðenda","Skattur á útfluttar vörur","Bann við innflutningi"], a:0,
 e:"Tollur = skattur á innflutning. Magntakmörkun er innflutningskvóti. Báðar eru viðskiptahindranir sem hækka innanlandsverð."},
{id:"v24", t:"vid", src:"K17 · Áhrif tolla (samantekt)",
 q:"Hverjir hagnast á því að tollur sé settur á innflutta vöru?",
 o:["Innlendir framleiðendur og ríkið","Innlendir neytendur og ríkið","Innlendir neytendur og framleiðendur","Erlendir framleiðendur","Aðeins ríkið"], a:0,
 e:"Framleiðendaábati eykst um C (hærra verð), ríkið fær tolltekjur E. Neytendur tapa C + D + E + F. Samanlagt tapast D + F."},
// ======================= ÓVISSA, ÁHÆTTA OG TRYGGINGAR (K18) =======================
{id:"o01", t:"ovi", src:"K18 · Vænt gildi og breytileiki",
 q:"Hvernig er vænt gildi, E(V), skilgreint?",
 o:["Summa allra útkoma, hver margfölduð með líkunum á henni: E(V) = Σ pᵢVᵢ","Sú útkoma sem er líklegust","Einfalt meðaltal hæstu og lægstu útkomu","Kvaðratrótin af fervikinu","Summa allra mögulegra útkoma"], a:0,
 e:`<div class="f">E(V) = Σ pᵢVᵢ<br>Var(V) = Σ pᵢ(Vᵢ − E(V))²<br>σ = √Var(V)</div>Einfalt meðaltal gefur aðeins rétt svar þegar líkurnar eru jafnar. Kvaðratrót fervikisins er staðalfrávikið.`},
{id:"o02", t:"ovi", src:"K18 · Vænt gildi og breytileiki: dæmi 1",
 q:"Solla heldur viðburð undir berum himni: hagnaður 20 kr. ef þurrt, 0 kr. ef rignir, 50% líkur á rigningu. Hvert er staðalfrávik hagnaðarins?",
 o:["10 kr.","100 kr.","20 kr.","5 kr.","0 kr."], a:0,
 e:`<div class="f">E(V) = 0,5 × 20 + 0,5 × 0 = 10<br>Var(V) = 0,5 × (20 − 10)² + 0,5 × (0 − 10)² = 100<br>σ = √100 = 10</div>Gildrur: 100 er fervikið (gleymt að taka kvaðratrót); 20 er spönnin. Staðalfrávik er meðalfjarlægð frá væntu gildi, hér 10.`},
{id:"o03", t:"ovi", src:"K18 · Vænt gildi og breytileiki: dæmi 2",
 q:"Solla leigir sal: hagnaður 15 kr. ef þurrt, 5 kr. ef rignir, 50% líkur á rigningu. Hvert er vænt gildi og staðalfrávik?",
 o:["E(V) = 10 og σ = 5","E(V) = 10 og σ = 25","E(V) = 10 og σ = 10","E(V) = 20 og σ = 5","E(V) = 15 og σ = 5"], a:0,
 e:`<div class="f">E(V) = 0,5 × 15 + 0,5 × 5 = 10<br>Var(V) = 0,5 × (15 − 10)² + 0,5 × (5 − 10)² = 25<br>σ = √25 = 5</div>Sama væntigildi og úti (10) en helmingi minni óvissa. Gildrur: 25 er fervikið; 20 er summan án líkna.`},
{id:"o04", t:"ovi", src:"K18 · Samanburður á dæmunum",
 q:"Úti: E = 10, σ = 10. Salur: E = 10, σ = 5. Hvað velur áhættufælinn einstaklingur?",
 o:["Salinn, því hann gefur sama vænta gildi með minni áhættu","Úti, því staðalfrávikið er hærra","Er alveg sama, því væntu gildin eru jöfn","Úti, því hann getur fengið 20","Hvorugt, hann sleppir viðburðinum"], a:0,
 e:"Einstaklingur með hvelft nytjafall tekur þann kost sem felur í sér minni áhættu af tveimur sem hafa sama vænta gildi. „Er alveg sama“ á við áhættuhlutlausan einstakling."},
{id:"o05", t:"ovi", src:"K18 · Væntar nytjar Sollu: dæmi 1",
 q:"Nytjafall Sollu er u(V) = √V. Úti: 20 kr. eða 0 kr. með 50% líkum hvort. Hverjar eru væntar nytjar hennar?",
 o:["Um 2,24","Um 3,16","10","Um 4,47","Um 3,05"], a:0,
 e:`<div class="f">u(20) = √20 = 4,47 · u(0) = 0<br>E(u) = 0,5 × 4,47 + 0,5 × 0 = 2,235</div>Gildrur: 3,16 = √10 = u(E(V)), nytjar af væntu gildi, ekki væntar nytjar. 10 er vænt gildi. 3,05 eru væntar nytjar af salnum.`},
{id:"o06", t:"ovi", src:"K18 · Væntar nytjar Sollu: dæmi 2",
 q:"u(V) = √V. Salur: 15 kr. eða 5 kr. með 50% líkum hvort. Hverjar eru væntar nytjar?",
 o:["Um 3,05","Um 3,16","Um 2,24","10","Um 3,87"], a:0,
 e:`<div class="f">u(15) = √15 = 3,87 · u(5) = √5 = 2,24<br>E(u) = 0,5 × 3,87 + 0,5 × 2,24 = 3,05</div>3,05 &gt; 2,235 (úti), svo Solla leigir sal. Gildra: 3,16 = √10 = nytjar af væntu gildi. Fyrir áhættufælinn einstakling er E(u) alltaf undir u(E(V)).`},
{id:"o07", t:"ovi", src:"K18 · Ákvarðanataka í óvissu",
 q:"Hvað segir það að nytjafall sé <b>hvelft</b> (minnkandi jaðarnytjar)?",
 o:["Einstaklingurinn er áhættufælinn","Einstaklingurinn er áhættusækinn","Einstaklingurinn er áhættuhlutlaus","Einstaklingurinn hámarkar vænt gildi","Einstaklingurinn kaupir aldrei tryggingu"], a:0,
